<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E4A48">
<title>Sabiá</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<script>try{var t=localStorage.getItem("sabia-tema");if(t==="claro"||t==="escuro")document.documentElement.setAttribute("data-theme",t==="escuro"?"dark":"light")}catch(e){}</script>
<style>
/* Sabiá v0.1.0 · sistema visual: petróleo + laranja sabiá · Bricolage Grotesque + Atkinson Hyperlegible */
:root{
  --bg:#EDF1F1;--surface:#FFFFFF;--surface2:#F5F8F8;--sunk:#E2E9E8;--ink:#122120;--ink2:#4A5C5B;--ink3:#6B7F7D;--line:#D5DEDD;
  --brand:#0E4A48;--brand-hi:#18645F;--on-brand:#E4F2F0;--on-brand-2:#9BC3BF;--brand-ink:#0F5A56;
  --sabia:#D45D17;--sabia-hi:#B84D10;--sabia-soft:#FBE6D8;--on-sabia:#FFFFFF;
  --ok:#1B7A4B;--ok-soft:#DCF0E4;--warn:#9A6200;--warn-soft:#F7EACD;--bad:#B3302A;--bad-soft:#F6DCD9;
  --e1:0 1px 2px rgb(18 33 32/.06),0 2px 8px rgb(18 33 32/.06);
  --e2:0 2px 4px rgb(18 33 32/.06),0 10px 28px rgb(18 33 32/.10);
  --e3:0 4px 10px rgb(18 33 32/.08),0 22px 56px rgb(18 33 32/.18);
  --f-disp:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:16px;--rs:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1514;--surface:#14201F;--surface2:#192826;--sunk:#0A1110;--ink:#E5EEED;--ink2:#A6B8B6;--ink3:#8CA19E;--line:#253634;
  --brand:#0A2F2E;--brand-hi:#15514D;--on-brand:#DDEDEB;--on-brand-2:#86AEA9;--brand-ink:#5CC2B9;
  --sabia:#EE7631;--sabia-hi:#FF8A47;--sabia-soft:#3A2416;--on-sabia:#1A0C04;
  --ok:#4FC587;--ok-soft:#14301F;--warn:#E3A83A;--warn-soft:#33270F;--bad:#F0716A;--bad-soft:#3A1715;
  --e1:0 1px 2px rgb(0 0 0/.3),0 2px 8px rgb(0 0 0/.25);--e2:0 2px 4px rgb(0 0 0/.3),0 10px 28px rgb(0 0 0/.35);--e3:0 4px 10px rgb(0 0 0/.35),0 22px 56px rgb(0 0 0/.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1514;--surface:#14201F;--surface2:#192826;--sunk:#0A1110;--ink:#E5EEED;--ink2:#A6B8B6;--ink3:#8CA19E;--line:#253634;
  --brand:#0A2F2E;--brand-hi:#15514D;--on-brand:#DDEDEB;--on-brand-2:#86AEA9;--brand-ink:#5CC2B9;
  --sabia:#EE7631;--sabia-hi:#FF8A47;--sabia-soft:#3A2416;--on-sabia:#1A0C04;
  --ok:#4FC587;--ok-soft:#14301F;--warn:#E3A83A;--warn-soft:#33270F;--bad:#F0716A;--bad-soft:#3A1715;
  --e1:0 1px 2px rgb(0 0 0/.3),0 2px 8px rgb(0 0 0/.25);--e2:0 2px 4px rgb(0 0 0/.3),0 10px 28px rgb(0 0 0/.35);--e3:0 4px 10px rgb(0 0 0/.35),0 22px 56px rgb(0 0 0/.5);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-disp);margin:0;letter-spacing:-.01em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mut{color:var(--ink2)}
.sm{font-size:13px}
:focus-visible{outline:2px solid var(--sabia);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* casca */
.app{display:grid;grid-template-columns:84px minmax(0,1fr);height:100dvh}
.rail{background:var(--brand);color:var(--on-brand);display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;padding-left:max(8px,env(safe-area-inset-left))}
.rail .lg{width:48px;height:48px;border-radius:16px;background:var(--brand-hi);display:grid;place-items:center;margin-bottom:10px;box-shadow:inset 0 1px 0 rgb(255 255 255/.14)}
.rail .lg svg{width:32px;height:32px}
.ri{width:68px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 6px;border:0;background:none;color:var(--on-brand-2);font-size:12px;font-weight:500;cursor:pointer;text-decoration:none;position:relative;border-radius:12px}
.ri .pill{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .15s}
.ri:hover .pill{background:rgb(255 255 255/.08)}
.ri[aria-current="page"]{color:#fff}
.ri[aria-current="page"] .pill{background:var(--sabia);color:var(--on-sabia)}
.ri .n{position:absolute;top:2px;right:8px;min-width:18px;height:18px;border-radius:9px;background:var(--sabia);color:var(--on-sabia);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.rail .sp{flex:1}
.mn{display:flex;flex-direction:column;min-width:0;min-height:0}
.tb{display:flex;align-items:center;gap:12px;padding:14px 24px 10px;padding-right:max(24px,env(safe-area-inset-right));flex-wrap:wrap}
.tb h1{font-size:24px;font-weight:800;line-height:1.1}
.tb .sub{color:var(--ink2);font-size:14px}
.tb .grow{flex:1}
.body{flex:1;overflow:auto;padding:4px 24px 24px;padding-right:max(24px,env(safe-area-inset-right));display:grid;gap:14px;align-content:start}
.bnav{display:none}

/* botões e campos */
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;color:var(--ink);box-shadow:var(--e1);white-space:nowrap}
.b:hover{border-color:var(--ink3)}
.b.p{background:var(--sabia);border-color:var(--sabia);color:var(--on-sabia)}
.b.p:hover{background:var(--sabia-hi)}
.b.s{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.b.g{box-shadow:none;background:transparent}
.b.ic{width:44px;padding:0;flex:none}
.b.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.b[disabled]{opacity:.5;cursor:not-allowed}
.b.bad{color:var(--bad)}
.fd{display:grid;gap:4px;min-width:0}
.fd label,.lbl{font-size:12px;font-weight:700;color:var(--ink2)}
.in{min-height:44px;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.k{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--e1);padding:14px 16px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--sunk);color:var(--ink2)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.br{background:var(--sabia-soft);color:var(--sabia-hi)}

/* início */
.home{grid-template-columns:repeat(12,minmax(0,1fr));align-items:start}
.coach{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--brand);color:var(--on-brand);border-color:transparent}
.coach .ms{width:52px;height:52px;border-radius:16px;background:var(--brand-hi);display:grid;place-items:center}
.coach .ms svg{width:34px;height:34px}
.coach .eb{font-size:12px;font-weight:700;color:var(--on-brand-2);text-transform:uppercase;letter-spacing:.06em}
.coach h2{font-size:20px;color:#fff;margin:2px 0}
.coach p{margin:0;color:var(--on-brand-2);font-size:14px}
.coach .acts{display:flex;gap:8px;flex-wrap:wrap}
.coach .b.g{color:var(--on-brand);border-color:var(--on-brand-2)}
.kpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:0}
.kp{padding:12px 16px;border-right:1px solid var(--line)}
.kp:last-child{border:0}
.kp .v{font-family:var(--f-disp);font-weight:800;font-size:28px;line-height:1.1}
.kp .l{font-size:13px;color:var(--ink2)}
.mini{grid-column:span 6}
.mini .kh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.mini h3{font-size:16px}
.rows{display:grid}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row>div{flex:1;min-width:0}
.row b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl{grid-column:1/-1;padding:0;overflow:hidden}

/* lista de treinamentos */
.tbar{display:flex;gap:10px;align-items:center;padding:12px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px}
.seg button{border:0;background:none;min-height:38px;padding:0 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink2);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--e1)}
.seg i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--ink3)}
.srch{position:relative;flex:1;min-width:180px}
.srch svg{position:absolute;left:12px;top:12px;color:var(--ink3);width:20px;height:20px}
.srch .in{padding-left:40px}
.fpan{display:flex;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--line)}
.tr{display:grid;grid-template-columns:minmax(0,2.4fr) 64px 92px 150px 276px;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.tr.h{border-top:0;font-size:12px;font-weight:700;color:var(--ink2);padding-block:8px;background:var(--surface2)}
.tr .t b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .t span{font-size:13px;color:var(--ink2)}
.tr .acts{display:flex;gap:6px;justify-content:flex-end}
.meta-bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:4px}
.meta-bar i{display:block;height:100%;background:var(--brand-ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:14px 16px}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;background:var(--surface)}
.card b{font-family:var(--f-disp);font-size:17px}
.vazio{padding:28px 16px;text-align:center;color:var(--ink2);display:grid;gap:10px;justify-items:center}

/* aplicar */
.apl{grid-template-columns:minmax(0,1fr) 340px;align-items:start}
.apl .lc{display:grid;gap:12px}
.sec h3{font-size:16px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.st{width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:13px;font-weight:700;font-family:var(--f-mono)}
.pres{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pr{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);text-align:left;cursor:pointer;display:grid;gap:4px;align-content:start}
.pr[aria-pressed="true"]{border-color:var(--sabia);background:var(--sabia-soft)}
.pr .pic{width:40px;height:40px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;color:var(--brand-ink);margin-bottom:2px}
.pr[aria-pressed="true"] .pic{background:var(--sabia);color:var(--on-sabia)}
.pr b{font-family:var(--f-disp);font-size:16px}
.pr span{font-size:13px;color:var(--ink2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.sc{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.sc[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
details.adv{padding:0}
details.adv summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;min-height:56px}
details.adv summary::-webkit-details-marker{display:none}
details.adv .chev{margin-left:auto;transition:transform .15s;display:grid;place-items:center;width:24px;height:24px}
details.adv .chev svg{width:20px;height:20px}
details.adv[open] .chev{transform:rotate(180deg)}
.advg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 20px;padding:4px 16px 16px;border-top:1px solid var(--line);padding-top:14px}
.opt{display:flex;gap:10px;align-items:flex-start;min-height:44px}
.opt input{width:22px;height:22px;margin-top:2px;accent-color:var(--sabia);flex:none}
.opt small{display:block;color:var(--ink2);font-size:12px;line-height:1.3}
.sum{position:sticky;top:4px;display:grid;gap:10px}
.sum .hd b{font-family:var(--f-disp);font-size:18px;display:block}
.tl{display:grid;gap:0}
.tli{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line);font-size:14px}
.tli:first-child{border-top:0}
.tli .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--f-mono)}
.nd.e{background:var(--sabia-soft);color:var(--sabia-hi);border-color:transparent}

/* ajustes e páginas simples */
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.page{max-width:980px}
.road{display:grid;gap:6px}
.road li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.road ul{list-style:none;margin:0;padding:0}
.road li:first-child{border-top:0}

/* diálogo e aviso */
dialog{border:0;border-radius:20px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--e3);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgb(8 20 19/.55)}
.dl{display:grid;gap:12px;padding:18px}
.dl header{display:flex;align-items:center;gap:10px}
.dl header h2{font-size:20px;flex:1}
.opcao{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;min-height:56px;cursor:pointer}
.opcao:hover{border-color:var(--sabia)}
.opcao .pic{width:40px;height:40px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;color:var(--brand-ink);flex:none}
.opcao b{display:block}
.opcao span.d{font-size:13px;color:var(--ink2)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;box-shadow:var(--e3);max-width:calc(100vw - 24px)}
#toast button{border:0;background:none;color:var(--sabia);font-weight:700;cursor:pointer;min-height:36px;padding:0 8px}
:root[data-theme="dark"] #toast button,:root:not([data-theme="light"]) #toast button{color:var(--sabia)}

@media (max-width:1100px){.apl{grid-template-columns:1fr}.sum{position:static}.mini{grid-column:1/-1}.kpis{grid-template-columns:repeat(2,1fr)}.kp:nth-child(2){border-right:0}.kp:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .rail{display:none}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--brand);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--on-brand-2);font-size:11px;font-weight:500;text-decoration:none;min-height:48px;justify-content:center;position:relative}
  .bnav a[aria-current="page"]{color:#fff}
  .bnav a[aria-current="page"] .pill{background:var(--sabia);color:var(--on-sabia)}
  .bnav .pill{width:48px;height:28px;border-radius:14px;display:grid;place-items:center}
  .tb{padding:12px 16px 8px}.tb h1{font-size:21px}
  .body{padding:4px 16px 16px}
  .coach{grid-template-columns:1fr}.coach .ms{display:none}.coach h2{font-size:18px}
  .tb{flex-wrap:nowrap}.tb .lbl-m{display:none}.tb .b.p{width:44px;padding:0}
  .pres,.fields,.cols,.advg{grid-template-columns:1fr}
  .pr{grid-template-columns:44px 1fr;column-gap:12px;align-items:center;padding:10px 12px}.pr .pic{grid-row:span 2;margin:0}.pr span:not(.pic){grid-column:2}
  .tr{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}
  .tr.h{display:none}.tr .hide-m{display:none}
  .tbar .srch{flex-basis:100%;order:3}
  #toast{bottom:calc(76px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== v0.2.0 · sala ao vivo e telão ===== */
.modo-telao .rail,.modo-telao .bnav,.modo-telao .tb{display:none!important}
.modo-telao .app{grid-template-columns:1fr;grid-template-rows:1fr}
.modo-telao .body{padding:0;overflow:hidden;background:#000;display:block}
.sala{grid-template-columns:minmax(0,420px) minmax(0,1fr);align-items:start}
.sala .lc{display:grid;gap:12px}
.chave{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chave .cod{font-family:var(--f-mono);font-weight:600;font-size:34px;letter-spacing:.08em;line-height:1}
.etapa{display:grid;gap:10px}
.etapa .eh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.etapa .et{font-family:var(--f-disp);font-size:20px;font-weight:800}
.etapa .tm{margin-left:auto;font-family:var(--f-mono);font-size:28px;font-weight:600}
.etapa .go{min-height:56px;font-size:17px;width:100%}
.pbar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--sabia);width:0;transition:width .25s linear}
.tl2{display:flex;gap:6px;flex-wrap:wrap}
.tl2 .nd{width:30px;height:30px;font-size:13px;background:var(--surface)}
.tl2 .nd.fe{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tl2 .nd.at{background:var(--sabia);color:var(--on-sabia);border-color:transparent}
.tl2 .nd.e{border-color:transparent}
.pgrid{display:flex;gap:6px;flex-wrap:wrap}
.pp{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;background:var(--surface)}
.pp.ok{border-color:var(--ok);background:var(--ok-soft)}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;font-size:12px;flex:none;width:26px;height:26px}
.dist{display:grid;gap:6px}
.dist .dr{display:grid;grid-template-columns:22px 1fr 40px;gap:8px;align-items:center;font-size:14px}
.dist .db{height:14px;border-radius:7px;background:var(--sunk);overflow:hidden}
.dist .db i{display:block;height:100%}
.rk{display:grid;gap:0}

.rk .rr:first-child{border-top:0}
.prev{position:sticky;top:4px;display:grid;gap:8px;padding:10px}
.telwrap{position:relative;border-radius:12px;overflow:hidden;background:#000;width:100%}
.telwrap>.tel{position:absolute;left:0;top:0;transform-origin:0 0}
.telfull{width:100vw;height:100vh;height:100dvh;position:relative;overflow:hidden;background:#000}
.telfull>.tel{position:absolute;left:50%;top:50%;transform-origin:0 0}
.sim{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* telão (1280×720 fixos, escalados) */
.tel{--tel-bg:#0A2C2B;--tel-bg2:#0F3836;--tel-card:#134240;--tel-ink:#F2F7F6;--tel-ink2:#A6C3C0;--tel-line:#22524F;--a1:#C9432B;--a2:#2A63C2;--a3:#C98F00;--a4:#2A8752;
  width:1280px;height:720px;background:var(--tel-bg);color:var(--tel-ink);font-family:var(--f-body);display:flex;flex-direction:column;overflow:hidden}
.tel.claro{--tel-bg:#F3F7F6;--tel-bg2:#E4ECEB;--tel-card:#FFFFFF;--tel-ink:#122120;--tel-ink2:#4A5C5B;--tel-line:#CBD8D6}
.tel .tt{display:flex;align-items:center;gap:14px;padding:18px 32px;border-bottom:1px solid var(--tel-line)}
.tel .tt b{font-family:var(--f-disp);font-size:24px}
.tel .tt span{color:var(--tel-ink2);font-size:17px}
.tel .grow{flex:1}
.tel .pillk{background:var(--sabia);color:#fff!important;font-weight:700;border-radius:999px;padding:6px 16px;font-family:var(--f-mono);letter-spacing:.06em;font-size:18px!important}
.tel .tfoot{margin-top:auto;padding:14px 32px;border-top:1px solid var(--tel-line);color:var(--tel-ink2);font-size:18px;display:flex;gap:10px;align-items:center}
.tel .tfoot b{color:var(--tel-ink)}
.tel .lobm{flex:1;display:grid;grid-template-columns:420px 1fr;gap:32px;padding:28px 32px;min-height:0}
.tel .join{background:var(--tel-card);border:1px solid var(--tel-line);border-radius:24px;padding:24px;display:grid;gap:16px;justify-items:center;align-content:start}
.tel .qr{background:#fff;border-radius:16px;padding:12px;width:244px;height:244px;display:grid;place-items:center}
.tel .qr canvas,.tel .qr img{width:220px!important;height:220px!important}
.tel .kl{color:var(--tel-ink2);font-size:18px;text-align:center}
.tel .kk{font-family:var(--f-mono);font-weight:600;font-size:64px;letter-spacing:.06em;line-height:1.05;text-align:center}
.tel .how{display:grid;gap:8px;font-size:18px;width:100%}
.tel .how div{display:flex;gap:10px;align-items:center}
.tel .how b{width:28px;height:28px;border-radius:50%;background:var(--sabia);color:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.tel .room{display:grid;grid-template-rows:auto auto 1fr;gap:16px;min-height:0}
.tel .crowd.g .cw{font-size:24px;padding:6px 20px 6px 6px}.tel .crowd.g .cw .av{width:44px;height:44px;font-size:17px}
.tel .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-self:end}
.tel .facts div{background:var(--tel-card);border:1px solid var(--tel-line);border-radius:18px;padding:14px 18px;display:grid;gap:2px}
.tel .facts b{font-family:var(--f-disp);font-size:40px;line-height:1.05}
.tel .facts span{color:var(--tel-ink2);font-size:18px}
.tel .rh{display:flex;align-items:baseline;gap:12px}
.tel .rh b{font-family:var(--f-disp);font-size:56px;line-height:1}
.tel .rh span{font-size:22px;color:var(--tel-ink2)}
.tel .crowd{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;overflow:hidden}
.tel .cw{display:flex;align-items:center;gap:8px;background:var(--tel-card);border:1px solid var(--tel-line);border-radius:999px;padding:5px 16px 5px 5px;font-size:19px}
.tel .cw .av{width:36px;height:36px;font-size:15px}
.tel .tq{padding:26px 32px 8px;display:flex;gap:28px;align-items:center}
.tel .tq h2{font-size:42px;line-height:1.12;flex:1;font-weight:800}
.tel .ring{width:120px;height:120px;position:relative;display:grid;place-items:center;font-family:var(--f-mono);font-size:44px;font-weight:600;flex:none}
.tel .ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.tel .tprog{display:flex;gap:6px}
.tel .tprog i{width:26px;height:8px;border-radius:4px;background:var(--tel-line)}
.tel .tprog i.d{background:var(--ok)}.tel .tprog i.c{background:var(--sabia)}
.tel .ttiles{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px 32px 14px;min-height:0}
.tel .tile{border-radius:20px;color:#fff;display:flex;align-items:center;gap:16px;padding:0 24px;font-size:30px;font-weight:700;line-height:1.15;position:relative;overflow:hidden}
.tel .tile .sh{width:46px;height:46px;flex:none}
.tel .tile .sh svg{width:100%;height:100%}
.tel .tile.off{opacity:.35}
.tel .tile .pc{margin-left:auto;font-family:var(--f-mono);font-size:30px;background:rgb(0 0 0/.28);border-radius:12px;padding:2px 12px}
.tel .tile.cor::after{content:"";position:absolute;inset:0;border:8px solid #fff;border-radius:20px}
.tel .ordl{flex:1;display:grid;gap:10px;padding:12px 32px 14px;align-content:center}
.tel .ordl div{background:var(--tel-card);border:1px solid var(--tel-line);border-radius:16px;padding:14px 22px;font-size:28px;font-weight:600;display:flex;gap:16px;align-items:center}
.tel .ordl b{width:38px;height:38px;border-radius:50%;background:var(--sabia);color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.tel .answ{display:flex;align-items:center;gap:14px;padding:12px 32px;border-top:1px solid var(--tel-line);font-size:20px}
.tel .bigc{font-family:var(--f-disp);font-weight:800;font-size:34px}
.tel .expl{flex:1;display:grid;align-content:center;gap:20px;padding:30px 80px}
.tel .expl h2{font-size:54px;line-height:1.1;font-weight:800}
.tel .expl p{font-size:30px;line-height:1.4;color:var(--tel-ink2);margin:0;max-width:30em}
.tel .podm{flex:1;display:grid;grid-template-columns:1fr 380px;gap:28px;padding:22px 32px;min-height:0}
.tel .podl{display:grid;grid-template-rows:auto auto 1fr;gap:14px;min-height:0}
.tel .pq{display:flex;gap:12px;align-items:flex-end;height:96px}
.tel .pq>div{flex:1;display:grid;justify-items:center;gap:2px;font-size:15px;color:var(--tel-ink2);max-width:90px}
.tel .pq .bar{display:flex;align-items:flex-end;width:100%;height:48px;background:var(--tel-card);border-radius:8px;overflow:hidden}
.tel .pq .bar i{display:block;width:100%;border-radius:6px 6px 0 0}
.tel .pq b{color:var(--tel-ink);font-size:17px}
.tel .podl h2{font-size:44px;font-weight:800}
.tel .res{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.tel .res span{background:var(--tel-card);border:1px solid var(--tel-line);border-radius:999px;padding:6px 16px;font-size:20px}
.tel .res .g{background:var(--ok);border-color:var(--ok);color:#fff}
.tel .res .r{background:var(--sabia);border-color:var(--sabia);color:#fff}
.tel .stage{display:flex;align-items:flex-end;justify-content:center;gap:16px;min-height:0}
.tel .pl{display:grid;justify-items:center;gap:8px;width:190px}
.tel .pl .av{width:84px;height:84px;font-size:32px}
.tel .pl.p1 .av{width:104px;height:104px;font-size:40px}
.tel .blk{width:100%;background:var(--tel-card);border:1px solid var(--tel-line);border-radius:18px 18px 0 0;padding:12px 8px;text-align:center;font-size:15px;color:var(--tel-ink2);display:grid;align-content:start;gap:2px}
.tel .blk b{font-family:var(--f-disp);font-size:34px;color:var(--sabia)}
.tel .blk strong{color:var(--tel-ink);font-size:19px}
.tel .podr{background:var(--tel-card);border:1px solid var(--tel-line);border-radius:20px;padding:16px 20px;display:grid;align-content:start;gap:0;overflow:hidden}
.tel .podr h3{font-size:20px;margin-bottom:6px}
.tel .podr .pr2{display:grid;grid-template-columns:30px 34px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--tel-line);font-size:18px}
.tel .podr .pr2 .av{width:34px;height:34px;font-size:14px}
.tel .vaz{flex:1;display:grid;place-items:center;text-align:center;gap:12px;padding:40px;font-size:30px;color:var(--tel-ink2)}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.conf i{position:absolute;top:-20px;width:12px;height:18px;border-radius:2px;animation:cai 3.6s linear infinite}
@keyframes cai{to{transform:translateY(760px) rotate(540deg)}}
@media (max-width:1100px){.sala{grid-template-columns:1fr}.prev{position:static}}
@media (max-width:760px){.tb .b[data-act=telao]{width:44px;padding:0}.tb .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw}}
@media (prefers-reduced-motion:reduce){.conf{display:none}}

/* ===== v0.3.0 · editor de perguntas e versões ===== */
.edit{display:grid;grid-template-columns:268px minmax(0,1fr) minmax(0,420px);gap:14px;align-items:start}
.edl{display:grid;gap:10px;position:sticky;top:0;min-width:0}

.edr{display:grid;gap:10px;min-width:0;position:sticky;top:0}

.ed-meta .full{grid-column:1/-1}
.ta{min-height:44px;padding:10px 12px;line-height:1.4;font:inherit;resize:vertical}
.qlist{display:grid;gap:2px;max-height:calc(100dvh - 330px);min-height:60px;overflow:auto;margin:0 -4px;padding:0 4px}
button.qi{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;min-height:52px;padding:6px 8px;border:1.5px solid transparent;border-radius:12px;background:transparent;cursor:pointer;color:var(--ink)}
button.qi:hover{background:var(--sunk)}
button.qi[aria-current="true"]{background:var(--sabia-soft);border-color:var(--sabia)}
.qn{width:28px;height:28px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--ink2)}
.qi[aria-current="true"] .qn{background:var(--sabia);color:var(--on-sabia)}
.qt{display:grid;min-width:0}
.qt b{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qt span{font-size:12px;color:var(--ink2)}
.qw{color:var(--warn);display:grid}
.adds{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.stt{font-size:13px;color:var(--ink2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.edh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.edh h2{font-size:19px;flex:1;min-width:120px}
.seg{display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:3px}
.seg button{flex:1;min-height:44px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:14px;color:var(--ink2);padding:0 8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--e1)}
.avs{display:flex;gap:6px;flex-wrap:wrap}
.avs:empty{display:none}
.alts{display:grid;gap:8px}
.alt{display:grid;grid-template-columns:44px 30px minmax(0,1fr) 44px;gap:6px;align-items:center}
.alt.o{grid-template-columns:30px minmax(0,1fr) 44px 44px 44px}
.alt.v{grid-template-columns:44px 30px minmax(0,1fr)}
.rd{display:grid;place-items:center;min-height:44px;cursor:pointer}
.rd input{width:22px;height:22px;accent-color:var(--ok);margin:0;cursor:pointer}
.shp{width:30px;height:30px;border-radius:9px;color:#fff;display:grid;place-items:center}
.shp svg{width:18px;height:18px}
.vfx{min-height:44px;display:flex;align-items:center;font-weight:600}
.dica{font-size:12px;color:var(--ink2);margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select.in{padding-right:8px}
.pvh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pvh b{font-size:13px;flex:1;min-width:130px}
.pvh .seg{width:auto}
.pvh .seg button{min-height:36px;font-size:13px;padding:0 12px}
.pvn{font-size:12px;color:var(--ink2);margin:0}
.vl{display:grid;gap:8px;max-height:46vh;overflow:auto}
.vr{display:grid;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.vr .vh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vr .vh .grow{flex:1}
.vr .nt{font-size:13px;color:var(--ink2)}
.df{display:grid;gap:4px;background:var(--sunk);border-radius:10px;padding:8px 10px;font-size:13px}
.df div{display:flex;gap:6px;align-items:baseline}
.df i{font-style:normal;font-weight:700;font-family:var(--f-mono);flex:none;width:18px}
.df .ad{color:var(--ok)}.df .rm{color:var(--bad)}.df .ch{color:var(--warn)}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:1180px){
  .edit{grid-template-columns:268px minmax(0,1fr)}
  .edr{grid-column:2;position:static}
}
@media (max-width:860px){
  .edit{grid-template-columns:1fr}
  .edl{display:contents}.edr{grid-column:auto;position:static}
  .edl>.k:nth-child(2){order:1}.edc{order:2}.edr{order:3}.ed-meta{order:4}
  .qlist{max-height:200px}
  .tb .b{flex:none}.tb>div:not(.grow){min-width:0}
  .tb h1{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:20px}
  .row2{grid-template-columns:1fr 1fr}
  .vs{grid-template-columns:1fr}
}

.rsm{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;padding:12px 14px}

.rsm span{font-size:12px;color:var(--ink2)}
.rsm .w b{color:var(--warn)}

co, anel e pulseira devem ser retirados antes de entrar.","alternativas":["Verdadeiro","Falso"],"correta":0,"tempo":15,"uso":"gincana","porque":"Adornos acumulam sujeira e podem cair."}]},{"id":"m-inc","titulo":"Como comunicar um problema ou acidente","meta":75,"descricao":"Modelo pronto. Revise com o seu material antes de aplicar.","itens":[{"tipo":"explicacao","enunciado":"Avisar logo evita que o problema cresça","texto":""},{"tipo":"multipla","enunciado":"Quando avisar o responsável sobre um problema ou acidente?","alternativas":["Só no fim da semana","O quanto antes","Só se alguém perguntar","Nunca, se for pequeno"],"correta":1,"tempo":30,"uso":"avaliacao","porque":"Quanto antes o responsável souber, mais cedo ele resolve e evita que se repita."},{"tipo":"multipla","enunciado":"O que não pode faltar no aviso?","alternativas":["Só o nome de quem viu","O que aconteceu, onde e quando","Nada, o responsável descobre","Só o horário"],"correta":1,"tempo":30,"uso":"avaliacao","porque":"Sem saber o que, onde e quando, fica difícil achar a causa e resolver."},{"tipo":"vf","enunciado":"Quase acidente, que não machucou ninguém, também deve ser avisado.","alternativas":["Verdadeiro","Falso"],"correta":0,"tempo":20,"uso":"avaliacao","porque":"O quase acidente mostra o risco antes que alguém se machuque."},{"tipo":"vf","enunciado":"Pode mexer no local do acidente antes de o responsável chegar, para arrumar tudo.","alternativas":["Verdadeiro","Falso"],"correta":1,"tempo":20,"uso":"avaliacao","porque":"Mexer apaga as pistas do que aconteceu. Só mexa se for preciso para socorrer alguém ou evitar outro risco."},{"tipo":"ordenar","enunciado":"Coloque as etapas na ordem certa.","alternativas":["Garantir a segurança de todos","Avisar o responsável","Registrar o que aconteceu","Acompanhar a solução"],"tempo":60,"uso":"avaliacao","porque":"Primeiro a segurança, depois o aviso, o registro e o acompanhamento: cada etapa depende da anterior."},{"tipo":"multipla","enunciado":"Quem deve avi const SETORES_PADRAO = ["Packing", "Laboratório", "Campo", "Almoxarifado", "Oficina", "Segurança"];
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ic = (n, x = "") => `<svg class="i" ${x} aria-hidden="true"><use href="#i-${n}"/></svg>`;
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
const dm = iso => { try { return new Date(iso).toLocaleDateString("pt-BR", {day:"2-digit", month:"2-digit"}); } catch(e) { return ""; } };
const isQ = i => i.tipo !== "explicacao";

/* ---------- dados: IndexedDB com reserva em localStorage ---------- */
const DB = {
  db: null,
  abrir() { return new Promise(ok => { try { const r = indexedDB.open("sabia", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => { DB.db = r.result; ok(true); }; r.onerror = () => ok(false); r.onblocked = () => ok(false); } catch(e) { ok(false); } }); },
  ler(k) { return new Promise(ok => { if (!DB.db) return ok(null); try { const q = DB.db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => ok(q.result ?? null); q.onerror = () => ok(null); } catch(e) { ok(null); } }); },
  gravar(k, v) { return new Promise(ok => { if (!DB.db) return ok(false); try { const t = DB.db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => ok(true); t.onerror = () => ok(false); } catch(e) { ok(false); } }); }
};
let S = null;
const novoEstado = () => ({v: 1, treinamentos: [], sessoes: [], pessoas: [], mensagens: [], cfg: {instrutor: "", empresa: "", local: "", setores: SETORES_PADRAO.slice(), tema: "auto"}});
let tSalvar = 0;
async function gravarAgora() {
  tSalvar = 0;
  const txt = JSON.stringify(S);
  const ok = await DB.gravar("estado", txt);
  if (!ok) { try { localStorage.setItem("sabia-estado", txt); } catch(e) { aviso("Sem espaço para guardar. Exporte seus dados em Ajustes."); } }
  else { try { localStorage.removeItem("sabia-estado"); } catch(e) {} }
}
/* grava no máximo a cada 120 ms, sempre o estado mais recente (sem adiar para sempre) */
function salvar() { if (!tSalvar) tSalvar = setTimeout(gravarAgora, 120); }
/* ao fechar ou recarregar com gravação pendente, guarda de forma síncrona e o próximo carregamento aproveita */
window.addEventListener("pagehide", () => { if (tSalvar && S) { try { localStorage.setItem("sabia-estado", JSON.stringify(S)); } catch(e) {} } });
async function carregar() {
  let txt = null;
  if (await DB.abrir()) txt = await DB.ler("estado");
  try { const ls = localStorage.getItem("sabia-estado"); if (ls) txt = ls; } catch(e) {}
  S = novoEstado();
  if (txt) { try { const o = JSON.parse(txt); if (o && o.v === 1) S = Object.assign(S, o, {cfg: Object.assign(S.cfg, o.cfg || {})}); } catch(e) {} }
}

/* ---------- tema ---------- */
function aplicarTema() {
  const t = S.cfg.tema;
  if (t === "claro") document.documentElement.setAttribute("data-theme", "light");
  else if (t === "escuro") document.documentElement.setAttribute("data-theme", "dark");
  else document.documentElement.removeAttribute("data-theme");
  try { localStorage.setItem("sabia-tema", t); } catch(e) {}

function roteiro(t) {
  const passos = []; let n = 0, seg = 0;
  t.itens.forEach(i => {
    if (i.tipo === "explicacao") { passos.push({n: "E", txt: i.enunciado, s: 120, e: true}); seg += 120; }
    else if (i.uso === "ensaio") { passos.push({n: "T", txt: i.enunciado + " (teste, não vale nota)", s: i.tempo || 20}); seg += i.tempo || 20; }
    else { n++; passos.push({n: String(n), txt: i.enunciado, s: i.tempo || 20}); seg += (i.tempo || 20) + 8; }
  });
  return {passos, min: Math.max(1, Math.round(seg / 60))};
}

const TIPOS = {multipla: "Múltipla escolha", vf: "Verdadeiro ou falso", ordenar: "Ordenar", explicacao: "Explicação"};
const TIPOS_CURTO = {multipla: "Múltipla", vf: "V ou F", ordenar: "Ordenar", explicacao: "Explicação"};
const USOS = {avaliacao: "Vale nota", gincana: "Gincana (vale nota)", ensaio: "Teste (não vale nota)"};
const TEMPOS = [10, 15, 20, 30, 45, 60, 90, 120];
const MAX_ALT = 4, MAX_ORD = 5;
const clone = o => JSON.parse(JSON.stringify(o));
const agora = () => new Date().toISOString();
const novoItem = tipo => ({
  explicacao: {tipo: "explicacao", enunciado: "", texto: ""},
  multipla: {tipo: "multipla", enunciado: "", alternativas: ["", "", "", ""], correta: null, tempo: 20, uso: "avaliacao", porque: ""},
  vf: {tipo: "vf", enunciado: "", alternativas: ["Verdadeiro", "Falso"], correta: null, tempo: 20, uso: "avaliacao", porque: ""},
  ordenar: {tipo: "ordenar", enunciado: "", alternativas: ["", "", ""], tempo: 45, uso: "avaliacao", porque: ""}
}[tipo]);

/* ---------- conferência de cada pergunta ---------- */
function problemasItem(it) {
  const p = [];
  if (!String(it.enunciado || "").trim()) p.push("Falta o enunciado");
  if (it.tipo === "multipla") {
    const a = it.alternativas || [];
    if (a.some(x => !String(x).trim())) p.push("Há alternativa em branco");
    if (!Number.isInteger(it.correta) || it.correta < 0 || it.correta >= a.length) p.push("Marque a resposta certa");
  } else if (it.tipo === "vf") {
    if (!Number.isInteger(it.correta) || it.correta < 0 || it.correta > 1) p.push("Marque verdadeiro ou falso");
  } else if (it.tipo === "ordenar") {
    const a = it.alternativas || [];
    if (a.length < 3) p.push("Use pelo menos 3 passos");
    if (a.some(x => !String(x).trim())) p.push("Há passo em branco");
  }
  return p;
}
const problemasTreino = t => t.itens.map((it, i) => ({i, m: problemasItem(it)})).filter(x => x.m.length);
const numeroItem = (t, i) => { const it = t.itens[i]; if (it.tipo === "explicacao") return "E"; if (it.uso === "ensaio") return "T"; return String(t.itens.slice(0, i + 1).filter(x => x.tipo !== "explicacao" && x.uso !== "ensaio").length); };

/* ---------- versões ---------- */
function garantirSnap(t) {
  const v = (t.versoes || []).find(x => x.n === t.versao);
  if (v && !v.itens && !t.sujo) { v.itens = clone(t.itens); v.titulo = t.titulo; v.meta = t.meta; }
}
function editou(t) { garantirSnap(t); t.sujo = true; t.atualizado = agora(); salvar(); }
function salvarVersao(t, nota) {

    corpo = `${topo(`<b>${it.ensaio ? "Pergunta de teste" : "Pergunta " + sn.numPerg + " de " + sn.totalPerg}</b>${prog(sn.numPerg)}`)}<div class="tq"><h2>${esc(it.enunciado)}</h2>${rev ? "" : rel}</div>${tiles}<div class="answ">${rodape}</div>`;
  } else if (f.etapa === "podio") {
    const r = sn.resumo, t = r.top, bl = (p, pos, h) => p ? `<div class="pl ${pos === 1 ? "p1" : ""}">${av(p.n)}<div class="blk" style="height:${h}px"><b>${pos}º</b><strong>${esc(p.n)}</strong>${p.ac} de ${r.nq} · ${p.pts} pts</div></div>` : "";

    corpo = `${topo(`<b>Resultado da turma</b><span>${esc(sn.titulo)}</span>`, `<span class="pillk">${sn.nPart} PESSOAS</span>`)}
      <div class="podm"><div class="podl"><div><h2>${r.metaOk ? "A turma bateu a meta" : "A turma ficou abaixo da meta"}</h2><div class="res"><span class="${r.metaOk ? "g" : "r"}">${r.pct}% de acerto · meta ${sn.meta}%</span><span>${r.efic} de ${sn.nPart} eficazes</span>${r.reforco ? `<span>${r.reforco} vão para o reforço</span>` : ""}</div></div>
        <div class="pq">${r.porPerg.map(q => `<div><span class="bar"><i style="height:${Math.max(4, q.pct)}%;background:${q.pct >= sn.meta ? "var(--ok)" : "var(--sabia)"}"></i></span><b>${q.pct}%</b><span>P${q.n}</span></div>`).join("")}</div>
        ${sn.ranking ? `<div class="stage">${bl(t[1], 2, 150)}${bl(t[0], 1, 205)}${bl(t[2], 3, 112)}</div>` : ""}</div>
        <div class="podr"><h3>${sn.ranking ? "Do 4º ao 10º" : "Resultado"}</h3>${sn.ranking ? t.slice(3).map((p, k) => `<div class="pr2"><b>${k + 4}º</b>${av(p.n)}<span>${esc(p.n.split(" ").length > 1 ? p.n.split(" ")[0] + " " + p.n.split(" ").slice(-1)[0] : p.n)}</span><span class="num">${p.pts}</span></div>`).join("") || `<span style="color:var(--tel-ink2);font-size:17px">Sem mais participantes.</span>` : `<span style="color:var(--tel-ink2);font-size:17px">O ranking está desligado nesta sessão.</span>`}</div></div>${conf}`;
  }
  return `<div class="tel${claro}">${corpo}</div>`;
}
function hidratarQR(root) {
  root.querySelectorAll("[data-qr]").forEach(el => {
    const url = el.dataset.qr;
    if (AO.qrc[url]) { el.innerHTML = `<img src="${AO.qrc[url]}" alt="QR para entrar na sala">`; return; }
    try { new QRCode(el, {text: url, width: 220, height: 220, colorDark: "#0A2C2B", colorLight: "#FFFFFF", correctLevel: QRCode.CorrectLevel.M});
      const cv = el.querySelector("canvas"); if (cv) AO.qrc[url] = cv.toDataURL(); } catch(e) { el.textContent = "QR indisponível"; }

}
function escalar() {
  document.querySelectorAll(".telwrap").forEach(w => { const k = w.clientWidth / 1280, t = w.firstElementChild; if (!t) return; w.style.height = (720 * k) + "px"; t.style.transform = `scale(${k})`; });
  document.querySelectorAll(".telfull").forEach(w => { const k = Math.min(innerWidth / 1280, innerHeight / 720), t = w.firstElementChild; if (!t) return; t.style.transform = `translate(${-640 * k}px,${-360 * k}px) scale(${k})`; });
}
function pintarTelao() { const w = $(".telfull"); if (!w) return; w.innerHTML = telaoHTML(AO.snap); hidratarQR(w); escalar(); tickTempo(); }
function vTelao(id) {
  document.body.classList.add("modo-telao"); $("#app").className = "body";
  $("#app").innerHTML = `<div class="telfull" role="img" aria-label="Telão da sala"></div>`;
  if (AO.snap && AO.snap.id !== id) AO.snap = null;

  if (AO.ch) AO.ch.postMessage({t: "oi", id});

function tickTempo() {
  const agora = Date.now();
  document.querySelectorAll("[data-fim]").forEach(el => {
    const fim = +el.dataset.fim, dur = +el.dataset.dur, rest = Math.max(0, fim - agora), fr = dur ? rest / dur : 0, k = el.dataset.k;
    if (k === "n") el.textContent = Math.ceil(rest / 1000);
    else if (k === "c") el.setAttribute("stroke-dashoffset", String(301.6 * (1 - fr)));
    else if (k === "b") el.style.width = (100 * (1 - fr)) + "%";
    else if (k === "t") { const s = Math.ceil(rest / 1000); el.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  });
}
function loopLive() {
  tickTempo();
  const s = AO.id && sala(AO.id);
  if (s && s.estado === "sala" && s.fase.etapa === "pergunta" && s.fase.dur && Date.now() >= s.fase.t0 + s.fase.dur) { irResultado(s); mudou(s); }
}
setInterval(loopLive, 250);
setInterval(() => { const s = AO.id && sala(AO.id); if (s && s.estado === "sala" && s.fase.etapa === "espera" && s.entrada && s.sim.on && s.part.length < s.sim.alvo && simAdd(s)) mudou(s); }, RAPIDO ? 40 : 700);
window.addEventListener("resize", escalar);

/* ---------- tela de controle ---------- */
function acaoPrincipal(s) {
  const f = s.fase, u = f.idx >= s.itens.length - 1;
  if (f.etapa === "espera") return {t: "Iniciar", i: "play", dis: !s.part.length};
  if (f.etapa === "pergunta") return {t: "Encerrar tempo e mostrar resposta", i: "check"};
  if (f.etapa === "podio") return {t: "Encerrar sessão e guardar", i: "check"};
  return {t: u ? "Ver o pódio" : "Próxima", i: "play"};
}
const ETAPA = {espera: "Sala de espera", explicacao: "Explicação", pergunta: "Pergunta no ar", resultado: "Resultado da pergunta", podio: "Pódio"};
function vSala(id) {
  const s = sala(id);
  if (!s || s.estado !== "sala") { topo("Sala ao vivo", "", "", "#/inicio"); $("#app").className = "body"; $("#app").innerHTML = `<div class="k vazio"><b>${s && s.estado === "encerrada" ? "Esta sessão já foi encerrada" : "Sala não encontrada"}</b><a class="b" href="#/treinos">Ir para Treinos</a></div>`; return; }
  AO.id = s.id; const f = s.fase, ap = acaoPrincipal(s), c = calc(s), it = s.itens[f.idx], sn = snap(s); AO.snap = sn;
  const respondeu = it && ehPergunta(it) ? s.part.filter(p => (s.resp[p.id] || {})[f.idx]) : [];
  let n = 0;
  const passos = s.itens.map((x, i) => { const e = !ehPergunta(x), t = x.uso === "ensaio"; if (!e && !t) n++; const rot = e ? "E" : t ? "T" : String(n); const cls = (f.idx > i || f.etapa === "podio") ? "fe" : (f.idx === i ? "at" : ""); return `<span class="nd ${e ? "e" : ""} ${cls}" title="${esc(x.enunciado)}">${rot}</span>`; }).join("");
  let dist = "";
  if (it && ehPergunta(it) && (f.etapa === "pergunta" || f.etapa === "resultado")) {
    if (it.tipo === "ordenar") { const ac = respondeu.filter(p => s.resp[p.id][f.idx].ok).length; dist = `<div class="sm mut">${respondeu.length} de ${s.part.length} responderam${f.etapa === "resultado" ? " · " + ac + " acertaram a ordem" : ""}</div>`; }
    else dist = `<div class="dist">${it.alternativas.map((a, k) => { const q = respondeu.filter(p => s.resp[p.id][f.idx].r === k).length, pc = respondeu.length ? Math.round(100 * q / respondeu.length) : 0; const certa = f.etapa === "resultado" && k === it.correta;
      return `<div class="dr" title="${esc(a)}"><span class="nd" style="background:${COR_ALT[k % 4]};color:#fff;border-color:transparent;width:22px;height:22px">${"ABCD"[k]}</span><div class="db"><i style="width:${pc}%;background:${certa ? "var(--ok)" : COR_ALT[k % 4]}"></i></div><span class="num">${q}</span></div>`; }).join("")}</div>`;
  }
  const tempo = f.etapa === "pergunta" && f.dur ? `<span class="tm" data-k="t" data-fim="${f.t0 + f.dur}" data-dur="${f.dur}">0:${String(Math.ceil(f.dur / 1000)).padStart(2, "0")}</span>` : "";
  const barra = f.etapa === "pergunta" && f.dur ? `<div class="pbar"><i data-k="b" data-fim="${f.t0 + f.dur}" data-dur="${f.dur}"></i></div>` : "";
  const msgWa = encodeURIComponent(`Treinamento "${s.titulo}". Entre pelo link: ${linkEntrar(s)} ou digite a chave ${fmtChave(s.chave)}.`);
  topo("Sala ao vivo", `${s.titulo} · ${s.part.length} pessoa${s.part.length === 1 ? "" : "s"}`, `<button class="b" data-act="telao" aria-label="Abrir telão">${ic("screen")}<span class="lbl-m">Abrir telão</span></button>`, "#/inicio");
  $("#app").className = "body sala";
  $("#app").innerHTML = `<div class="lc">
    <section class="k etapa" aria-live="polite"><div class="eh"><span class="chip br">${ETAPA[f.etapa]}</span>${it && f.etapa !== "espera" && f.etapa !== "podio" ? `<span class="sm mut">${ehPergunta(it) ? (it.uso === "ensaio" ? "pergunta de teste" : "pergunta " + sn.numPerg + " de " + sn.totalPerg) : "explicação"}</span>` : ""}${tempo}</div>
      ${it && f.etapa !== "espera" && f.etapa !== "podio" ? `<div style="font-weight:600">${esc(it.enunciado)}</div>` : ""}${barra}
      <button class="b p go" data-act="proxima" ${ap.dis ? "disabled" : ""}>${ic(ap.i)}${ap.t}</button>
      ${ap.dis ? `<span class="sm mut">Espere alguém entrar, ou ligue os participantes simulados abaixo.</span>` : ""}
      <div class="tl2" role="list" aria-label="Etapas">${passos}</div></section>
    <section class="k"><div class="chave"><div><div class="lbl">Chave da sala</div><div class="cod" id="cod">${fmtChave(s.chave)}</div></div><span class="chip ${s.entrada ? "ok" : "warn"}">${s.entrada ? "entrada aberta" : "entrada fechada"}</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="b sm" data-act="entrada">${s.entrada ? "Fechar entrada" : "Abrir entrada"}</button><button class="b sm" data-act="copiar" data-v="${esc(linkEntrar(s))}">${ic("copy", 'style="width:16px;height:16px"')}Copiar link</button><a class="b sm" target="_blank" rel="noopener" href="https://wa.me/?text=${msgWa}">Convidar no WhatsApp</a></div>
      <p class="sm mut" style="margin:10px 0 0">A entrada pelo celular chega na v0.4.0. Até lá, ensaie com participantes simulados.</p></section>
    <section class="k"><div class="kh" style="display:flex;align-items:center;gap:8px;margin-bottom:8px">${ic("people", 'style="color:var(--brand-ink)"')}<h3 style="font-size:16px">Participantes</h3><span class="chip">${s.part.length}</span>${respondeu.length || f.etapa === "pergunta" ? `<span class="chip ${respondeu.length === s.part.length && s.part.length ? "ok" : ""}">${respondeu.length} responderam</span>` : ""}</div>
      <div class="pgrid">${s.part.map(p => `<span class="pp ${respondeu.includes(p) ? "ok" : ""}">${av(p.nome)}${esc(p.nome.split(" ")[0])}</span>`).join("") || '<span class="sm mut">Ninguém entrou ainda.</span>'}</div>
      <div class="sim" style="margin-top:10px"><label class="opt" style="min-height:40px"><input type="checkbox" data-sim="on" ${s.sim.on ? "checked" : ""}><span>Simular participantes</span></label><label class="sr" for="simn">Quantidade</label><input class="in" id="simn" type="number" min="1" max="24" value="${s.sim.alvo}" data-sim="alvo" style="width:84px"><button class="b sm" data-act="simmais">${ic("plus", 'style="width:16px;height:16px"')}Mais um</button></div></section>
    ${dist ? `<section class="k"><h3 style="font-size:16px;margin-bottom:8px">Respostas desta pergunta</h3>${dist}</section>` : ""}

    <button class="b g bad" data-act="fechar-sala" style="justify-self:start">${ic("x")}Encerrar sala</button></div>

      <div class="telwrap">${telaoHTML(sn)}</div><span class="sm mut">Esta prévia mostra o mesmo que o telão. Em outra janela ou projetor, use "Abrir em outra tela".</span></aside>`;
  hidratarQR($("#app")); escalar(); tickTempo();
}

/* ---------- eventos da sala ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return; const a = el.dataset.act;
  const r = rota(), s = r.id ? sala(r.id) : null;
  if (a === "abrirsala") abrirSalaNova();
  else if (a === "voltarsala") { const x = sala(el.dataset.id); if (x) { x.estado === "sala" ? (AO.id = x.id, ir("#/sala/" + x.id)) : abrirSalaDe(x); } }
  else if (a === "proxima" && s) {
    if (s.fase.etapa === "espera" && !s.part.length) return;
    proxima(s);
  }
  else if (a === "entrada" && s) { s.entrada = !s.entrada; mudou(s); }
  else if (a === "simmais" && s) { if (!simAdd(s)) aviso("Todos os nomes de teste já entraram"); else { s.sim.alvo = Math.max(s.sim.alvo, s.part.length); mudou(s); } }
  else if (a === "copiar") { try { navigator.clipboard.writeText(el.dataset.v).then(() => aviso("Link copiado"), () => aviso("Não deu para copiar. Selecione o link e copie.")); } catch(e2) { aviso("Não deu para copiar. Selecione o link e copie."); } }
  else if (a === "telao" && s) {
    const w = window.open(linkTelao(s), "sabia-telao", "popup,width=1280,height=720");
    if (!w) { try { navigator.clipboard.writeText(linkTelao(s)); } catch(e3) {} aviso("O navegador bloqueou a janela. Libere pop-ups ou cole o link do telão (copiado) em outra aba."); }
  }
  else if (a === "fechar-sala" && s) {
    const d = $("#dlg"); d.innerHTML = `<div class="dl"><header><h2>Encerrar a sala?</h2><button class="b ic g" data-act="fechar" aria-label="Fechar">${ic("x")}</button></header><p style="margin:0">${s.part.length ? "O que foi respondido até aqui fica guardado em Encerradas." : "Ninguém entrou, então a sala será apenas fechada."}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="b" data-act="fechar">Continuar a sessão</button><button class="b p" data-act="encerrar-ok" data-id="${s.id}">Encerrar sala</button></div></div>`; d.showModal();
  }

document.addEventListener("change", e => {
  const t = e.target; if (!t.dataset.sim) return; const s = sala(rota().id); if (!s) return;
  if (t.dataset.sim === "on") s.sim.on = t.checked; else s.sim.alvo = Math.min(24, Math.max(1, Math.round(Number(t.value)) || 1));
  salvar(); render();
});

function render() {
  if (!S) return;
  const r = rota(); menu(r.v);
  document.body.classList.toggle("modo-telao", r.v === "telao");
  if (r.v === "inicio") vInicio();
  else if (r.v === "treinos") vTreinos();
  else if (r.v === "aplicar") vAplicar(r.id);
  else if (r.v === "editar") vEditar(r.id);
  else if (r.v === "sala") vSala(r.id);
  else if (r.v === "telao") vTelao(r.id);
  else if (r.v === "ajustes") vAjustes();
  else if (FUTURO[r.v]) vFuturo(r.v);
  else { location.replace("#/inicio"); return; }
  document.title = "Sabiá" + (r.v === "inicio" ? "" : " · " + (($("#tb h1") || {}).textContent || ""));
}
let ultimaRota = "";
window.addEventListener("hashchange", () => { const r = rota(); if (r.v !== ultimaRota) { ultimaRota = r.v; const m = $("#app"); render(); m && m.scrollTo && m.scrollTo(0, 0); } else render(); });
(async function init() {

  if (new URLSearchParams(location.search).get("demo") === "1" && !S.treinamentos.length) { MODELOS.forEach(m => criarDeModelo(m)); }
