/* EFC · tokens da família (Claro e Escuro) — extraídos do EFCwork v0.6.16 base.css. Cole no começo do CSS do Sabiá.

  --tx:#1e1b14;--tx2:#5b5443;--tx3:#746c55; /* v0.6.15 ITEM 10: era #8d846c (3,4 de contraste); agora 4,5 a 5,2 */

  --arC:#2f7d4f;--arPF:#f2f8f4;--arXF:#fcf6e6;--arPB:#bcdcc8;--arXB:#e7d39f;--arFB:#e9e3d5;

}

   Regras da família: nada de animação infinita que não informe nada (exceção aprovada: o reflexo do botão dourado);

:root{

  --duration-medium:350ms;   /* fechar gaveta ou folha, abrir aviso */

  --ease-in-out:ease-in-out;                     /* trocar ícone ou texto */

/* v1.6.0 · ponte: os nomes antigos do Sabiá passam a ler os tokens da família EFC (claro marfim e ouro, escuro dourado) */
:root{
  --bg:var(--bg0);--surface:var(--bg1);--surface2:var(--bg2);--sunk:var(--bg2);--ink:var(--tx);--ink2:var(--tx2);--ink3:var(--tx3);--line:var(--bd);

h1,h2,h3{font-family:var(--f-disp);font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}

.app{display:grid;grid-template-columns:84px minmax(0,1fr);height:100dvh}

.pr{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);text-align:left;cursor:pointer;display:grid;gap:4px;align-content:start}
.pr[aria-pressed="true"]{border-color:var(--sabia);background:var(--sabia-soft)}
.pr .pic{width:40px;height:40px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;color:var(--brand-ink);margin-bottom:2px}
.pr[aria-pressed="true"] .pic{background:var(--sabia);color:var(--on-sabia)}

.pr span{font-size:13px;color:var(--ink2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.sc{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.sc[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
details.adv{padding:0}
details.adv summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;min-height:56px}
details.adv summary::-webkit-details-marker{display:none}
details.adv .chev{margin-left:auto;transition:transform .15s;display:grid;place-items:center;width:24px;height:24px}
details.adv .chev svg{width:20px;height:20px}
details.adv[open] .chev{transform:rotate(180deg)}
.advg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 20px;padding:4px 16px 16px;border-top:1px solid var(--line);padding-top:14px}
.opt{display:flex;gap:10px;align-items:flex-start;min-height:44px}
.opt input{width:22px;height:22px;margin-top:2px;accent-color:var(--sabia);flex:none}
.opt small{display:block;color:var(--ink2);font-size:12px;line-height:1.3}
.sum{position:sticky;top:4px;display:grid;gap:10px}
.sum .hd b{font-family:var(--f-disp);font-size:18px;display:block}
.tl{display:grid;gap:0}
.tli{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line);font-size:14px}
.tli:first-child{border-top:0}
.tli .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--f-mono)}
.nd.e{background:var(--sabia-soft);color:var(--sabia-hi);border-color:transparent}

/* ajustes e páginas simples */
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.page{max-width:980px}
.road{display:grid;gap:6px}
.road li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.road ul{list-style:none;margin:0;padding:0}
.road li:first-child{border-top:0}

/* diálogo e aviso */
dialog{border:0;border-radius:20px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--e3);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgb(8 20 19/.55)}
.dl{display:grid;gap:12px;padding:18px}
.dl header{display:flex;align-items:center;gap:10px}
.dl header h2{font-size:20px;flex:1}
.opcao{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;min-height:56px;cursor:pointer}
.opcao:hover{border-color:var(--sabia)}
.opcao .pic{width:40px;height:40px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;color:var(--brand-ink);flex:none}
.opcao b{display:block}
.opcao span.d{font-size:13px;color:var(--ink2)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;box-shadow:var(--e3);max-width:calc(100vw - 24px)}
#toast button{border:0;background:none;color:var(--sabia);font-weight:700;cursor:pointer;min-height:36px;padding:0 8px}

@media (max-width:1100px){.apl{grid-template-columns:1fr}.sum{position:static}.mini{grid-column:1/-1}.kpis{grid-template-columns:repeat(2,1fr)}.kp:nth-child(2){border-right:0}.kp:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .rail{display:none}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--brand);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--on-brand-2);font-size:11px;font-weight:500;text-decoration:none;min-height:48px;justify-content:center;position:relative}
  .bnav a[aria-current="page"]{color:#fff}
  .bnav a[aria-current="page"] .pill{background:var(--sabia);color:var(--on-sabia)}
  .bnav .pill{width:48px;height:28px;border-radius:14px;display:grid;place-items:center}
  .tb{padding:12px 16px 8px}.tb h1{font-size:21px}
  .body{padding:4px 16px 16px}
  .coach{grid-template-columns:1fr}.coach .ms{display:none}.coach h2{font-size:18px}
  .tb{flex-wrap:nowrap}.tb .lbl-m{display:none}.tb .b.p{width:44px;padding:0}
  .pres,.fields,.cols,.advg{grid-template-columns:1fr}
  .pr{grid-template-columns:44px 1fr;column-gap:12px;align-items:center;padding:10px 12px}.pr .pic{grid-row:span 2;margin:0}.pr span:not(.pic){grid-column:2}
  .tr{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}
  .tr.h{display:none}.tr .hide-m{display:none}
  .tbar .srch{flex-basis:100%;order:3}
  #toast{bottom:calc(76px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== v0.2.0 · sala ao vivo e telão ===== */
.modo-telao .rail,.modo-telao .bnav,.modo-telao .tb{display:none!important}

.tl2 .nd.e{border-color:transparent}
.pgrid{display:flex;gap:6px;flex-wrap:wrap}
.pp{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;background:var(--surface)}

.rk{display:grid;gap:0}

.telfull>.tel{position:absolute;left:50%;top:50%;transform-origin:0 0}
.sim{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sim input[type=number]{width:84px}

/* telão (1280×720 fixos, escalados)
   v1.6.0 parte 4 (Fatia E): cores da família EFC, com tema próprio do telão (escuro dourado ou claro marfim, escolhido na sessão,
   independente do tema do app). Letras numa escala de 6 tamanhos (18, 22, 28, 34, 44, 64), cantos de 2 tipos (16 e 8) mais o círculo.
   As 4 cores e formas das alternativas não mudam: são função do quiz. */
.tel{--tel-bg:#0b0d16;--tel-bg2:#121524;--tel-card:#181c2e;--tel-ink:#f3eee3;--tel-ink2:#bcb3a1;--tel-line:#2a2b3b;
  --tel-a:#d9b46a;--tel-aS:rgba(217,180,106,.15);--tel-aTx:#f0d48f;--tel-onA:#1c1406;--tel-ok:#7fbf98;--tel-anel:#fff;--tel-r:16px;--tel-rs:8px;
  --a1:#C9432B;--a2:#2A63C2;--a3:#C98F00;--a4:#2A8752;
  width:1280px;height:720px;background:var(--tel-bg);color:var(--tel-ink);font-family:var(--f-body);display:flex;flex-direction:column;overflow:hidden;position:relative}
.tel.claro{--tel-bg:#f7f5ef;--tel-bg2:#f2eee4;--tel-card:#fffefb;--tel-ink:#1e1b14;--tel-ink2:#5b5443;--tel-line:#e6dfcf;
  --tel-a:#9a7128;--tel-aS:rgba(154,113,40,.12);--tel-aTx:#7d5a1c;--tel-onA:#fffefb;--tel-ok:#2f7d4f;--tel-anel:var(--tel-ink)}
.tel h2,.tel h3{font-family:var(--f-disp);font-weight:600;letter-spacing:0}
.tel .tt{display:flex;align-items:center;gap:14px;padding:18px 32px;border-bottom:1px solid var(--tel-line)}
.tel .tt b{font-family:var(--f-disp);font-weight:600;font-size:28px}
.tel .tt span{color:var(--tel-ink2);font-size:18px}
.tel .grow{flex:1}
.tel .pillk{background:var(--tel-aS);color:var(--tel-aTx)!important;font-weight:600;border-radius:999px;padding:6px 18px;font-size:18px!important}
.tel .pillk b{font-family:var(--f-mono);font-size:18px;font-weight:600;color:inherit}
.tel .tfoot{margin-top:auto;padding:14px 32px;border-top:1px solid var(--tel-line);color:var(--tel-ink2);font-size:18px;display:flex;gap:10px;align-items:center}
.tel .tfoot b{color:var(--tel-ink)}
.tel .lobm{flex:1;display:grid;grid-template-columns:420px 1fr;gap:32px;padding:28px 32px;min-height:0}
.tel .join{background:var(--tel-card);border:1px solid var(--tel-line);border-radius:var(--tel-r);padding:24px;display:grid;gap:16px;justify-items:center;align-content:start}
.tel .qr{background:#fff;border-radius:var(--tel-r);padding:12px;width:244px;height:244px;display:grid;place-items:center}
.tel .qr canvas,.tel .qr img{width:220px!important;height:220px!important}
.tel .kl{color:var(--tel-ink2);font-size:18px;text-align:center}
.tel .kk{font-family:var(--f-mono);font-weight:600;font-size:64px;line-height:1.05;text-align:center}
.tel .how{display:grid;gap:8px;font-size:18px;width:100%}
.tel .how div{display:flex;gap:10px;align-items:center}
.tel .how b{width:30px;height:30px;border-radius:50%;background:var(--tel-aS);color:var(--tel-aTx);display:grid;place-items:center;font-size:18px;flex:none}
.tel .room{display:grid;grid-template-rows:auto auto 1fr;gap:16px;min-height:0}
.tel .crowd.g .cw{font-size:22px;padding:6px 20px 6px 6px}.tel .crowd.g .cw .av{width:44px;height:44px;font-size:18px}
.tel .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-self:end}
.tel .facts div{background:var(--tel-card);border:1px solid var(--tel-line);border-radius:var(--tel-r);padding:14px 18px;display:grid;gap:2px}
.tel .facts b{font-family:var(--f-disp);font-weight:600;font-size:44px;line-height:1.05}
.tel .facts span{color:var(--tel-ink2);font-size:18px}
.tel .rh{display:flex;align-items:baseline;gap:12px}
.tel .rh b{font-family:var(--f-disp);font-weight:600;font-size:64px;line-height:1}
.tel .rh span{font-size:22px;color:var(--tel-ink2)}
.tel .ning{font-size:22px;color:var(--tel-ink2)}
.tel .crowd{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;overflow:hidden}
.tel .cw{display:flex;align-items:center;gap:8px;background:var(--tel-card);border:1px solid var(--tel-line);border-radius:999px;padding:5px 16px 5px 5px;font-size:18px}
.tel .cw .av{width:36px;height:36px;font-size:18px}
.tel .tq{padding:26px 32px 8px;display:flex;gap:28px;align-items:center}
.tel .tq h2{font-size:44px;line-height:1.12;flex:1}
.tel .ring{width:120px;height:120px;position:relative;display:grid;place-items:center;font-family:var(--f-mono);font-size:44px;font-weight:600;flex:none}
.tel .ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.tel .tprog{display:flex;gap:6px}
.tel .tprog i{width:26px;height:8px;border-radius:999px;background:var(--tel-line)}
.tel .tprog i.d{background:var(--tel-ok)}.tel .tprog i.c{background:var(--tel-a)}
.tel .ttiles{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px 32px 14px;min-height:0}
.tel .tile{border-radius:var(--tel-r);color:var(--altTx);display:flex;align-items:center;gap:16px;padding:0 24px;font-size:34px;font-weight:700;line-height:1.15;position:relative;overflow:hidden}
.tel .tile>*{position:relative;z-index:1}
/* amarelo: a letra fica escura para ler bem (a cor da alternativa continua a mesma) */
.tel .tile.k2{color:var(--altTxEsc)}
.tel .tile .sh{width:46px;height:46px;flex:none}
.tel .tile .sh svg{width:100%;height:100%}
/* no resultado, as erradas ganham um véu da cor do fundo (a letra continua legível) e a certa ganha o contorno */
.tel .tile.off::before{content:"";position:absolute;inset:0;background:var(--tel-bg);opacity:.72;z-index:0}
.tel .tile.off{color:var(--tel-ink)}
.tel .tile .pc{margin-left:auto;font-family:var(--f-mono);font-size:28px;background:rgb(0 0 0/.28);color:var(--altTx);border-radius:var(--tel-rs);padding:2px 12px}
.tel .tile.off .pc{background:var(--tel-card);color:var(--tel-ink)}
.tel .tile.cor::after{content:"";position:absolute;inset:0;border:8px solid var(--tel-anel);border-radius:var(--tel-r);z-index:2}
.tel .ordl{flex:1;display:grid;gap:10px;padding:12px 32px 14px;align-content:center}
.tel .ordl div{background:var(--tel-card);border:1px solid var(--tel-line);border-radius:var(--tel-r);padding:14px 22px;font-size:28px;font-weight:600;display:flex;gap:16px;align-items:center}
.tel .ordl b{width:40px;height:40px;border-radius:50%;background:var(--tel-a);color:var(--tel-onA);display:grid;place-items:center;font-size:22px;flex:none}
.tel .answ{display:flex;align-items:center;gap:14px;padding:12px 32px;border-top:1px solid var(--tel-line);font-size:22px;min-height:68px}
.tel .answ .porq{margin-left:18px;color:var(--tel-ink2);flex:1;font-size:22px}
.tel .answ .mut{color:var(--tel-ink2)}
.tel .bigc{font-family:var(--f-disp);font-weight:600;font-size:34px}
.tel .expl{flex:1;display:grid;align-content:center;gap:20px;padding:30px 80px}
.tel .expl h2{font-size:64px;line-height:1.1}
.tel .expl p{font-size:28px;line-height:1.4;color:var(--tel-ink2);margin:0;max-width:30em}
.tel .podm{flex:1;display:grid;grid-template-columns:1fr 380px;gap:28px;padding:22px 32px;min-height:0}
.tel .podl{display:grid;grid-template-rows:auto auto 1fr;gap:14px;min-height:0}
.tel .pq{display:flex;gap:12px;align-items:flex-end;height:104px}
.tel .pq>div{flex:1;display:grid;justify-items:center;gap:2px;font-size:18px;color:var(--tel-ink2);max-width:90px}
.tel .pq .bar{display:flex;align-items:flex-end;width:100%;height:48px;background:var(--tel-card);border-radius:var(--tel-rs);overflow:hidden}
.tel .pq .bar i{display:block;width:100%;border-radius:var(--tel-rs) var(--tel-rs) 0 0;transform-origin:50% 100%}
.tel .pq b{color:var(--tel-ink);font-size:18px}
.tel .podl h2{font-size:44px}
.tel .res{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.tel .res span{background:var(--tel-card);border:1px solid var(--tel-line);border-radius:999px;padding:6px 16px;font-size:22px}
.tel .res .g{background:var(--tel-ok);border-color:var(--tel-ok);color:var(--tel-bg)}
.tel .res .r{background:var(--tel-aS);border-color:transparent;color:var(--tel-aTx)}
.tel .stage{display:flex;align-items:flex-end;justify-content:center;gap:16px;min-height:0}
.tel .pl{display:grid;justify-items:center;gap:8px;width:190px}
.tel .pl .av{width:84px;height:84px;font-size:34px}
.tel .pl.p1 .av{width:104px;height:104px;font-size:44px}
.tel .blk{width:100%;background:var(--tel-card);border:1px solid var(--tel-line);border-radius:var(--tel-r) var(--tel-r) 0 0;padding:10px 8px 6px;text-align:center;font-size:18px;line-height:1.3;color:var(--tel-ink2);display:grid;align-content:start;gap:2px;transform-origin:50% 100%}
.tel .blk b{font-family:var(--f-disp);font-weight:600;font-size:28px;line-height:1.1;color:var(--tel-a)}
.tel .blk strong{color:var(--tel-ink);font-size:18px;line-height:1.15;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tel .podr{background:var(--tel-card);border:1px solid var(--tel-line);border-radius:var(--tel-r);padding:16px 20px;display:grid;align-content:start;gap:0;overflow:hidden}
.tel .podr h3{font-size:22px;margin-bottom:6px}
.tel .podr .pr2{display:grid;grid-template-columns:30px 34px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--tel-line);font-size:18px}
.tel .podr .pr2 .av{width:34px;height:34px;font-size:18px}
.tel .podr .nada{color:var(--tel-ink2);font-size:18px}
.tel .vaz{flex:1;display:grid;place-items:center;text-align:center;gap:12px;padding:40px;font-size:28px;color:var(--tel-ink2)}
.tel .vaz b{font-family:var(--f-disp);font-weight:600;font-size:44px;color:var(--tel-ink)}
/* festa do pódio: papéis coloridos que saem uma vez de cima do 1º lugar (500 ms), nada que cai sem parar */
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.conf i{position:absolute;width:10px;height:16px;border-radius:2px;opacity:0}

@media (max-width:760px){.tb .b[data-act=telao]{width:44px;padding:0}.tb .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw}}
@media (prefers-reduced-motion:reduce){.conf{display:none}}

.pp .px{display:grid;place-items:center;width:24px;height:24px;border:0;background:transparent;color:var(--ink2);cursor:pointer;border-radius:50%;padding:0;margin-left:2px}
.pp .px:hover{color:var(--bad)}
/* v1.5.1: conferindo respostas (1 s antes do resultado). v1.6.0 parte 4: no lugar da roda que girava sem parar,
   três pontos que acendem uma vez, um depois do outro, e ficam acesos */
.cf-pt{display:inline-flex;gap:6px;flex:none}
.cf-pt i{width:10px;height:10px;border-radius:50%;background:var(--tel-a,var(--a))}
.tel .answ .cf-pt i{width:12px;height:12px}
.tel .answ .cf-tx{font-weight:600;font-size:22px}

/* ===== v0.3.0 · editor de perguntas e versões ===== */
.edit{display:grid;grid-template-columns:268px minmax(0,1fr) minmax(0,420px);gap:14px;align-items:start}
.edl{display:grid;gap:10px;position:sticky;top:0;min-width:0}
.edc{display:grid;gap:12px;min-width:0}
.edr{display:grid;gap:10px;min-width:0;position:sticky;top:0}
.ed-meta{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px}
.ed-meta .full{grid-column:1/-1}
.ta{min-height:44px;padding:10px 12px;line-height:1.4;font:inherit;resize:vertical}
.qlist{position:relative;display:grid;gap:2px;max-height:calc(100dvh - 330px);min-height:60px;overflow:auto;margin:0 -4px;padding:0 4px}
button.qi{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;min-height:52px;padding:6px 8px;border:1.5px solid transparent;border-radius:12px;background:transparent;cursor:pointer;color:var(--ink)}
button.qi:hover{background:var(--sunk)}
button.qi[aria-current="true"]{background:var(--sabia-soft);border-color:var(--sabia)}
.qn{width:28px;height:28px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--ink2)}
.qi[aria-current="true"] .qn{background:var(--sabia);color:var(--on-sabia)}
.qt{display:grid;min-width:0}
.qt b{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qt span{font-size:12px;color:var(--ink2)}
.qw{color:var(--warn);display:grid}
.adds{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.adds .b{min-height:40px;padding:0 8px;font-size:13px;gap:6px}
.stt{font-size:13px;color:var(--ink2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.edh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.edh h2{font-size:19px;flex:1;min-width:120px}
.seg{display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:3px}
.seg button{flex:1;min-height:44px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:14px;color:var(--ink2);padding:0 8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--e1)}
.avs{display:flex;gap:6px;flex-wrap:wrap}
.avs:empty{display:none}
.alts{display:grid;gap:8px}
.alt{display:grid;grid-template-columns:44px 30px minmax(0,1fr) 44px;gap:6px;align-items:center}
.alt.o{grid-template-columns:30px minmax(0,1fr) 44px 44px 44px}
.alt.v{grid-template-columns:44px 30px minmax(0,1fr)}
.rd{display:grid;place-items:center;min-height:44px;cursor:pointer}
.rd input{width:22px;height:22px;accent-color:var(--ok);margin:0;cursor:pointer}
.shp{width:30px;height:30px;border-radius:9px;color:#fff;display:grid;place-items:center}
.shp svg{width:18px;height:18px}
.vfx{min-height:44px;display:flex;align-items:center;font-weight:600}
.dica{font-size:12px;color:var(--ink2);margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select.in{padding-right:8px}
.pvh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pvh b{font-size:13px;flex:1;min-width:130px}
.pvh .seg{width:auto}
.pvh .seg button{min-height:36px;font-size:13px;padding:0 12px}
.pvn{font-size:12px;color:var(--ink2);margin:0}
.vl{display:grid;gap:8px;max-height:46vh;overflow:auto}
.vr{display:grid;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.vr .vh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vr .vh .grow{flex:1}
.vr .nt{font-size:13px;color:var(--ink2)}
.df{display:grid;gap:4px;background:var(--sunk);border-radius:10px;padding:8px 10px;font-size:13px}
.df div{display:flex;gap:6px;align-items:baseline}
.df i{font-style:normal;font-weight:700;font-family:var(--f-mono);flex:none;width:18px}
.df .ad{color:var(--ok)}.df .rm{color:var(--bad)}.df .ch{color:var(--warn)}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:1340px){ /* v1.6.0: +156 px do menu lateral com nomes */
  .edit{grid-template-columns:268px minmax(0,1fr)}
  .edr{grid-column:2;position:static}
}
@media (max-width:860px){
  .edit{grid-template-columns:1fr}
  .edl{display:contents}.edr{grid-column:auto;position:static}
  .edl>.k:nth-child(2){order:1}.edc{order:2}.edr{order:3}.ed-meta{order:4}
  .qlist{max-height:200px}
  .tb .b{flex:none}.tb>div:not(.grow){min-width:0}
  .tb h1{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:20px}
  .row2{grid-template-columns:1fr 1fr}
  .vs{grid-template-columns:1fr}
}

.rsm{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;padding:12px 14px}
.rsm div{display:grid;gap:0;text-align:left}
.rsm b{font-family:var(--f-disp);font-size:20px;line-height:1.2}
.rsm span{font-size:12px;color:var(--ink2)}
.rsm .w b{color:var(--warn)}

/* v0.6.0 */

/* ===== v0.4.0 · celular do participante ===== */
.modo-cel .rail,.modo-cel .bnav,.modo-cel .tb{display:none!important}
.modo-cel .app{grid-template-columns:1fr;grid-template-rows:1fr}
.body.cel{padding:0;display:block;background:var(--bg)}
.cc{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header.ch{display:flex;align-items:center;gap:10px;background:var(--brand);color:var(--on-brand);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
header.ch svg{width:46px;height:46px;flex:none;margin:-6px 0}
header.ch div{display:grid;min-width:0}

.cb{display:grid;gap:14px;align-content:start;padding:16px;padding-bottom:max(24px,env(safe-area-inset-bottom));flex:1}
.cb.ct{justify-items:center;text-align:center;align-content:center}
.cb h1{font-size:26px;line-height:1.15}

.g2{min-height:56px;font-size:17px;width:100%}
.fx{display:flex;align-items:center;gap:10px;justify-content:space-between;font-weight:700;font-size:14px;color:var(--ink2)}
.eu{display:flex;align-items:center;gap:6px;color:var(--ink)}
.eu .av{width:26px;height:26px;font-size:11px}
.eu2{display:flex;align-items:center;gap:10px;font-size:20px;font-family:var(--f-disp)}
.eu2 .av{width:40px;height:40px;font-size:15px}
.ok-i{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.ok-i.er{background:var(--bad-soft);color:var(--bad)}
/* v1.6.0 parte 4: no lugar da roda que girava sem parar, três pontos que acendem uma vez (ver .cf-pt em live.css) */
.cb .cf-pt i{width:12px;height:12px}
.tiles{display:grid;gap:10px}
.ct2{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;border:3px solid transparent;border-radius:var(--r);color:var(--altTx);font-size:19px;font-weight:700;text-align:left;padding:10px 14px;cursor:pointer;font-family:var(--f-body);transition:transform var(--duration-instant,80ms) var(--ease-out,ease-out)}

/* amarelo: letra escura para ler bem (a cor da alternativa continua a mesma) */
.ct2.k2{color:var(--altTxEsc)}.ct2.k2 .sh2{background:var(--altSomb)}
.ct2.sel{border-color:var(--ink);box-shadow:0 0 0 3px var(--surface) inset}
.ct2[disabled]{opacity:.7}
.sh2{width:34px;height:34px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.2);border-radius:var(--rs)}
.sh2 svg{width:22px;height:22px}
.ords{display:grid;gap:8px}
.ot{display:flex;align-items:center;gap:12px;min-height:60px;width:100%;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);font-size:17px;font-weight:600;text-align:left;padding:8px 12px;cursor:pointer}
.ot b{width:32px;height:32px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;flex:none;font-family:var(--f-mono)}

.ot.on b{background:var(--sabia);border:0;color:var(--on-sabia)}
.bar2{display:flex;gap:10px}.bar2 .b{flex:1;min-height:52px}
.rs{display:grid;gap:6px;justify-items:center;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px 14px}
.rs.ac{border-color:var(--ok)}.rs.er{border-color:var(--bad)}
.rs h1{font-size:24px}
.pts{margin:0;font-family:var(--f-disp);font-size:30px;font-weight:700;color:var(--ok)}
.rk2{margin:4px 0 0}
.cert{margin:2px 0 0;font-size:19px;text-align:center}
ol.cert{text-align:left;padding-left:26px}
.por{margin:0;background:var(--sunk);border-radius:var(--r);padding:10px 12px}
.sug{display:grid;gap:6px}
.sug:empty{display:none}
.sg{min-height:48px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--rs);padding:0 14px;font-size:17px;font-weight:600;color:var(--ink);cursor:pointer}
.sg:hover{border-color:var(--sabia)}
.cores{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.co{aspect-ratio:1;min-height:40px;border-radius:50%;border:3px solid transparent;color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.co[aria-checked="true"]{border-color:var(--ink)}
.erro{margin:0;color:var(--bad);font-weight:600;min-height:0}
.erro:empty{display:none}
.as{display:grid;gap:8px}
#cassin{width:100%;height:150px;border:2px dashed var(--ink3);border-radius:var(--r);background:#fff;touch-action:none}
.pbar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--sabia);width:0}
.pts.w{color:var(--warn)}

/* ===== v0.6.0 · progresso, rever e refazer ===== */
.prg{display:flex;gap:4px}
.prg i{flex:1;height:8px;border-radius:999px;background:var(--line);min-width:6px}

.prgt{font-size:13px;color:var(--ink2)}

.rv{display:grid;gap:10px;width:100%;text-align:left}
.rv h2{font-size:18px}
.rv-b{display:grid;gap:8px;width:100%}
.rvq{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.rvq h2{font-size:17px;line-height:1.25}
.rvm{margin:0;color:var(--bad);font-weight:600}
ol.rvm{padding-left:20px;margin:0}

.cmt-e{display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;justify-items:start}
.cmt-r{margin:0;background:var(--sunk);border-radius:var(--rs);padding:8px 10px;width:100%}

.rel{max-width:1100px}

.mono{font-family:var(--f-mono)}
.rl-abas{display:flex;max-width:560px}

.rsm.q4{grid-template-columns:repeat(4,1fr)}

.rel .rh2 .rh{margin:0}
.rel .acoes{list-style:none;margin:0;padding:0;display:grid}
.rel .acoes li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);min-height:52px}
.rel .acoes li:first-child{border-top:0;padding-top:2px}
.rel .acs{display:flex;gap:6px}
.rel .ai{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--ink2);flex:none}
.rel .ai svg{width:18px;height:18px}
.rel .ai.ok{background:var(--ok-soft);color:var(--ok)}

.rtw{position:relative;overflow-x:auto;margin:0 -4px;padding:0 4px}
.rtb{width:100%;border-collapse:collapse;font-size:14px}
.rtb th,.rtb td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
.rtb thead th{border-top:0;font-size:12px;font-weight:700;color:var(--ink2);background:var(--surface2);white-space:nowrap}

.rtb thead th button:focus-visible{outline:2px solid var(--sabia);outline-offset:2px}
.rtb .n{text-align:right}
.rel .asm{all:unset;cursor:pointer;display:inline-grid;place-items:center;min-width:44px;min-height:36px;border-radius:8px;background:#fff;border:1px solid var(--line)}
.rel .asm:focus-visible{outline:2px solid var(--sabia);outline-offset:2px}
.rel .asm img{display:block;max-width:64px;height:auto}
.rel .assg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;place-items:center}

.rel .mapa{position:relative;overflow:auto;max-height:60vh}
.rel .mp th.nm,.mp td.nm{position:sticky;left:0;background:var(--surface);font-weight:600;min-width:130px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:1}
.rel .mp thead th.nm{background:var(--surface2)}
.mc{text-align:center !important;width:40px;min-width:40px;padding:6px 4px !important}

.rel .leg{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;color:var(--ink2)}
.rel .leg span{display:inline-flex;align-items:center;gap:6px}
i.mc{display:inline-grid;place-items:center;width:26px;height:26px;min-width:26px;border-radius:7px;font-style:normal;padding:0 !important}
i.mc svg{width:16px;height:16px}
.rel .aslist{display:grid}
.rel .as{display:grid;grid-template-columns:40px minmax(0,1fr) 84px;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}

.rel .aq{display:grid;gap:6px;min-width:0}

.rel .cf-r.no{border-color:var(--warn)}
.logo-ln{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ===== v0.6.0 · pendências, momento da aplicação, comparativo ===== */

.mom{gap:6px}
.body.pnd{max-width:980px;display:grid;gap:12px;align-content:start}
.pnd .pnd-abas{display:flex;width:100%}
.pnd .pnd-abas button{flex:1;justify-content:center}

.pnd .pnd-g{display:grid;gap:10px}
.pnd .pnd-h{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pnd .pnd-h>div{display:grid;min-width:0}
.pnd .pnd-h b{font-family:var(--f-disp);font-size:17px}
.pnd .pnd-l{display:grid}
.pnd .pnd-p{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}

.avb img{width:100%;height:100%;object-fit:contain;display:block;-webkit-mask-image:radial-gradient(closest-side,#000 88%,transparent 100%);mask-image:radial-gradient(closest-side,#000 88%,transparent 100%)}
.avb img:not([src]){visibility:hidden}
.avb.vazio{border-radius:50%;background:var(--sunk)}
/* tamanhos por lugar: o boneco ocupa mais que o círculo de antes, porque tem corpo */
.pp .avb{width:34px;height:34px;margin:-6px 0 -6px -4px}
.rk .rr .avb{width:42px;height:42px;margin:-8px 0}
.eu .avb{width:42px;height:42px;margin:-9px 0}
.eu2{flex-direction:column;gap:6px;font-size:22px;text-align:center}.eu2 .avb{width:min(240px,62vw);height:min(240px,62vw)}
.tel .cw .avb{width:52px;height:52px;margin:-10px -2px -10px -6px}
.tel .crowd.g .cw .avb{width:66px;height:66px}
.tel .pl .avb{width:200px;height:200px;margin-bottom:-24px}
.tel .podr .pr2 .avb{width:42px;height:42px;margin:-6px 0}
/* celular: escolher e montar */
.bon-linha{display:grid;grid-template-columns:140px 1fr;gap:4px 12px;align-items:center}
.bon-linha .b{grid-column:1 / -1;justify-self:start}
.bon-m{width:140px;height:140px;background:var(--sunk);border-radius:var(--r)}
.bon-topo{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center}
.bon-g{width:150px;height:150px;background:var(--sunk);border-radius:var(--r)}
.bon-tt{display:grid;gap:4px;justify-items:start;min-width:0}.bon-tt h1{margin:0;font-size:20px}.bon-tt .sm{overflow-wrap:anywhere}
.bon-abas{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bon-aba{min-height:40px;padding:0 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.bon-aba.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.bon-op{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:max-content;gap:10px;max-height:56dvh;overflow:auto;padding:2px}
.bon-i{display:grid;align-content:start;gap:4px;justify-items:center;padding:6px 6px 8px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;min-height:44px}
.bon-i.on{border-color:var(--sabia);background:var(--warn-soft,var(--sunk))}
.bon-n{font-size:14px;font-weight:600;line-height:1.2;text-align:center;overflow-wrap:anywhere}
.bon-mini{display:block;width:100%;aspect-ratio:1/1;overflow:hidden;line-height:0;border-radius:var(--rs);background:var(--sunk)}
.bon-mini img{width:100%;height:100%;object-fit:contain}
.bon-cab .bon-mini img,.bon-det .bon-mini img{transform:scale(1.5);transform-origin:37% 34%}
.bon-pes .bon-mini img{transform:scale(1.33);transform-origin:40% 55%}
.bon-amostra{width:84px;height:84px;border-radius:50%;border:2px solid var(--line);margin:8px 0 6px}
.bon-fim{display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface);padding-top:8px}
.bon-ed .b{min-height:44px}

/* ===== v1.5.0 · Apresentar e prompt padrão (prefixos ap-, ia-pad) ===== */
/* página do PDF desenhada: ocupa o espaço do visor, centrada, sem rolagem */
.mt-c:has(.ap-palco){display:grid;grid-template:minmax(0,1fr)/minmax(0,1fr);min-height:0;overflow:hidden}
.ap-palco{align-self:stretch;justify-self:stretch;min-height:0;display:grid;place-items:center;overflow:hidden;touch-action:pan-y pinch-zoom}
.ap-pg{display:block;max-width:100%;max-height:100%;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.28);border-radius:4px}
.dl.mt .ap-palco{height:min(68dvh,760px)}
.matov .mt-c{display:grid}
.matov.ap-apr{gap:8px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.matov.ap-apr .mt-sl{max-width:1100px;margin:0 auto;width:100%}
/* barra do visor: capítulos e tela cheia */
.mt-bar{flex-wrap:wrap}
.ap-cap{min-height:36px;max-width:min(320px,46vw);padding:4px 30px 4px 10px;font-size:14px}
.matov .ap-cap{background:transparent;color:var(--m-ink);border-color:var(--m-line)}
.matov .ap-cap option{color:#122120;background:#fff}
@media (max-width:620px){.ap-lbl{display:none}.ap-cap{max-width:100%;flex:1 1 140px}}
/* controle da sala */
.ap-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border:1px dashed var(--line);border-radius:12px}
.ap-ctl.on{border-style:solid;border-color:var(--br,#C85A1E);background:var(--sunk,rgba(0,0,0,.03))}
.ap-ctl > .sm{flex:1 1 180px;min-width:0}
.ap-nav{display:inline-flex;gap:6px}
/* painel: dica do PPTX */
.ap-dica{margin:0;padding:10px 12px;border-radius:12px;background:var(--warn-soft,#FBE6D8);border:1px solid var(--line);line-height:1.45}
/* tela #/apresentar (outra janela, projetor) */
.ap-ini{min-height:100dvh;display:grid;place-content:center;justify-items:center;gap:14px;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));text-align:center;background:#0A2C2B;color:#F2F7F6}
.ap-ini h1{margin:0;font-size:clamp(26px,4vw,44px);text-wrap:balance}
.ap-ini .mut{color:#A6C3C0}
.ap-ini .b:not(.p){background:transparent;color:#F2F7F6;border-color:#22524F}
/* prompt padrão */
.ia-pad{display:grid;gap:8px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--sunk,rgba(0,0,0,.03))}
.ia-pad-b{display:flex;flex-wrap:wrap;gap:8px}
.ia-pad details summary{cursor:pointer;min-height:36px;display:flex;align-items:center}
.ia-pad textarea{width:100%;font-size:12px}

/* ===== v1.6.0 · casca e peças base no padrão da família EFC (EFCwork v0.6.16) =====
   Vem por último no CSS: ajusta o que veio antes sem mexer nos módulos. Cores só por var(--token). */

/* ---------- casca ---------- */
.app{grid-template-columns:240px minmax(0,1fr);position:relative;z-index:1;background:transparent}
:where(html.m-ic) .app{grid-template-columns:68px minmax(0,1fr)}   /* :where = peso baixo: .modo-telao, .modo-cel e .modo-porta continuam mandando */
.rail{background:var(--sb);color:var(--sbTx);border-right:1px solid var(--sbBd);display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:14px 10px;overflow-y:auto;overflow-x:hidden;min-height:0}
.rl-topo{display:flex;align-items:center;gap:6px;padding:0 0 12px 2px}
.rl-marca{display:flex;align-items:center;gap:10px;min-width:0;flex:1;color:inherit;text-decoration:none;border-radius:var(--rs)}
.rail .lg{width:36px;height:36px;margin:0;border-radius:var(--rs);overflow:hidden;flex:none;display:block}
.rail .lg svg{width:100%;height:100%;display:block}
.rl-nm{min-width:0}.rl-nm b{display:block;font-family:var(--fh);font-size:18px;font-weight:600;line-height:1.1}
.rl-nm span{display:block;font-size:13px;color:var(--tx3);white-space:nowrap}
.rl-alt,.rl-fecha{width:32px!important;min-height:32px!important;height:32px;color:var(--tx3);flex:none}
.rl-alt svg{width:17px;height:17px;transition:transform var(--duration-fast) var(--ease-in-out)}
.rl-fecha{display:none!important}
.rl-nav{display:flex;flex-direction:column;gap:2px}
.gh{font-size:13px;font-weight:600;color:var(--tx3);padding:14px 10px 4px;white-space:nowrap}
.ri{width:auto;display:flex;flex-direction:row;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:var(--rs);color:inherit;font-size:15px;font-weight:500;text-decoration:none;position:relative;opacity:.88;
  transition:opacity var(--duration-quick) var(--ease-out),background-color var(--duration-quick) var(--ease-out)}   /* P3 (16/11): cor ao passar o mouse em 150 ms, como no EFCwork */
.ri:hover{background:var(--bg2);opacity:1}
.ri .ri-ic{display:grid;place-items:center;flex:none}.ri .ri-ic svg{width:18px;height:18px}
.ri .ri-nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri[aria-current="page"]{opacity:1;background:var(--aS);color:var(--aTx);font-weight:600}
.ri[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--a)}
:root[data-tema="escuro"] .ri[aria-current="page"]{background:linear-gradient(90deg,rgba(217,180,106,.18),rgba(217,180,106,.04));color:#f0d48f}
:root[data-tema="escuro"] .ri[aria-current="page"]::before{background:linear-gradient(180deg,#f7df9e,#b4862f)}
:root[data-tema="escuro"] .ri:hover{background:rgba(255,255,255,.05)}
.ri .pdn-n,.bnav .pdn-n{position:static;min-width:20px;height:20px;border-radius:10px;padding:0 6px;background:var(--cr);color:var(--onCr);font-size:13px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.rl-pe{margin-top:auto;border-top:1px solid var(--sbBd);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.rl-v{font-size:13px;color:var(--tx3);padding:0 10px;white-space:nowrap}
/* menu recolhido: só os ícones; o nome aparece ao passar o mouse */
@media (min-width:761px){
  html.m-ic .rail{padding:14px 10px;overflow:visible}
  html.m-ic .rl-topo{flex-direction:column;gap:8px;padding:0 0 8px}
  html.m-ic .rl-nm,html.m-ic .rl-v{display:none}
  html.m-ic .rl-marca{flex:none}
  html.m-ic .rl-alt svg{transform:rotate(180deg)}
  html.m-ic .gh{font-size:0;padding:0;height:1px;background:var(--sbBd);margin:8px 6px}
  html.m-ic .ri{justify-content:center;padding:0;width:48px;margin:0 auto}
  html.m-ic .ri .ri-nm{position:absolute;left:calc(100% + 10px);top:50%;transform:translate(-4px,-50%);background:var(--tx);color:var(--bg1);font-size:13px;font-weight:500;padding:6px 10px;border-radius:var(--rs);opacity:0;pointer-events:none;overflow:visible;
    transition:opacity var(--duration-quick) var(--ease-out),transform var(--duration-quick) var(--ease-out);z-index:40;box-shadow:0 6px 18px rgba(0,0,0,.18)}
  html.m-ic .ri:hover .ri-nm,html.m-ic .ri:focus-visible .ri-nm{opacity:1;transform:translate(0,-50%)}
  html.m-ic .ri .pdn-n{position:absolute;top:1px;right:1px;min-width:18px;height:18px;padding:0 4px}
}
.mn{min-height:0;overflow:clip}   /* o deslize de 12 px na troca de tela nunca cria rolagem para o lado */
.lado-fundo{display:none}
.topo{flex:none;height:56px;display:flex;align-items:center;gap:8px;padding:0 24px;border-bottom:1px solid var(--bd);background:color-mix(in srgb,var(--bg0) 88%,transparent)}
:root[data-tema="escuro"] .topo{background:rgba(11,13,22,.72)}
.tp-menu{display:none!important}
.tp-cam{min-width:0;flex:1}
.tp-cam ol{list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:6px;font-size:15px;color:var(--tx3);white-space:nowrap;overflow:hidden}
.tp-cam li{display:flex;align-items:center;gap:6px;min-width:0}
.tp-cam li+li::before{content:"/";color:var(--tx3)}
.tp-cam a{color:var(--tx2);text-decoration:none}
.tp-cam a:hover{color:var(--aTx);text-decoration:underline;text-underline-offset:3px}
.tp-cam [aria-current]{color:var(--tx);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.tp-sp{display:none}
.tp-tema{color:var(--tx2)}
/* cabeçalho da tela: título com o traço dourado, linha de resumo e as ações à direita */
.tb{padding:18px 24px 10px;align-items:flex-end;gap:14px;flex-wrap:wrap}
.tb-t{min-width:0}
.tb h1{font-size:26px;font-weight:600;line-height:1.15;position:relative;padding-bottom:6px}
.tb h1::after{content:"";position:absolute;left:0;bottom:0;width:40px;height:2px;border-radius:2px;background:var(--a)}
:root[data-tema="escuro"] .tb h1{background:var(--ouroTit);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-tema="escuro"] .tb h1::after{background:linear-gradient(90deg,#f7df9e,#b4862f)}
.tb .sub{color:var(--tx2);font-size:14px;margin-top:4px}
.tb .pls{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tb-pl{display:inline-flex;align-items:baseline;gap:4px;padding:1px 8px;border-radius:5px;background:var(--bg2);border:1px solid var(--bd);font-size:13px;color:var(--tx2)}
.tb-pl b{font-weight:600;color:var(--tx)}
.tb-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tb-volta{align-self:center}
.body{padding:6px 24px 24px}

a{color:var(--aTx)}

/* ---------- peças base (botão, campo, cartão, pílula, escolha, janela, aviso) ---------- */
:root{--btn:36px;--campo:36px}
@media (pointer:coarse),(max-width:760px){:root{--btn:44px;--campo:44px}}
.b{min-height:var(--btn);border-radius:var(--rs);border:1px solid var(--bd2);background:var(--bg1);box-shadow:none;font-size:14px;font-weight:600;padding:0 14px;gap:7px;color:var(--tx);
  transition:transform var(--duration-quick) var(--ease-out),color var(--duration-quick) var(--ease-out),background-color var(--duration-quick) var(--ease-out),border-color var(--duration-quick) var(--ease-out)}   /* P3 (16/11): cor, fundo e borda em 150 ms; a sombra muda direto */
.b svg.i{width:17px;height:17px}
.b:hover:not([disabled]){border-color:color-mix(in srgb,var(--a) 60%,var(--bd2));background:var(--bg1)}
.b:active:not([disabled]){transform:scale(.98)}
.b.s{background:var(--bg1);border-color:var(--bd2);color:var(--tx)}
.b.p{background:var(--ouro);border-color:#c99d48;color:var(--onOuro);position:relative;overflow:hidden;box-shadow:0 2px 6px rgba(154,113,40,.28),inset 0 1px 0 rgba(255,255,255,.35)}
.b.p::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-150%) skewX(-18deg);pointer-events:none}
@media (prefers-reduced-motion:no-preference){.b.p::after{animation:ouroBrilho 6s ease-in-out infinite}} /* mov:ok — reflexo do botão dourado, exceção aprovada */
@keyframes ouroBrilho{0%,70%{transform:translateX(-150%) skewX(-18deg)}100%{transform:translateX(330%) skewX(-18deg)}}
.b.p:hover:not([disabled]){background:var(--ouro);border-color:#c99d48;transform:translateY(-1px);box-shadow:0 4px 10px rgba(154,113,40,.32),inset 0 1px 0 rgba(255,255,255,.4)}
.b.g{background:transparent;border-color:transparent;box-shadow:none}
.b.g:hover:not([disabled]){background:var(--bg2);border-color:transparent}
:root[data-tema="escuro"] .b.g:hover:not([disabled]){background:rgba(255,255,255,.07)}
.b.ic{width:var(--btn);min-width:var(--btn)}
.b.sm{min-height:32px;padding:0 10px;font-size:14px;border-radius:var(--rs)}
@media (pointer:coarse),(max-width:760px){.b.sm{min-height:44px}}
.b.bad{color:var(--cr)}
.in{min-height:var(--campo);border:1px solid var(--bd2);border-radius:var(--rs);background:var(--bg0);font-size:15px;color:var(--tx);transition:border-color var(--duration-quick) var(--ease-out)}
.in:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px var(--aS)}
select.in{background-position:calc(100% - 18px) calc(50% + 1px),calc(100% - 13px) calc(50% + 1px)}
textarea.in{padding:8px 12px}
.fd label,.lbl{font-size:13px;font-weight:600;color:var(--tx2)}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.k{border-radius:var(--r);border:1px solid var(--bd);box-shadow:var(--e1);background:var(--bg1)}
:root[data-tema="escuro"] .k{border-color:rgba(217,180,106,.16)}
.chip{border-radius:5px;padding:1px 8px;font-size:13px;font-weight:600}
:root[data-tema="claro"] .chip.ok{background:rgba(47,125,79,.07)}
.qi[aria-current="true"] .qn{background:var(--aTx);color:var(--bg1)}
.seg{border-radius:var(--rs);padding:3px;background:var(--bg2)}
.seg button{border-radius:5px;min-height:calc(var(--btn) - 6px);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--bg1);color:var(--tx);box-shadow:0 1px 2px rgba(40,30,10,.12)}
:root[data-tema="escuro"] .seg button[aria-pressed="true"]{background:var(--bd2)}
@media (pointer:coarse),(max-width:760px){.seg button{min-height:44px}}
.seg i{font-family:var(--f);font-variant-numeric:tabular-nums;font-size:13px}
.sc{border-radius:var(--rs);min-height:var(--btn);border:1px solid var(--bd2);font-size:14px}
.sc[aria-pressed="true"]{background:var(--aS);border-color:var(--a);color:var(--aTx)}
.pr,.opcao,.card{border-radius:var(--r);border:1px solid var(--bd)}
.pr[aria-pressed="true"]{border-color:var(--a);background:var(--aS)}
.pr .pic,.opcao .pic{border-radius:var(--rs);color:var(--aTx)}
.pr[aria-pressed="true"] .pic{background:var(--ouro);color:var(--onOuro)}
.opcao:hover{border-color:color-mix(in srgb,var(--a) 60%,var(--bd2))}
.st{background:var(--aS);color:var(--aTx);font-family:var(--f)}
dialog{border-radius:12px;border:1px solid var(--bd2);background:var(--bg1);box-shadow:var(--e3)}
dialog::backdrop{background:rgba(10,10,20,.42)}
#toast{border-radius:var(--rs);background:var(--tx);color:var(--bg1);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast button{color:var(--a)}
:root[data-tema="claro"] #toast button{color:#f0d48f}
.tr.h{background:var(--bg2);font-size:13px;font-weight:600;color:var(--tx2)}
.tr .t b{font-weight:600}
.num,.mono{font-family:var(--f);font-variant-numeric:tabular-nums}
pre{font-family:ui-monospace,Menlo,Consolas,monospace!important}
.meta-bar i{background:var(--a)}
button.qi{border-radius:var(--rs)}.telwrap{border-radius:var(--r)}

/* peças que usavam o petróleo como fundo: passam para o marfim/dourado com contraste certo */
header.ch{background:var(--bg1);color:var(--tx);border-bottom:1px solid var(--bd)}
header.ch span{color:var(--tx3);font-size:13px}
.bon-aba.on{background:var(--aS);color:var(--aTx);border-color:var(--a)}
.ds-b i,.prg i.a{background:var(--a)}

/* ---------- abas: traço dourado embaixo da aba escolhida, que desliza ---------- */
.seg.abas{min-height:calc(var(--btn) + 1px);flex:none;position:relative;background:transparent;padding:0;border-radius:0;border-bottom:1px solid var(--bd);gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.seg.abas::-webkit-scrollbar{display:none}
.seg.abas button{border-radius:0;min-height:var(--btn);padding:0 12px;font-size:15px;font-weight:500;color:var(--tx2);background:transparent;box-shadow:none;flex:none;transition:color var(--duration-quick) var(--ease-out)}
.seg.abas button:hover{color:var(--tx)}
.seg.abas button[aria-pressed="true"]{background:transparent;color:var(--aTx);font-weight:600;box-shadow:none}
:root[data-tema="escuro"] .seg.abas button[aria-pressed="true"]{background:transparent;color:#f0d48f}
.abas-linha{position:absolute;left:0;bottom:0;width:100px;height:2px;border-radius:0;background:var(--a);transform-origin:0 0;pointer-events:none;
  transition:transform var(--tabs-dur) var(--tabs-ease)}
:root[data-tema="escuro"] .abas-linha{background:linear-gradient(90deg,#f7df9e,#b4862f)}
.pnd .pnd-abas button,.rl-abas button{flex:1 0 auto}

/* ---------- Início ---------- */
.coach{background:var(--bg1);color:var(--tx);border:1px solid var(--bd);grid-template-columns:auto 1fr auto}
:root[data-tema="escuro"] .coach{border-color:rgba(217,180,106,.24)}
.coach .ms{width:52px;height:52px;border-radius:var(--rs);overflow:hidden}
.coach .eb{font-size:13px;font-weight:600;color:var(--aTx);text-transform:none;letter-spacing:0}
.coach h2{font-size:20px;color:var(--tx)}
.coach p{color:var(--tx2);font-size:14px}
.coach .b.g{color:var(--tx);border-color:var(--bd2)}
.mini h3{font-size:16px}

/* ---------- Ajustes em grupos ---------- */
.aj{display:grid;grid-template-columns:220px minmax(0,720px);gap:20px;align-items:start}
.aj-ind{position:sticky;top:0;display:flex;flex-direction:column;gap:2px;padding:4px 0}
.aj-ig{font-size:13px;font-weight:600;color:var(--tx3);padding:12px 10px 4px}

.esc-ic{display:grid;place-items:center;width:30px;height:30px;border-radius:var(--rs);background:var(--aS);color:var(--aTx);flex:none}

  background:var(--bg1);border:1px solid var(--bd2);border-radius:var(--r);box-shadow:0 12px 32px rgba(30,20,5,.16);padding:4px;display:grid;gap:2px;visibility:hidden}

  transition:background-color var(--duration-quick) var(--ease-out)}

/* ---------- aviso (faixa de baixo) ---------- */
#toast{left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100vw - 32px);transform:none}

/* ---------- janelas: abrem crescendo um pouco e saindo do transparente; fecham do mesmo jeito ---------- */
#dlg{opacity:0;transform:scale(var(--modal-scale));

#dlg:has(.dl.pn){width:min(420px,100vw);border-radius:12px 0 0 12px;border-right:0;transform:translateX(100%);filter:blur(var(--panel-blur));

/* título que entra letra por letra saindo do desfoque; no escuro, cor lisa enquanto entra */

@keyframes fzSpk{from{transform:rotate(var(--r)) translateY(6px) scaleY(1);opacity:1}to{transform:rotate(var(--r)) translateY(26px) scaleY(.2);opacity:0}}

function roteiro(t) {
  const passos = []; let n = 0, seg = 0;
  t.itens.forEach(i => {
    if (i.tipo === "explicacao") { passos.push({n: "E", txt: i.enunciado, s: 120, e: true}); seg += 120; }
    else if (i.uso === "ensaio") { passos.push({n: "T", txt: i.enunciado + " (teste, não vale nota)", s: i.tempo || 20}); seg += i.tempo || 20; }
    else { n++; passos.push({n: String(n), txt: i.enunciado, s: i.tempo || 20}); seg += (i.tempo || 20) + 8; }
  });
  return {passos, min: Math.max(1, Math.round(seg / 60))};
}

const TIPOS = {multipla: "Múltipla escolha", vf: "Verdadeiro ou falso", ordenar: "Ordenar", explicacao: "Explicação"};
const TIPOS_CURTO = {multipla: "Múltipla", vf: "V ou F", ordenar: "Ordenar", explicacao: "Explicação"};
const USOS = {avaliacao: "Vale nota", gincana: "Gincana (vale nota)", ensaio: "Teste (não vale nota)"};
const TEMPOS = [10, 15, 20, 30, 45, 60, 90, 120];
const MAX_ALT = 4, MAX_ORD = 5;
const clone = o => JSON.parse(JSON.stringify(o));
const agora = () => new Date().toISOString();
const novoItem = tipo => ({
  explicacao: {tipo: "explicacao", enunciado: "", texto: ""},
  multipla: {tipo: "multipla", enunciado: "", alternativas: ["", "", "", ""], correta: null, tempo: 20, uso: "avaliacao", porque: ""},
  vf: {tipo: "vf", enunciado: "", alternativas: ["Verdadeiro", "Falso"], correta: null, tempo: 20, uso: "avaliacao", porque: ""},
  ordenar: {tipo: "ordenar", enunciado: "", alternativas: ["", "", ""], tempo: 45, uso: "avaliacao", porque: ""}
}[tipo]);

/* ---------- conferência de cada pergunta ---------- */
function problemasItem(it) {
  const p = [];
  if (!String(it.enunciado || "").trim()) p.push("Falta o enunciado");
  if (it.tipo === "multipla") {
    const a = it.alternativas || [];
    if (a.some(x => !String(x).trim())) p.push("Há alternativa em branco");
    if (!Number.isInteger(it.correta) || it.correta < 0 || it.correta >= a.length) p.push("Marque a resposta certa");
  } else if (it.tipo === "vf") {
    if (!Number.isInteger(it.correta) || it.correta < 0 || it.correta > 1) p.push("Marque verdadeiro ou falso");
  } else if (it.tipo === "ordenar") {
    const a = it.alternativas || [];
    if (a.length < 3) p.push("Use pelo menos 3 passos");
    if (a.some(x => !String(x).trim())) p.push("Há passo em branco");
  }
  return p;
}
const problemasTreino = t => t.itens.map((it, i) => ({i, m: problemasItem(it)})).filter(x => x.m.length);
const numeroItem = (t, i) => { const it = t.itens[i]; if (it.tipo === "explicacao") return "E"; if (it.uso === "ensaio") return "T"; return String(t.itens.slice(0, i + 1).filter(x => x.tipo !== "explicacao" && x.uso !== "ensaio").length); };

/* ---------- versões ---------- */
function garantirSnap(t) {
  const v = (t.versoes || []).find(x => x.n === t.versao);
  if (v && !v.itens && !t.sujo) { v.itens = clone(t.itens); v.titulo = t.titulo; v.meta = t.meta; v.metaTipo = t.metaTipo; }
}
function editou(t) { garantirSnap(t); t.sujo = true; t.atualizado = agora(); salvar(); }
function salvarVersao(t, nota) {

/* ===== v0.4.0 · celular do participante (#/entrar/CHAVE/BANCO) ===== */
const CE = {chave: null, sg: null, base: null, pid: null, nome: "", cor: 0, pub: null, res: null, ouvPub: null, ouvRes: null, st: "off", visto: false, entrou: false, jaEntrou: false,

const chaveLS = k => k + CE.chave;
const gravaLS = (k, o) => { try { localStorage.setItem(chaveLS(k), JSON.stringify(o)); } catch(e) {} };
const lerLS = k => { try { const o = JSON.parse(localStorage.getItem(chaveLS(k)) || "null"); return o && typeof o === "object" ? o : {}; } catch(e) { return {}; } };

  Object.assign(CE, {cm: {tipo: "sugestao", texto: "", env: [], erro: ""}, rsp: null, ouvRsp: null, chave: null, sg: null, base: null, pid: null, pub: null, res: null, ouvPub: null, ouvRes: null, st: "off", visto: false, entrou: false, jaEntrou: false, resp: {}, kf: "", sel: null, ord: [], enviando: false, assinou: false, tracos: 0, html: "", erro: "", tela: "", rev: {}, ref: {}, vista: "", rf: null});
}
function vCelular(chave, sg) {

  else if (!chave && CE.chave) pararCel();

}
function iniciarCel(chave, sg) {
  CE.chave = chave; CE.sg = sg || null;
  let base = Rede.desseg(sg);
  try { if (!base) base = localStorage.getItem("sabia-db"); } catch(e) {}
  if (!base && Rede.ok()) base = Rede.url();
  if (!base || !Rede.valida(base)) { CE.erro = "semdb"; return; }
  CE.base = base; try { localStorage.setItem("sabia-db", base); } catch(e) {}
  let salvo = null; try { salvo = JSON.parse(localStorage.getItem(chaveLS("sabia-p-")) || "null"); } catch(e) {}
  if (salvo && salvo.pid) { CE.pid = salvo.pid; CE.nome = salvo.nome; CE.cor = salvo.cor || 0; CE.entrou = true; CE.jaEntrou = true; }
  try { CE.assinou = localStorage.getItem(chaveLS("sabia-a-")) === "1"; } catch(e) {}
  CE.rev = lerLS("sabia-rv-"); CE.ref = lerLS("sabia-rf-"); CE.cm.env = Array.isArray(lerLS("sabia-cm-").l) ? lerLS("sabia-cm-").l : [];
  CE.ouvPub = Rede.ouvir(base, "/salas/" + chave + "/pub", M => { CE.pub = M && M.meta ? M : null; CE.visto = true; aoPub(); }, st => { CE.st = st; pintaCel(); });
  if (CE.entrou) {
    Rede.req(base, "GET", "/salas/" + chave + "/part/" + CE.pid).then(v => { if (!v) { CE.entrou = false; CE.jaEntrou = false; try { localStorage.removeItem(chaveLS("sabia-p-")); } catch(e) {} pintaCel(); } }).catch(() => {});

function ligarRes() {

  if (!CE.ouvRsp) CE.ouvRsp = Rede.ouvir(CE.base, "/salas/" + CE.chave + "/part/" + CE.pid + "/rsp", M => { CE.rsp = M && typeof M === "object" ? M : null; pintaCel(); });   // respostas do instrutor aos comentários (v0.7.0)

function aoPub() {

    if (f.etapa === "pergunta" && CE.entrou && CE.resp[f.idx] === undefined) {

      Rede.req(CE.base, "GET", "/salas/" + CE.chave + "/resp/" + CE.pid + "/" + idx).then(v => { if (v && v.r !== undefined) { CE.resp[idx] = v.r; pintaCel(); } }).catch(() => {});

    }
  }

/* guarda no aparelho cada pergunta já revelada, para rever e treinar depois */
function acertaRevPodio() {
  const r = CE.res; if (!CE.entrou || !r || r.i !== -1 || !Array.isArray(r.q)) return;
  const certas = new Set(r.q.map(Number)); let mudou = false;
  Object.keys(CE.rev).forEach(k => { const x = CE.rev[k], ok = certas.has(Number(k)); if (ok && x.ok !== 1) { x.ok = 1; mudou = true; } else if (!ok && x.ok === 1) { x.ok = 0; mudou = true; } });
  if (mudou) gravaLS("sabia-rv-", CE.rev);
}
function guardaRev() {
  acertaRevPodio();
  const f = CE.pub && CE.pub.fase, m = CE.pub && CE.pub.meta; if (!CE.entrou || !f || f.etapa !== "resultado" || f.conf || !m || m.mom === "pre") return;
  const it = itemCel(); if (!it || it.ensaio) return;

  if (ja) { if (ja.ok === r.ok) return; ja.ok = r.ok; if (mine !== undefined) ja.m = typeof mine === "object" ? lista(mine).map(Number) : mine; gravaLS("sabia-rv-", CE.rev); return; }
  CE.rev[f.idx] = {n: f.numPerg, e: it.enunciado, t: it.tipo, a: it.alts, o: it.ordem || null, c: Number.isInteger(it.correta) ? it.correta : null, p: it.porque || "", m: mine === undefined ? null : (typeof mine === "object" ? lista(mine).map(Number) : mine), ok: r.ok};
  gravaLS("sabia-rv-", CE.rev);
}
const errosCel = () => Object.entries(CE.rev).map(([i, x]) => Object.assign({i: Number(i)}, x)).filter(x => x.ok !== 1).sort((a, b) => a.n - b.n);
const refFim = i => { const r = CE.ref[i]; return !!r && (r.ok === 1 || r.t >= 3); };

function progCel(f) {
  const tot = f && f.totalPerg; if (!tot || (f.etapa !== "pergunta" && f.etapa !== "resultado")) return "";
  const rv = Object.values(CE.rev), fe = rv.length, ac = certasCel();
  const seg = Array.from({length: tot}, (_, k) => { const n = k + 1, r = rv.find(x => x.n === n); return `<i class="${r ? (r.ok === 1 ? "c" : "e") : n === f.numPerg ? "a" : ""}"></i>`; }).join("");
  return `<div class="prg" role="img" aria-label="Pergunta ${f.numPerg} de ${tot}${fe ? ", " + ac + " de " + fe + " certas até aqui" : ""}">${seg}</div>${fe ? `<div class="prgt"><b>${ac}</b> de ${fe} certa${fe === 1 ? "" : "s"} até aqui</div>` : ""}`;
}

function pintaTelaCel() { tickTempo(); const c = $("#cassin"); if (c) prepararAssinatura(c); }

/* ---------- assinatura ---------- */
function prepararAssinatura(c) {
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#0A2C2B";
  let desenhando = false, ult = null;
  const pt = e => { const r = c.getBoundingClientRect(); return {x: (e.clientX - r.left) * c.width / r.width, y: (e.clientY - r.top) * c.height / r.height}; };
  c.addEventListener("pointerdown", e => { desenhando = true; ult = pt(e); try { c.setPointerCapture(e.pointerId); } catch(x) {} ctx.beginPath(); ctx.arc(ult.x, ult.y, 2.5, 0, 7); ctx.fillStyle = "#0A2C2B"; ctx.fill(); CE.tracos++; e.preventDefault(); });
  c.addEventListener("pointermove", e => { if (!desenhando) return; const p = pt(e); ctx.beginPath(); ctx.moveTo(ult.x, ult.y); ctx.lineTo(p.x, p.y); ctx.stroke(); ult = p; CE.tracos++; e.preventDefault(); });
  const fim = () => { desenhando = false; };
  c.addEventListener("pointerup", fim); c.addEventListener("pointercancel", fim);
}

/* JPEG em data URL: lê tamanho e componentes para embutir no PDF */
function lerJpeg(url) {
  const m = /^data:image\/jpe?g;base64,(.+)$/i.exec(url || ""); if (!m) return null;
  let bin; try { bin = atob(m[1]); } catch (e) { return null; }
  const by = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) by[i] = bin.charCodeAt(i);
  let i = 2;
  while (i + 9 < by.length) {
    if (by[i] !== 0xFF) { i++; continue; }
    const mk = by[i + 1];
    if (mk >= 0xC0 && mk <= 0xCF && mk !== 0xC4 && mk !== 0xC8 && mk !== 0xCC) return {bytes: by, h: (by[i + 5] << 8) | by[i + 6], w: (by[i + 7] << 8) | by[i + 8], comp: by[i + 9]};
    i += 2 + ((by[i + 2] << 8) | by[i + 3]);
  }
  return null;
}

/* Reduz qualquer imagem do aparelho para JPEG pequeno (fundo branco). Devolve data URL. */
function imagemJpeg(arquivo, maxLado, qualidade) {
  return new Promise((ok, falha) => {
    const u = URL.createObjectURL(arquivo), im = new Image();
    im.onload = () => {
      try {
        const k = Math.min(1, maxLado / Math.max(im.naturalWidth, im.naturalHeight)), w = Math.max(1, Math.round(im.naturalWidth * k)), h = Math.max(1, Math.round(im.naturalHeight * k));
        const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d");
        x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h);
        URL.revokeObjectURL(u); ok(c.toDataURL("image/jpeg", qualidade));
      } catch (e) { URL.revokeObjectURL(u); falha(e); }
    };
    im.onerror = () => { URL.revokeObjectURL(u); falha(new Error("imagem")); };
    im.src = u;
  });
}

/* ---------- o documento ---------- */
function novoPdf(titulo) {
  const W = 595.28, H = 841.89, M = 40;
  const d = {W, H, M, titulo, pgs: [], ops: null, y: M, imgs: [], imgMap: new Map(), rodape: null, cab: null};
  d.larg = (s, tam, neg) => { let t = 0; const tb = HELV[neg ? "b" : "r"]; for (const ch of String(s)) { const b = baitePdf(ch); t += b >= 32 ? tb[b - 32] : 0; } return t * tam / 1000; };
  d.quebra = (s, lg, tam, neg) => {
    const out = []; String(s ?? "").split(/\r?\n/).forEach(par => {
      let lin = "";
      par.split(/\s+/).filter(Boolean).forEach(pal => {
        let p = pal;
        while (d.larg(p, tam, neg) > lg) { // palavra maior que a linha: corta
          let k = p.length; while (k > 1 && d.larg(p.slice(0, k), tam, neg) > lg) k--;
          if (lin) { out.push(lin); lin = ""; }
          out.push(p.slice(0, k)); p = p.slice(k);
        }
        const t = lin ? lin + " " + p : p;
        if (d.larg(t, tam, neg) <= lg) lin = t; else { if (lin) out.push(lin); lin = p; }
      });
      out.push(lin);
    });
    return out;
  };
  d.corta = (s, lg, tam, neg) => { s = String(s ?? ""); if (d.larg(s, tam, neg) <= lg) return s; while (s.length > 1 && d.larg(s + "…", tam, neg) > lg) s = s.slice(0, -1); return s + "…"; };
  d.nova = () => { d.ops = []; d.pgs.push(d.ops); d.y = M; if (d.cab && d.pgs.length > 1) d.cab(d); };
  d.garante = h => { if (d.y + h > H - 54) d.nova(); };
  d.texto = (x, y, s, o = {}) => {
    const tam = o.tam || 10, neg = !!o.neg; let t = String(s ?? ""); if (!t) return;
    const w = d.larg(t, tam, neg); if (o.al === "dir") x = x - w; else if (o.al === "cen") x = x - w / 2;
    const bytes = Array.from(t).map(ch => { const b = baitePdf(ch); return (b < 32 ? 63 : b); });
    const lit = bytes.map(b => (b === 40 || b === 41 || b === 92) ? "\\" + String.fromCharCode(b) : b > 126 ? "\\" + b.toString(8).padStart(3, "0") : String.fromCharCode(b)).join("");

  };

  d.linha = (x1, y1, x2, y2, o = {}) => d.ops.push(`${num2(o.esp || .6)} w ${corPdf(o.cor || "#9aa8a7")} RG ${num2(x1)} ${num2(H - y1)} m ${num2(x2)} ${num2(H - y2)} l S`);
  d.ret = (x, y, w, h, o = {}) => {
    const p = [];
    if (o.fundo) p.push(`${corPdf(o.fundo)} rg ${num2(x)} ${num2(H - y - h)} ${num2(w)} ${num2(h)} re f`);
    if (o.borda) p.push(`${num2(o.esp || .6)} w ${corPdf(o.borda)} RG ${num2(x)} ${num2(H - y - h)} ${num2(w)} ${num2(h)} re S`);
    d.ops.push(p.join(" "));
  };
  d.img = (url, x, y, w, h) => {
    const j = lerJpeg(url); if (!j) return false;
    let n = d.imgMap.get(url); if (n === undefined) { n = d.imgs.length; d.imgs.push(j); d.imgMap.set(url, n); }

  };

    const j = lerJpeg(url); if (!j) return null;
    const k = Math.min(w / j.w, h / j.h), ww = j.w * k, hh = j.h * k, xx = al === "cen" ? x + (w - ww) / 2 : x;

  d.tabela = (cols, linhas, o = {}) => {

    const larguras = cols.map(c => c.w * esc);

      d.garante(24); d.ret(x0, d.y, W - 2 * M, 18, {fundo: "#E2E9E8"});
      let x = x0; cols.forEach((c, i) => { d.texto(c.al === "dir" ? x + larguras[i] - pad : c.al === "cen" ? x + larguras[i] / 2 : x + pad, d.y + 12.5, c.t, {tam: 8, neg: true, cor: "#334", al: c.al}); x += larguras[i]; });
      d.y += 18;
    };
    cabeca();
    linhas.forEach(l => {
      const cel = l.map((c, i) => (c && typeof c === "object") ? c : {txt: String(c ?? "")});
      let alt = 0; const quebras = cel.map((c, i) => {
        if ("img" in c) { alt = Math.max(alt, (c.h || 24) + 2 * pad); return null; }

      });

      cel.forEach((c, i) => {
        const al = cols[i].al;
        if ("img" in c) { const bx = x + pad, bw = larguras[i] - 2 * pad; if (!d.imgCabe(c.img, bx, d.y + pad, bw, c.h || 24, "cen")) d.texto(x + larguras[i] / 2, d.y + alt / 2 + 3, c.vazio || "sem assinatura", {tam: 8, cor: "#8a9998", al: "cen"}); }
        else quebras[i].forEach((t, k) => d.texto(al === "dir" ? x + larguras[i] - pad : al === "cen" ? x + larguras[i] / 2 : x + pad, d.y + pad + tam + k * tam * 1.3 - 1, t, {tam, neg: c.neg, cor: c.cor, al}));
        x += larguras[i];

      d.y += alt; d.linha(x0, d.y, W - M, d.y, {cor: "#d5dedd", esp: .5});

  };

    if (!d.pgs.length) d.nova();
    const N = d.pgs.length;
    if (d.rodape) d.pgs.forEach((ops, i) => { d.ops = ops; d.rodape(d, i + 1, N); });
    const partes = [], offs = []; let pos = 0;
    const enc = s => { const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i) & 255; return u; };
    const add = p => { partes.push(p); pos += p.length; };
    const obj = (n, corpo) => { offs[n] = pos; add(enc(`${n} 0 obj\n${corpo}\nendobj\n`)); };

    obj(1, "<< /Type /Catalog /Pages 2 0 R >>");

    obj(3, "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
    obj(4, "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
    d.imgs.forEach((j, i) => {
      const n = 5 + i; offs[n] = pos;
      add(enc(`${n} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${j.w} /Height ${j.h} /ColorSpace /${j.comp === 1 ? "DeviceGray" : j.comp === 4 ? "DeviceCMYK" : "DeviceRGB"} /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.bytes.length} >>\nstream\n`)); add(j.bytes); add(enc("\nendstream\nendobj\n"));
    });

    d.pgs.forEach((ops, i) => {
      const np = primeiraPg + i * 2, nc = np + 1, fluxo = ops.join("\n");
      obj(np, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${num2(W)} ${num2(H)}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>${nImg ? ` /XObject << ${xobj} >>` : ""} >> /Contents ${nc} 0 R >>`);

    const lit = s => "(" + Array.from(String(s)).map(ch => { const b = baitePdf(ch); return (b === 40 || b === 41 || b === 92) ? "\\" + ch : b > 126 ? "\\" + b.toString(8).padStart(3, "0") : String.fromCharCode(b < 32 ? 63 : b); }).join("") + ")";
    obj(nInfo, `<< /Title ${lit(titulo)} /Producer ${lit("Sabiá " + VERSAO)} /Creator ${lit("Sabiá")} /CreationDate (${dataPdf}) >>`);

/* ---------- números da sessão ---------- */
function estat(s) {

      n++; if (r.ok) ac++; if (r.ms > 0) { somaMs += r.ms; nMs++; }
      if (!r.ok && it.tipo !== "ordenar") er[r.r] = (er[r.r] || 0) + 1;
    });
    const ks = Object.keys(er).sort((a, b) => er[b] - er[a]);
    return {n: k + 1, i, it, resp: n, ac, pct: n ? Math.round(100 * ac / n) : 0, errada: ks.length ? {alt: Number(ks[0]), n: er[ks[0]]} : null};
  });

  const por = {}; c.pessoas.forEach(p => { const k = p.setor || "Sem setor"; (por[k] = por[k] || []).push(p); });
  const setores = Object.entries(por).map(([nome, l]) => ({nome, n: l.length, pct: Math.round(l.reduce((a, p) => a + p.pct, 0) / l.length), efic: l.filter(p => p.pct >= s.meta).length}))

  return {c, perg, nota, tempo: nMs ? somaMs / nMs / 1000 : 0, setores, pessoas, abaixo: s.mom === "pre" ? [] : pessoas.filter(p => p.pct < s.meta), fracas: perg.filter(q => q.resp && q.pct < 60)};
}

/* ---------- código de autenticação (era "de conferência" até a v1.6.0 parte 3) ---------- */
function canonSessao(s) {
  const c = calc(s), qs = s.itens.map((it, i) => [it, i]).filter(([it]) => vale(it));
  const pessoas = c.pessoas.map(p => {
    const o = s.part.find(x => x.id === p.id) || {}, rs = s.resp[p.id] || {};
    return [p.nome, p.setor || "", p.ac, p.pts, p.pct, qs.map(([, i]) => rs[i] ? (rs[i].ok ? "1" : "0") : "-").join(""), o.ass ? sha256(o.ass).slice(0, 16) : ""];
  }).sort((a, b) => a[0].localeCompare(b[0], "pt-BR") || a[1].localeCompare(b[1], "pt-BR") || a[6].localeCompare(b[6]));
  const perguntas = sha256(JSON.stringify(qs.map(([it]) => [it.tipo, it.enunciado, it.alternativas || null, it.correta ?? null]))).slice(0, 16);
  const o = {v: 1, t: s.titulo, ver: s.versao ?? 0, fim: s.fim, ins: s.instrutor || "", loc: s.local || "", h: String(s.horas || ""), meta: s.meta, np: qs.length, q: perguntas, teste: !!(s.aj && s.aj.teste), sim: s.part.some(p => p.sim), p: pessoas};

}
function codigoDe(s) { return "SAB-" + sha256(canonSessao(s)).slice(0, 20).toUpperCase().match(/.{4}/g).join("-"); }

function normCodigo(t) {

function conferirCodigo(txt) {
  CF.cod = txt;
  const c = normCodigo(txt);
  if (!c) { CF.res = {t: "no", titulo: "Código inválido", texto: "O código tem o formato SAB-XXXX-XXXX-XXXX-XXXX-XXXX, com letras de A a F e números."}; return; }
  const s = encerradas().find(x => garantirCodigo(x) === c);
  if (!s) { CF.res = {t: "no", titulo: "Nenhuma sessão deste aparelho tem esse código", texto: "Pode ser de outro aparelho (importe os dados em Ajustes) ou o PDF foi alterado. Se foi aplicada em outro aparelho, confira também pelo arquivo de sessão (.json)."}; return; }
  const e = estat(s);
  if (!integra(s)) { CF.res = {t: "no", titulo: "Atenção: a sessão foi alterada depois de encerrada", texto: `O código ${esc(c)} é de “${esc(s.titulo)}” (${dtc(s.fim)}), mas os dados guardados hoje geram outro código. Não use este registro sem explicar a diferença.`}; return; }
  CF.res = {t: "ok", titulo: "Documento autêntico", texto: `${esc(s.titulo)} (${verTxt(s)}), ${dtc(s.fim)}, instrutor ${esc(s.instrutor || "não informado")}. ${e.c.pessoas.length} pessoa${e.c.pessoas.length === 1 ? "" : "s"}, acerto geral de ${e.c.pct}%. Os dados guardados batem com o código do PDF. <a href="#/relatorios/${s.id}">Abrir o relatório</a>.${tipoSessao(s) !== "real" ? " <b>Esta sessão é " + (tipoSessao(s) === "teste" ? "de teste" : "um ensaio com simulados") + ", não é registro oficial.</b>" : ""}${s.codTardio ? " O código foi gerado depois do encerramento (sessão anterior à v0.5.0)." : ""}`};
}
function conferirArquivo(arq) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const o = JSON.parse(fr.result), s = o && o.sessao;
      if (!o || o.sabia !== "sessao" || !s || !Array.isArray(s.itens) || !Array.isArray(s.part) || !s.resp || typeof s.resp !== "object") throw new Error("formato");
      const dado = normCodigo(o.codigo), novo = codigoDe(s), local = encerradas().find(x => x.cod === novo);
      if (!dado) CF.res = {t: "no", titulo: "O arquivo não traz um código válido", texto: "Exporte a sessão de novo pelo relatório."};
      else if (dado !== novo) CF.res = {t: "no", titulo: "O arquivo foi alterado", texto: `O arquivo diz que o código é ${esc(dado)}, mas os dados dentro dele geram ${esc(novo)}.`};
      else CF.res = {t: "ok", titulo: "O arquivo confere", texto: `“${esc(s.titulo)}”, ${dtc(s.fim)}: os dados do arquivo geram o código ${esc(novo)}, igual ao registrado nele. ${local ? "Há uma sessão com o mesmo código neste aparelho." : "Esta sessão não está neste aparelho."}`};
      CF.cod = dado || "";
    } catch (err) { CF.res = {t: "no", titulo: "Não consegui ler esse arquivo", texto: "Escolha um arquivo de sessão (.json) exportado pelo relatório do Sabiá."}; }
    render();
  };
  fr.readAsText(arq);
}

const DIA = 86400000;

const REAV_DIAS = [30, 60, 90];
const VALIDADES = [[0, "Sem validade"], [180, "6 meses"], [365, "1 ano"], [730, "2 anos"]];
const PND = {aba: ""};

/* ---------- o que a sessão carrega do Aplicar ---------- */
function momentoDe(s, a) {
  if (!a || !a.mom) return;
  s.mom = a.mom;
  if (a.dias) s.dias = a.dias;
  if (a.base) s.base = a.base;
  if (s.mom === "pre") { s.aj.ranking = false; s.aj.gincana = false; }
  if (s.mom === "ref" && a.refConteudo === "erradas" && Array.isArray(a.errados) && a.errados.length) s.somente = a.errados.slice();
}
/* reforço "só as perguntas que erraram": a sessão leva apenas essas perguntas, sem explicação */
function aplicaRecorte(s) {
  if (!s.somente || !s.itens || s.recortado) return;
  const f = s.itens.filter(it => ehPergunta(it) && s.somente.includes(it.enunciado));
  if (f.length) s.itens = f;
  s.recortado = true;
}
function itensDe(a, t) {
  if (a.mom === "ref" && a.refConteudo === "erradas" && Array.isArray(a.errados) && a.errados.length) { const f = t.itens.filter(it => ehPergunta(it) && a.errados.includes(it.enunciado)); if (f.length) return f; }
  return t.itens;
}
const fmtDia = ms => { const d = new Date(ms); return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0"); };
const diaSeguinte = ms => { const d = new Date(ms); d.setHours(24, 0, 0, 0); return d.getTime(); };
function prePossiveis(treinoId) {
  return S.sessoes.filter(x => x.estado === "encerrada" && x.mom === "pre" && x.treinoId === treinoId && x.resultado && x.resultado.tabela).slice().reverse();
}
function baseDePre(sid) {
  const x = S.sessoes.find(y => y.id === sid); if (!x || !x.resultado) return undefined;
  return {rot: "Pré-teste", sid: x.id, fim: x.fim, itens: x.resultado.tabela.map(p => ({nome: p.nome, pct: p.pct}))};
}
function ajResumo(a, t) {
  const x = a.aj;
  return [a.mom ? MOM_TXT[a.mom].toLowerCase() : "aplicação normal", x.teste ? "sessão de teste" : "sessão real", `meta ${metaTxt(t)}`, x.tempo === "fecha" ? "tempo fecha a pergunta" : "sem bloqueio de tempo", a.mom === "pre" ? "sem ranking, resposta certa escondida" : (x.ranking ? "ranking ligado" : "sem ranking")].join(" · ");
}
/* seletor de momento dentro do Aplicar */

/* ---------- pendências ---------- */
function pendencias(hoje) {
  hoje = hoje || Date.now();
  const cad = new Map(), val = new Map(), rb = new Map();
  S.sessoes.filter(x => x.estado === "encerrada" && tipoSessao(x) === "real" && x.mom !== "pre" && x.resultado && Array.isArray(x.resultado.tabela))
    .sort((a, b) => String(a.fim).localeCompare(String(b.fim))).forEach(s => {
      s.resultado.tabela.forEach(p => {
        const k = s.treinoId + "|" + nk(p.nome), ok = p.pct >= s.meta;
        const reg = {k, treinoId: s.treinoId, nome: p.nome, setor: p.setor || "", pct: p.pct, sid: s.id, fim: s.fim, meta: s.meta};
        const c = cad.get(k);
        if (s.mom === "ref" && c) c.r.push(reg); else cad.set(k, {n1: reg, r: []});   // a nota oficial é a da 1ª tentativa
        if (ok) val.set(k, reg);
        if (s.mom === "reav") { const b = rb.get(k); if (b) b.feito = Math.max(b.feito, s.dias || 0); }
        else rb.set(k, Object.assign({feito: 0}, reg));
      });
    });
  const bx = S.baixas || [];
  const baixado = (tipo, r) => bx.some(b => b.k === r.k && b.tipo === tipo && String(b.em) >= String(r.fim));
  const out = {ref: [], esgot: [], reav: [], val: []}, falha = new Set();
  cad.forEach((c, k) => {
    const ult = c.r.length ? c.r[c.r.length - 1] : c.n1;
    if (ult.pct >= ult.meta || !treino(ult.treinoId)) return;
    falha.add(k); if (baixado("ref", ult)) return;
    if (c.r.length >= 2) { out.esgot.push(Object.assign({}, ult, {n1: c.n1.pct, n2: c.r[0].pct})); return; }   // 3 tentativas usadas
    const rodada = c.r.length + 2, libera = rodada === 3 ? diaSeguinte(Date.parse(c.r[0].fim)) : 0;                // a 3ª só em outro dia
    out.ref.push(Object.assign({}, ult, {rodada, n1: c.n1.pct, n2: c.r.length ? c.r[0].pct : null, libera, bloqueada: libera > hoje, atras: Math.floor((hoje - Date.parse(ult.fim)) / DIA)}));
  });
  rb.forEach(b => {
    if (falha.has(b.k)) return; const t = treino(b.treinoId); if (!t || !Array.isArray(t.reav) || !t.reav.length) return;
    const d = t.reav.slice().sort((x, y) => x - y).find(x => x > b.feito); if (!d) return;
    const venc = Date.parse(b.fim) + d * DIA, falta = Math.ceil((venc - hoje) / DIA);
    if (falta > 14 || baixado("reav" + d, b)) return;
    out.reav.push(Object.assign({}, b, {d, venc, falta}));
  });
  val.forEach(v => {
    if (falha.has(v.k)) return; const t = treino(v.treinoId); if (!t || !(t.per > 0)) return;
    const venc = Date.parse(v.fim) + t.per * DIA, falta = Math.ceil((venc - hoje) / DIA);
    if (falta > 30 || baixado("val", v)) return;
    out.val.push(Object.assign({}, v, {venc, falta}));
  });
  out.total = out.ref.length + out.reav.length + out.val.length;
  out.atrasadas = out.reav.filter(r => r.falta < 0).length + out.val.filter(r => r.falta < 0).length;
  return out;
}
function gruposPend(tipo, P) {
  const m = new Map();
  P[tipo].forEach(r => { const g = tipo === "reav" ? r.treinoId + "|" + r.d : r.treinoId; if (!m.has(g)) m.set(g, {treinoId: r.treinoId, d: r.d, itens: []}); m.get(g).itens.push(r); });
  return [...m.values()].map(g => Object.assign(g, {t: treino(g.treinoId), itens: g.itens.sort((a, b) => (a.falta ?? 0) - (b.falta ?? 0) || a.nome.localeCompare(b.nome, "pt-BR"))}))
    .sort((a, b) => a.t.titulo.localeCompare(b.t.titulo, "pt-BR") || (a.d || 0) - (b.d || 0));
}
/* perguntas que as pessoas erraram na última tentativa (pelo enunciado, que vale entre versões) */
function errosDe(itens) {

  itens.forEach(r => {
    const x = S.sessoes.find(y => y.id === r.sid), pt = x && x.part.find(q => nk(q.nome) === nk(r.nome)); if (!pt) return;
    x.itens.forEach((it, i) => { if (vale(it) && !((x.resp[pt.id] || {})[i] || {}).ok) m.add(it.enunciado); });

/* ---------- reforço no celular, visto da sala ---------- */

function resumoRefaz(s) {

/* ---------- comparativo: ganho, retenção, efeito do reforço ---------- */
function comparativo(s) {
  const b = s.base; if (!b || !Array.isArray(b.itens) || !b.itens.length) return null;

  });
  if (!lin.length) return {rot: b.rot || "Antes", lin, n: 0, novos, ausentes: mapa.size};
  lin.sort((a, b2) => a.nome.localeCompare(b2.nome, "pt-BR"));
