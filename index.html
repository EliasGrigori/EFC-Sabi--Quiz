<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E4A48">
<title>Sabiá</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<script>try{var t=localStorage.getItem("sabia-tema");if(t==="claro"||t==="escuro")document.documentElement.setAttribute("data-theme",t==="escuro"?"dark":"light")}catch(e){}</script>
<style>
/* Sabiá v0.1.0 · sistema visual: petróleo + laranja sabiá · Bricolage Grotesque + Atkinson Hyperlegible */
:root{
  --bg:#EDF1F1;--surface:#FFFFFF;--surface2:#F5F8F8;--sunk:#E2E9E8;--ink:#122120;--ink2:#4A5C5B;--ink3:#6B7F7D;--line:#D5DEDD;
  --brand:#0E4A48;--brand-hi:#18645F;--on-brand:#E4F2F0;--on-brand-2:#9BC3BF;--brand-ink:#0F5A56;
  --sabia:#D45D17;--sabia-hi:#B84D10;--sabia-soft:#FBE6D8;--on-sabia:#FFFFFF;
  --ok:#1B7A4B;--ok-soft:#DCF0E4;--warn:#9A6200;--warn-soft:#F7EACD;--bad:#B3302A;--bad-soft:#F6DCD9;
  --e1:0 1px 2px rgb(18 33 32/.06),0 2px 8px rgb(18 33 32/.06);
  --e2:0 2px 4px rgb(18 33 32/.06),0 10px 28px rgb(18 33 32/.10);
  --e3:0 4px 10px rgb(18 33 32/.08),0 22px 56px rgb(18 33 32/.18);
  --f-disp:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:16px;--rs:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1514;--surface:#14201F;--surface2:#192826;--sunk:#0A1110;--ink:#E5EEED;--ink2:#A6B8B6;--ink3:#8CA19E;--line:#253634;
  --brand:#0A2F2E;--brand-hi:#15514D;--on-brand:#DDEDEB;--on-brand-2:#86AEA9;--brand-ink:#5CC2B9;
  --sabia:#EE7631;--sabia-hi:#FF8A47;--sabia-soft:#3A2416;--on-sabia:#1A0C04;
  --ok:#4FC587;--ok-soft:#14301F;--warn:#E3A83A;--warn-soft:#33270F;--bad:#F0716A;--bad-soft:#3A1715;
  --e1:0 1px 2px rgb(0 0 0/.3),0 2px 8px rgb(0 0 0/.25);--e2:0 2px 4px rgb(0 0 0/.3),0 10px 28px rgb(0 0 0/.35);--e3:0 4px 10px rgb(0 0 0/.35),0 22px 56px rgb(0 0 0/.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1514;--surface:#14201F;--surface2:#192826;--sunk:#0A1110;--ink:#E5EEED;--ink2:#A6B8B6;--ink3:#8CA19E;--line:#253634;
  --brand:#0A2F2E;--brand-hi:#15514D;--on-brand:#DDEDEB;--on-brand-2:#86AEA9;--brand-ink:#5CC2B9;
  --sabia:#EE7631;--sabia-hi:#FF8A47;--sabia-soft:#3A2416;--on-sabia:#1A0C04;
  --ok:#4FC587;--ok-soft:#14301F;--warn:#E3A83A;--warn-soft:#33270F;--bad:#F0716A;--bad-soft:#3A1715;
  --e1:0 1px 2px rgb(0 0 0/.3),0 2px 8px rgb(0 0 0/.25);--e2:0 2px 4px rgb(0 0 0/.3),0 10px 28px rgb(0 0 0/.35);--e3:0 4px 10px rgb(0 0 0/.35),0 22px 56px rgb(0 0 0/.5);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-disp);margin:0;letter-spacing:-.01em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mut{color:var(--ink2)}
.sm{font-size:13px}
:focus-visible{outline:2px solid var(--sabia);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* casca */
.app{display:grid;grid-template-columns:84px minmax(0,1fr);height:100dvh}
.rail{background:var(--brand);color:var(--on-brand);display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;padding-left:max(8px,env(safe-area-inset-left))}
.rail .lg{width:48px;height:48px;border-radius:16px;background:var(--brand-hi);display:grid;place-items:center;margin-bottom:10px;box-shadow:inset 0 1px 0 rgb(255 255 255/.14)}
.rail .lg svg{width:32px;height:32px}
.ri{width:68px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 6px;border:0;background:none;color:var(--on-brand-2);font-size:12px;font-weight:500;cursor:pointer;text-decoration:none;position:relative;border-radius:12px}
.ri .pill{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .15s}
.ri:hover .pill{background:rgb(255 255 255/.08)}
.ri[aria-current="page"]{color:#fff}
.ri[aria-current="page"] .pill{background:var(--sabia);color:var(--on-sabia)}
.ri .n{position:absolute;top:2px;right:8px;min-width:18px;height:18px;border-radius:9px;background:var(--sabia);color:var(--on-sabia);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.rail .sp{flex:1}
.mn{display:flex;flex-direction:column;min-width:0;min-height:0}
.tb{display:flex;align-items:center;gap:12px;padding:14px 24px 10px;padding-right:max(24px,env(safe-area-inset-right));flex-wrap:wrap}
.tb h1{font-size:24px;font-weight:800;line-height:1.1}
.tb .sub{color:var(--ink2);font-size:14px}
.tb .grow{flex:1}
.body{flex:1;overflow:auto;padding:4px 24px 24px;padding-right:max(24px,env(safe-area-inset-right));display:grid;gap:14px;align-content:start}
.bnav{display:none}

/* botões e campos */
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;color:var(--ink);box-shadow:var(--e1);white-space:nowrap}
.b:hover{border-color:var(--ink3)}
.b.p{background:var(--sabia);border-color:var(--sabia);color:var(--on-sabia)}
.b.p:hover{background:var(--sabia-hi)}
.b.s{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.b.g{box-shadow:none;background:transparent}
.b.ic{width:44px;padding:0;flex:none}
.b.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.b[disabled]{opacity:.5;cursor:not-allowed}
.b.bad{color:var(--bad)}
.fd{display:grid;gap:4px;min-width:0}
.fd label,.lbl{font-size:12px;font-weight:700;color:var(--ink2)}
.in{min-height:44px;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.k{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--e1);padding:14px 16px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--sunk);color:var(--ink2)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.br{background:var(--sabia-soft);color:var(--sabia-hi)}

/* início */
.home{grid-template-columns:repeat(12,minmax(0,1fr));align-items:start}
.coach{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--brand);color:var(--on-brand);border-color:transparent}
.coach .ms{width:52px;height:52px;border-radius:16px;background:var(--brand-hi);display:grid;place-items:center}
.coach .ms svg{width:34px;height:34px}
.coach .eb{font-size:12px;font-weight:700;color:var(--on-brand-2);text-transform:uppercase;letter-spacing:.06em}
.coach h2{font-size:20px;color:#fff;margin:2px 0}
.coach p{margin:0;color:var(--on-brand-2);font-size:14px}
.coach .acts{display:flex;gap:8px;flex-wrap:wrap}
.coach .b.g{color:var(--on-brand);border-color:var(--on-brand-2)}
.kpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:0}
.kp{padding:12px 16px;border-right:1px solid var(--line)}
.kp:last-child{border:0}
.kp .v{font-family:var(--f-disp);font-weight:800;font-size:28px;line-height:1.1}
.kp .l{font-size:13px;color:var(--ink2)}
.mini{grid-column:span 6}
.mini .kh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.mini h3{font-size:16px}
.rows{display:grid}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row>div{flex:1;min-width:0}
.row b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl{grid-column:1/-1;padding:0;overflow:hidden}

/* lista de treinamentos */
.tbar{display:flex;gap:10px;align-items:center;padding:12px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px}
.seg button{border:0;background:none;min-height:38px;padding:0 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink2);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--e1)}
.seg i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--ink3)}
.srch{position:relative;flex:1;min-width:180px}
.srch svg{position:absolute;left:12px;top:12px;color:var(--ink3);width:20px;height:20px}
.srch .in{padding-left:40px}
.fpan{display:flex;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--line)}
.tr{display:grid;grid-template-columns:minmax(0,2.4fr) 64px 92px 150px 276px;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.tr.h{border-top:0;font-size:12px;font-weight:700;color:var(--ink2);padding-block:8px;background:var(--surface2)}
.tr .t b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .t span{font-size:13px;color:var(--ink2)}
.tr .acts{display:flex;gap:6px;justify-content:flex-end}
.meta-bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:4px}
.meta-bar i{display:block;height:100%;background:var(--brand-ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:14px 16px}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;background:var(--surface)}
.card b{font-family:var(--f-disp);font-size:17px}
.vazio{padding:28px 16px;text-align:center;color:var(--ink2);display:grid;gap:10px;justify-items:center}

/* aplicar */
.apl{grid-template-columns:minmax(0,1fr) 340px;align-items:start}
.apl .lc{display:grid;gap:12px}
.sec h3{font-size:16px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.st{width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:13px;font-weight:700;font-family:var(--f-mono)}
.pres{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pr{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);text-align:left;cursor:pointer;display:grid;gap:4px;align-content:start}
.pr[aria-pressed="true"]{border-color:var(--sabia);background:var(--sabia-soft)}
.pr .pic{width:40px;height:40px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;color:var(--brand-ink);margin-bottom:2px}
.pr[aria-pressed="true"] .pic{background:var(--sabia);color:var(--on-sabia)}
.pr b{font-family:var(--f-disp);font-size:16px}
.pr span{font-size:13px;color:var(--ink2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.sc{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.sc[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
details.adv{padding:0}
details.adv summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;min-height:56px}
details.adv summary::-webkit-details-marker{display:none}
details.adv .chev{margin-left:auto;transition:transform .15s;display:grid;place-items:center;width:24px;height:24px}
details.adv .chev svg{width:20px;height:20px}
details.adv[open] .chev{transform:rotate(180deg)}
.advg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 20px;padding:4px 16px 16px;border-top:1px solid var(--line);padding-top:14px}
.opt{display:flex;gap:10px;align-items:flex-start;min-height:44px}
.opt input{width:22px;height:22px;margin-top:2px;accent-color:var(--sabia);flex:none}
.opt small{display:block;color:var(--ink2);font-size:12px;line-height:1.3}
.sum{position:sticky;top:4px;display:grid;gap:10px}
.sum .hd b{font-family:var(--f-disp);font-size:18px;display:block}
.tl{display:grid;gap:0}
.tli{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line);font-size:14px}
.tli:first-child{border-top:0}
.tli .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--f-mono)}
.nd.e{background:var(--sabia-soft);color:var(--sabia-hi);border-color:transparent}

/* ajustes e páginas simples */
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.page{max-width:980px}
.road{display:grid;gap:6px}
.road li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.road ul{list-style:none;margin:0;padding:0}
.road li:first-child{border-top:0}

/* diálogo e aviso */
dialog{border:0;border-radius:20px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--e3);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgb(8 20 19/.55)}
.dl{display:grid;gap:12px;padding:18px}
.dl header{display:flex;align-items:center;gap:10px}
.dl header h2{font-size:20px;flex:1}
.opcao{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;min-height:56px;cursor:pointer}
.opcao:hover{border-color:var(--sabia)}
.opcao .pic{width:40px;height:40px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;color:var(--brand-ink);flex:none}
.opcao b{display:block}
.opcao span.d{font-size:13px;color:var(--ink2)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;box-shadow:var(--e3);max-width:calc(100vw - 24px)}
#toast button{border:0;background:none;color:var(--sabia);font-weight:700;cursor:pointer;min-height:36px;padding:0 8px}
:root[data-theme="dark"] #toast button,:root:not([data-theme="light"]) #toast button{color:var(--sabia)}

@media (max-width:1100px){.apl{grid-template-columns:1fr}.sum{position:static}.mini{grid-column:1/-1}.kpis{grid-template-columns:repeat(2,1fr)}.kp:nth-child(2){border-right:0}.kp:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .rail{display:none}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--brand);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--on-brand-2);font-size:11px;font-weight:500;text-decoration:none;min-height:48px;justify-content:center;position:relative}
  .bnav a[aria-current="page"]{color:#fff}
  .bnav a[aria-current="page"] .pill{background:var(--sabia);color:var(--on-sabia)}
  .bnav .pill{width:48px;height:28px;border-radius:14px;display:grid;place-items:center}
  .tb{padding:12px 16px 8px}.tb h1{font-size:21px}
  .body{padding:4px 16px 16px}
  .coach{grid-template-columns:1fr}.coach .ms{display:none}.coach h2{font-size:18px}
  .tb{flex-wrap:nowrap}.tb .lbl-m{display:none}.tb .b.p{width:44px;padding:0}
  .pres,.fields,.cols,.advg{grid-template-columns:1fr}
  .pr{grid-template-columns:44px 1fr;column-gap:12px;align-items:center;padding:10px 12px}.pr .pic{grid-row:span 2;margin:0}.pr span:not(.pic){grid-column:2}
  .tr{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}
  .tr.h{display:none}.tr .hide-m{display:none}
  .tbar .srch{flex-basis:100%;order:3}
  #toast{bottom:calc(76px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== v0.2.0 · sala ao vivo e telão ===== */
.modo-telao .rail,.modo-telao .bnav,.modo-telao .tb{display:none!important}
.modo-telao .app{grid-template-columns:1fr;grid-template-rows:1fr}
.modo-telao .body{padding:0;overflow:hidden;background:#000;display:block}
.sala{grid-template-columns:minmax(0,420px) minmax(0,1fr);align-items:start}
.sala .lc{display:grid;gap:12px}
.chave{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chave .cod{font-family:var(--f-mono);font-weight:600;font-size:34px;letter-spacing:.08em;line-height:1}
.etapa{display:grid;gap:10px}
.etapa .eh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.etapa .et{font-family:var(--f-disp);font-size:20px;font-weight:800}
.etapa .tm{margin-left:auto;font-family:var(--f-mono);font-size:28px;font-weight:600}
.etapa .go{min-height:56px;font-size:17px;width:100%}
.pbar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--sabia);width:0;transition:width .25s linear}
.tl2{display:flex;gap:6px;flex-wrap:wrap}
.tl2 .nd{width:30px;height:30px;font-size:13px;background:var(--surface)}
.tl2 .nd.fe{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tl2 .nd.at{background:var(--sabia);color:var(--on-sabia);border-color:transparent}
.tl2 .nd.e{border-color:transparent}
.pgrid{display:flex;gap:6px;flex-wrap:wrap}
.pp{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;background:var(--surface)}
.pp.ok{border-color:var(--ok);background:var(--ok-soft)}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;font-size:12px;flex:none;width:26px;height:26px}
.dist{display:grid;gap:6px}
.dist .dr{display:grid;grid-template-columns:22px 1fr 40px;gap:8px;align-items:center;font-size:14px}
.dist .db{height:14px;border-radius:7px;background:var(--sunk);overflow:hidden}
.dist .db i{display:block;height:100%}
.rk{display:grid;gap:0}

.rel .mp2 .b:hover{background:var(--sunk)}
.rl-cod b{font-size:14px;letter-spacing:.02em}
.mono{font-family:var(--f-mono)}
.rl-abas{display:flex;max-width:560px}
.rl-abas button{flex:1;white-space:nowrap}
.rsm.q4{grid-template-columns:repeat(4,1fr)}
.rel .rh{font-size:17px;margin:0 0 10px}
.rel .rh2{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.rel .rh2 .rh{margin:0}
.rel .acoes{list-style:none;margin:0;padding:0;display:grid}
.rel .acoes li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);min-height:52px}
.rel .acoes li:first-child{border-top:0;padding-top:2px}
.rel .acs{display:flex;gap:6px}
.rel .ai{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--ink2);flex:none}
.rel .ai svg{width:18px;height:18px}
.rel .ai.ok{background:var(--ok-soft);color:var(--ok)}
.rel .ai.warn{background:var(--warn-soft);color:var(--warn)}
.rtw{overflow-x:auto;margin:0 -4px;padding:0 4px}
.rtb{width:100%;border-collapse:collapse;font-size:14px}
.rtb th,.rtb td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
.rtb thead th{border-top:0;font-size:12px;font-weight:700;color:var(--ink2);background:var(--surface2);white-space:nowrap}
.rtb thead th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;min-height:32px;font:inherit;font-weight:700}
.rtb thead th button:focus-visible{outline:2px solid var(--sabia);outline-offset:2px}
.rtb .n{text-align:right}
.rel .asm{all:unset;cursor:pointer;display:inline-grid;place-items:center;min-width:44px;min-height:36px;border-radius:8px;background:#fff;border:1px solid var(--line)}
.rel .asm:focus-visible{outline:2px solid var(--sabia);outline-offset:2px}
.rel .asm img{display:block;max-width:64px;height:auto}
.rel .assg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;place-items:center}
.rel .assg img{max-width:100%;height:auto}
.rel .mapa{overflow:auto;max-height:60vh}
.rel .mp th.nm,.mp td.nm{position:sticky;left:0;background:var(--surface);font-weight:600;min-width:130px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:1}
.rel .mp thead th.nm{background:var(--surface2)}
.mc{text-align:center !important;width:40px;min-width:40px;padding:6px 4px !important}
td.mc svg{width:18px;height:18px;vertical-align:middle}
td.mc.ok,i.mc.ok{background:var(--ok-soft);color:var(--ok)}
td.mc.no,i.mc.no{background:var(--bad-soft);color:var(--bad)}
td.mc.nr,i.mc.nr{background:var(--sunk);color:var(--ink2)}
td.mc.fr{color:var(--bad);font-weight:700}
.rel .mp tfoot td,.mp tfoot th{font-size:12px;background:var(--surface2)}
.rel .leg{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;color:var(--ink2)}
.rel .leg span{display:inline-flex;align-items:center;gap:6px}
i.mc{display:inline-grid;place-items:center;width:26px;height:26px;min-width:26px;border-radius:7px;font-style:normal;padding:0 !important}
i.mc svg{width:16px;height:16px}
.rel .aslist{display:grid}
.rel .as{display:grid;grid-template-columns:40px minmax(0,1fr) 84px;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.rel .as:first-child{border-top:0;padding-top:2px}
.rel .as .qn{width:32px;height:32px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--ink2)}
.rel .aq{display:grid;gap:6px;min-width:0}
.rel .aq b{font-weight:600}
.rel .ap{display:grid;justify-items:end;gap:4px;font-size:18px;font-weight:700}
.rel .bar{position:relative;height:10px;border-radius:999px;background:var(--sunk);overflow:visible}
.rel .bar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--ok)}
.rel .bar i.fr{background:var(--warn)}
.rel .bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);text-decoration:none;opacity:.55}
.rel .bar.sb{min-width:120px;margin-bottom:4px}
.rel .cf-f{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.rel .cf-ou{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.rel .cf-r{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;border-width:1.5px}
.rel .cf-r.ok{border-color:var(--ok)}
.rel .cf-r.no{border-color:var(--warn)}
.logo-ln{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.logo-pv{max-height:44px;max-width:160px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:2px}
.reap{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-4px 0 10px}
@media (max-width:860px){
  .rl-top{grid-template-columns:1fr}
  .rl-abas{max-width:none}
  .rl-abas button{padding:0 4px;font-size:13px}
  .rsm.q4{grid-template-columns:1fr 1fr}
  .rel .acoes li{grid-template-columns:32px minmax(0,1fr)}
  .rel .acoes li>:last-child:not(:nth-child(2)){grid-column:2}
  .rel .as{grid-template-columns:34px minmax(0,1fr) 64px;gap:8px}
}

.rel .tmp{display:grid;gap:8px}
.rel .tl-s{display:grid;grid-template-columns:150px minmax(0,1fr) 52px;gap:12px;align-items:center}
.rel .tl-s.at .sm{font-weight:700}
.rel .tl-s b{text-align:right}
@media (max-width:860px){.rel .tl-s{grid-template-columns:120px minmax(0,1fr) 44px;gap:8px}}

</style>

function aplicarTema() {

  else document.documentElement.removeAttribute("data-theme");
  try { localStorage.setItem("sabia-tema", t); } catch(e) {}
}

/* ===== v0.3.0 · editor de perguntas e versões ===== */
const TIPOS = {multipla: "Múltipla escolha", vf: "Verdadeiro ou falso", ordenar: "Ordenar", explicacao: "Explicação"};
const TIPOS_CURTO = {multipla: "Múltipla", vf: "V ou F", ordenar: "Ordenar", explicacao: "Explicação"};
const USOS = {avaliacao: "Vale nota", gincana: "Gincana (vale nota)", ensaio: "Teste (não vale nota)"};
const TEMPOS = [10, 15, 20, 30, 45, 60, 90, 120];
const MAX_ALT = 4, MAX_ORD = 5;
const clone = o => JSON.parse(JSON.stringify(o));
const agora = () => new Date().toISOString();
const novoItem = tipo => ({
  explicacao: {tipo: "explicacao", enunciado: "", texto: ""},
  multipla: {tipo: "multipla", enunciado: "", alternativas: ["", "", "", ""], correta: null, tempo: 20, uso: "avaliacao", porque: ""},
  vf: {tipo: "vf", enunciado: "", alternativas: ["Verdadeiro", "Falso"], correta: null, tempo: 20, uso: "avaliacao", porque: ""},
  ordenar: {tipo: "ordenar", enunciado: "", alternativas: ["", "", ""], tempo: 45, uso: "avaliacao", porque: ""}
}[tipo]);

/* ---------- conferência de cada pergunta ---------- */
function problemasItem(it) {
  const p = [];
  if (!String(it.enunciado || "").trim()) p.push("Falta o enunciado");
  if (it.tipo === "multipla") {
    const a = it.alternativas || [];
    if (a.some(x => !String(x).trim())) p.push("Há alternativa em branco");
    if (!Number.isInteger(it.correta) || it.correta < 0 || it.correta >= a.length) p.push("Marque a resposta certa");
  } else if (it.tipo === "vf") {
    if (!Number.isInteger(it.correta) || it.correta < 0 || it.correta > 1) p.push("Marque verdadeiro ou falso");
  } else if (it.tipo === "ordenar") {
    const a = it.alternativas || [];
    if (a.length < 3) p.push("Use pelo menos 3 passos");
    if (a.some(x => !String(x).trim())) p.push("Há passo em branco");
  }
  return p;
}
const problemasTreino = t => t.itens.map((it, i) => ({i, m: problemasItem(it)})).filter(x => x.m.length);
const numeroItem = (t, i) => { const it = t.itens[i]; if (it.tipo === "explicacao") return "E"; if (it.uso === "ensaio") return "T"; return String(t.itens.slice(0, i + 1).filter(x => x.tipo !== "explicacao" && x.uso !== "ensaio").length); };

/* ---------- versões ---------- */
function garantirSnap(t) {
  const v = (t.versoes || []).find(x => x.n === t.versao);
  if (v && !v.itens && !t.sujo) { v.itens = clone(t.itens); v.titulo = t.titulo; v.meta = t.meta; }
}
function editou(t) { garantirSnap(t); t.sujo = true; t.atualizado = agora(); salvar(); }
function salvarVersao(t, nota) {
  garantirSnap(t);
  const n = (t.versoes || []).reduce((m, x) => Math.max(m, x.n), -1) + 1;
  t.versoes.push({n, nota: nota || "Ajustes nas perguntas", quando: agora(), titulo: t.titulo, meta: t.meta, itens: clone(t.itens)});
  t.versao = n; t.sujo = false; salvar(); return n;
}
function fixarVersao(t) { if (t.sujo) salvarVersao(t, "Fixada ao aplicar"); }
const chaveItem = i => String(i.enunciado || "").trim().toLowerCase();
function difVersao(v, t) {
  const a = v.itens || [], b = t.itens, ma = new Map(a.map(i => [chaveItem(i), i])), mb = new Map(b.map(i => [chaveItem(i), i]));
  let novas = b.filter(i => !ma.has(chaveItem(i))), removidas = a.filter(i => !mb.has(chaveItem(i)));
  const alteradas = b.filter(i => ma.has(chaveItem(i)) && JSON.stringify(ma.get(chaveItem(i))) !== JSON.stringify(i));
  /* pergunta que só mudou o enunciado, na mesma posição e formato, conta como alterada e não como nova + removida */
  b.forEach((i, k) => { const o = a[k]; if (o && novas.includes(i) && removidas.includes(o) && o.tipo === i.tipo) { novas = novas.filter(x => x !== i); removidas = removidas.filter(x => x !== o); alteradas.push(i); } });
  const mesmas = !novas.length && !removidas.length;
  const reordenou = mesmas && a.length === b.length && a.some((i, k) => chaveItem(i) !== chaveItem(b[k]));
  return {novas, removidas, alteradas, reordenou, titulo: v.titulo !== undefined && v.titulo !== t.titulo, meta: v.meta !== undefined && v.meta !== t.meta, igual: mesmas && !alteradas.length && !reordenou && !(v.titulo !== undefined && v.titulo !== t.titulo) && !(v.meta !== undefined && v.meta !== t.meta)};
}
const curto = (s, n = 70) => { s = String(s || "(sem enunciado)"); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
function difHTML(d, v, t) {
  if (d.igual) return `<div class="df"><span>Igual ao rascunho atual.</span></div>`;
  const li = (c, s, l) => l.map(i => `<div class="${c}"><i>${s}</i><span>${esc(curto(i.enunciado))}</span></div>`).join("");
  return `<div class="df">${li("ad", "+", d.novas)}${li("rm", "−", d.removidas)}${li("ch", "~", d.alteradas)}${d.reordenou ? `<div class="ch"><i>~</i><span>Ordem das perguntas mudou</span></div>` : ""}${d.titulo ? `<div class="ch"><i>~</i><span>Título era "${esc(curto(v.titulo, 50))}"</span></div>` : ""}${d.meta ? `<div class="ch"><i>~</i><span>Meta era ${v.meta}%</span></div>` : ""}<span class="mut">Comparado com o rascunho atual. + nova, − removida, ~ alterada.</span></div>`;
}
function dlgVersoes() {
  const t = treino(UI.ed && UI.ed.id); if (!t) return;
  garantirSnap(t);
  const d = $("#dlg"), prox = (t.versoes || []).reduce((m, x) => Math.max(m, x.n), -1) + 1;

}

/* ---------- assinatura ---------- */
function prepararAssinatura(c) {
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#0A2C2B";
  let desenhando = false, ult = null;
  const pt = e => { const r = c.getBoundingClientRect(); return {x: (e.clientX - r.left) * c.width / r.width, y: (e.clientY - r.top) * c.height / r.height}; };
  c.addEventListener("pointerdown", e => { desenhando = true; ult = pt(e); try { c.setPointerCapture(e.pointerId); } catch(x) {} ctx.beginPath(); ctx.arc(ult.x, ult.y, 2.5, 0, 7); ctx.fillStyle = "#0A2C2B"; ctx.fill(); CE.tracos++; e.preventDefault(); });
  c.addEventListener("pointermove", e => { if (!desenhando) return; const p = pt(e); ctx.beginPath(); ctx.moveTo(ult.x, ult.y); ctx.lineTo(p.x, p.y); ctx.stroke(); ult = p; CE.tracos++; e.preventDefault(); });
  const fim = () => { desenhando = false; };
  c.addEventListener("pointerup", fim); c.addEventListener("pointercancel", fim);
}
async function assinarCel() {
  const c = $("#cassin"); if (!c) return;
  if (CE.tracos < 8) { aviso("Faça a assinatura com o dedo antes de enviar."); return; }
  const o = document.createElement("canvas"); o.width = 300; o.height = 120; const x = o.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, 300, 120); x.drawImage(c, 0, 0, 300, 120);
  const d = o.toDataURL("image/jpeg", 0.6);
  try { await Rede.req(CE.base, "PUT", "/salas/" + CE.chave + "/ass/" + CE.pid, d); }
  catch(e) { if (e.status !== 401 && e.status !== 403) { aviso("Não enviou. Confira a internet e toque de novo."); return; } }
  CE.assinou = true; try { localStorage.setItem(chaveLS("sabia-a-"), "1"); } catch(e) {} CE.tracos = 0; CE.html = ""; pintaCel();
}

async function enviarResp(r) {

  catch(e) { if (e.status === 401 || e.status === 403) CE.resp[idx] = r; else aviso("Não enviou. Confira a internet e toque de novo."); }
  CE.enviando = false; CE.html = ""; pintaCel();
}
async function entrarCel(nome, setor) {
  const m = CE.pub.meta, ro = lista(m.roster);

  if (nome.length < 3) { CE.erro = "Digite seu nome."; return; }
  if (ro.length) { const ach = ro.find(x => semAcento(x) === semAcento(nome)); if (!ach) { CE.erro = "Escolha seu nome na lista. Não achou? Fale com o instrutor."; return; } nome = ach; }

  catch(e) { CE.erro = "Não consegui entrar. Confira a internet e tente de novo."; return; }
  Object.assign(CE, {pid, nome, entrou: true, jaEntrou: true, erro: ""});

}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return; const a = el.dataset.act;

  else if (a === "cretry") { const c = CE.chave, s = CE.sg; pararCel(); iniciarCel(c, s); CE.html = ""; pintaCel(); }
  else if (a === "cassinar") assinarCel();
  else if (a === "climpar") { const c = $("#cassin"); if (c) { const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); CE.tracos = 0; } }
});
function atualizaSug() {

  if (n > 1 && a.every((v, i) => v === i)) a.push(a.shift());

};
const linkBase = () => location.href.split("#")[0].split("?")[0];

function abrirSalaDe(sessao) {

function abrirSalaNova() {

/* ---------- regras da sessão ---------- */
const ehPergunta = it => it.tipo !== "explicacao";
const vale = it => ehPergunta(it) && it.uso !== "ensaio";
function entrarItem(s, i) {

function novoPdf(titulo) {

          let k = p.length; while (k > 1 && d.larg(p.slice(0, k), tam, neg) > lg) k--;
          if (lin) { out.push(lin); lin = ""; }
          out.push(p.slice(0, k)); p = p.slice(k);
        }
        const t = lin ? lin + " " + p : p;
        if (d.larg(t, tam, neg) <= lg) lin = t; else { if (lin) out.push(lin); lin = p; }

  };

    const tam = o.tam || 10, neg = !!o.neg; let t = String(s ?? ""); if (!t) return;

  /* tabela: cols = [{t, w, al}], linhas = [[cel,...]]; cel pode ser texto ou {img, h} ou {txt, neg, cor} */
  d.tabela = (cols, linhas, o = {}) => {
    const tam = o.tam || 9, pad = 4, x0 = M, total = cols.reduce((a, c) => a + c.w, 0), esc = (W - 2 * M) / total;
    const larguras = cols.map(c => c.w * esc);
    const cabeca = () => {
      d.garante(24); d.ret(x0, d.y, W - 2 * M, 18, {fundo: "#E2E9E8"});
      let x = x0; cols.forEach((c, i) => { d.texto(c.al === "dir" ? x + larguras[i] - pad : c.al === "cen" ? x + larguras[i] / 2 : x + pad, d.y + 12.5, c.t, {tam: 8, neg: true, cor: "#334", al: c.al}); x += larguras[i]; });
      d.y += 18;
    };
    cabeca();
    linhas.forEach(l => {
      const cel = l.map((c, i) => (c && typeof c === "object") ? c : {txt: String(c ?? "")});
      let alt = 0; const quebras = cel.map((c, i) => {
        if ("img" in c) { alt = Math.max(alt, (c.h || 24) + 2 * pad); return null; }
        const ls = d.quebra(c.txt, larguras[i] - 2 * pad, tam, c.neg).slice(0, o.maxLin || 4); alt = Math.max(alt, ls.length * tam * 1.3 + 2 * pad); return ls;
      });
      alt = Math.max(alt, 18);
      if (d.y + alt > H - 54) { d.nova(); cabeca(); }
      let x = x0;
      cel.forEach((c, i) => {
        const al = cols[i].al;
        if ("img" in c) { const bx = x + pad, bw = larguras[i] - 2 * pad; if (!d.imgCabe(c.img, bx, d.y + pad, bw, c.h || 24, "cen")) d.texto(x + larguras[i] / 2, d.y + alt / 2 + 3, c.vazio || "sem assinatura", {tam: 8, cor: "#8a9998", al: "cen"}); }
        else quebras[i].forEach((t, k) => d.texto(al === "dir" ? x + larguras[i] - pad : al === "cen" ? x + larguras[i] / 2 : x + pad, d.y + pad + tam + k * tam * 1.3 - 1, t, {tam, neg: c.neg, cor: c.cor, al}));
        x += larguras[i];
      });
      d.y += alt; d.linha(x0, d.y, W - M, d.y, {cor: "#d5dedd", esp: .5});
    });
    d.y += 6;
  };
  d.saida = () => {
    if (!d.pgs.length) d.nova();
    const N = d.pgs.length;
    if (d.rodape) d.pgs.forEach((ops, i) => { d.ops = ops; d.rodape(d, i + 1, N); });
    const partes = [], offs = []; let pos = 0;
    const enc = s => { const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i) & 255; return u; };
    const add = p => { partes.push(p); pos += p.length; };
    const obj = (n, corpo) => { offs[n] = pos; add(enc(`${n} 0 obj\n${corpo}\nendobj\n`)); };
    const nImg = d.imgs.length, primeiraPg = 5 + nImg;
    add(enc("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n"));
    obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
    obj(2, `<< /Type /Pages /Count ${N} /Kids [${d.pgs.map((_, i) => `${primeiraPg + i * 2} 0 R`).join(" ")}] >>`);
    obj(3, "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
    obj(4, "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
    d.imgs.forEach((j, i) => {
      const n = 5 + i; offs[n] = pos;
      add(enc(`${n} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${j.w} /Height ${j.h} /ColorSpace /${j.comp === 1 ? "DeviceGray" : j.comp === 4 ? "DeviceCMYK" : "DeviceRGB"} /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.bytes.length} >>\nstream\n`)); add(j.bytes); add(enc("\nendstream\nendobj\n"));
    });
    const xobj = d.imgs.map((_, i) => `/Im${i} ${5 + i} 0 R`).join(" ");
    d.pgs.forEach((ops, i) => {
      const np = primeiraPg + i * 2, nc = np + 1, fluxo = ops.join("\n");
      obj(np, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${num2(W)} ${num2(H)}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>${nImg ? ` /XObject << ${xobj} >>` : ""} >> /Contents ${nc} 0 R >>`);
      obj(nc, `<< /Length ${fluxo.length} >>\nstream\n${fluxo}\nendstream`);
    });
    const nInfo = primeiraPg + N * 2, total = nInfo, dt = new Date(), pd = n => String(n).padStart(2, "0");
    const dataPdf = `D:${dt.getUTCFullYear()}${pd(dt.getUTCMonth() + 1)}${pd(dt.getUTCDate())}${pd(dt.getUTCHours())}${pd(dt.getUTCMinutes())}${pd(dt.getUTCSeconds())}Z`;
    const lit = s => "(" + Array.from(String(s)).map(ch => { const b = baitePdf(ch); return (b === 40 || b === 41 || b === 92) ? "\\" + ch : b > 126 ? "\\" + b.toString(8).padStart(3, "0") : String.fromCharCode(b < 32 ? 63 : b); }).join("") + ")";
    obj(nInfo, `<< /Title ${lit(titulo)} /Producer ${lit("Sabiá " + VERSAO)} /Creator ${lit("Sabiá")} /CreationDate (${dataPdf}) >>`);
    const xref = pos; let x = `xref\n0 ${total + 1}\n0000000000 65535 f \n`;
    for (let n = 1; n <= total; n++) x += String(offs[n]).padStart(10, "0") + " 00000 n \n";
    add(enc(x + `trailer\n<< /Size ${total + 1} /Root 1 0 R /Info ${nInfo} 0 R >>\nstartxref\n${xref}\n%%EOF\n`));
    const out = new Uint8Array(pos); let o = 0; partes.forEach(p => { out.set(p, o); o += p.length; });
    return out;
  };
  d.nova();
  return d;
}

/* ===== v0.5.0 · relatórios, PDFs, planilha, foto da turma, logotipo e conferência ===== */
const REL = {sid: null, aba: "resumo", ord: {c: "pts", d: -1}, asOrd: "aula"};
const CF = {res: null, cod: ""};

const encerradas = () => S.sessoes.filter(x => x.estado === "encerrada").slice().reverse();
const tipoSessao = s => (s.aj && s.aj.teste) ? "teste" : (s.part || []).some(p => p.sim) ? "ensaio" : "real";
const TIPO_TXT = {teste: "Sessão de teste", ensaio: "Ensaio com simulados", real: "Registro oficial"};
const dtc = iso => { try { return new Date(iso).toLocaleString("pt-BR", {day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit"}); } catch (e) { return ""; } };
const dtd = iso => { try { return new Date(iso).toLocaleDateString("pt-BR"); } catch (e) { return ""; } };
const horasTxt = h => String(h || "").replace(".", ",") + " h";
const verTxt = s => "v" + String(s.versao ?? 0).padStart(2, "0");
const situ = (s, p) => !(s.resp[p.id] && Object.keys(s.resp[p.id]).length) ? "Não respondeu" : p.pct >= s.meta ? "Atingiu a meta" : "Abaixo da meta";

/* ---------- números da sessão ---------- */
function estat(s) {
  const c = calc(s), qs = s.itens.map((it, i) => [it, i]).filter(([it]) => vale(it));
  let somaMs = 0, nMs = 0;
  const perg = qs.map(([it, i], k) => {
    let n = 0, ac = 0; const er = {};
    s.part.forEach(p => {
      const r = (s.resp[p.id] || {})[i]; if (!r) return;
      n++; if (r.ok) ac++; if (r.ms > 0) { somaMs += r.ms; nMs++; }
      if (!r.ok && it.tipo !== "ordenar") er[r.r] = (er[r.r] || 0) + 1;
    });
    const ks = Object.keys(er).sort((a, b) => er[b] - er[a]);
    return {n: k + 1, i, it, resp: n, ac, pct: n ? Math.round(100 * ac / n) : 0, errada: ks.length ? {alt: Number(ks[0]), n: er[ks[0]]} : null};
  });
  const nota = c.pessoas.length ? Math.round(c.pessoas.reduce((a, p) => a + p.pct, 0) / c.pessoas.length) : 0;
  const por = {}; c.pessoas.forEach(p => { const k = p.setor || "Sem setor"; (por[k] = por[k] || []).push(p); });
  const setores = Object.entries(por).map(([nome, l]) => ({nome, n: l.length, pct: Math.round(l.reduce((a, p) => a + p.pct, 0) / l.length), efic: l.filter(p => p.pct >= s.meta).length}))
    .sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
  const pessoas = c.pessoas.map(p => { const o = s.part.find(x => x.id === p.id) || {}; return Object.assign({}, p, {sim: !!o.sim, ass: o.ass || "", sit: situ(s, p)}); });
  return {c, perg, nota, tempo: nMs ? somaMs / nMs / 1000 : 0, setores, pessoas, abaixo: pessoas.filter(p => p.pct < s.meta), fracas: perg.filter(q => q.resp && q.pct < 60)};
}
const tempoTxt = t => t ? (Math.round(t * 10) / 10).toString().replace(".", ",") + " s" : "–";

/* ---------- código de conferência ---------- */
function canonSessao(s) {
  const c = calc(s), qs = s.itens.map((it, i) => [it, i]).filter(([it]) => vale(it));
  const pessoas = c.pessoas.map(p => {
    const o = s.part.find(x => x.id === p.id) || {}, rs = s.resp[p.id] || {};
    return [p.nome, p.setor || "", p.ac, p.pts, p.pct, qs.map(([, i]) => rs[i] ? (rs[i].ok ? "1" : "0") : "-").join(""), o.ass ? sha256(o.ass).slice(0, 16) : ""];
  }).sort((a, b) => a[0].localeCompare(b[0], "pt-BR") || a[1].localeCompare(b[1], "pt-BR") || a[6].localeCompare(b[6]));
  const perguntas = sha256(JSON.stringify(qs.map(([it]) => [it.tipo, it.enunciado, it.alternativas || null, it.correta ?? null]))).slice(0, 16);
  return JSON.stringify({v: 1, t: s.titulo, ver: s.versao ?? 0, fim: s.fim, ins: s.instrutor || "", loc: s.local || "", h: String(s.horas || ""), meta: s.meta, np: qs.length, q: perguntas, teste: !!(s.aj && s.aj.teste), sim: s.part.some(p => p.sim), p: pessoas});
}
function codigoDe(s) { return "SAB-" + sha256(canonSessao(s)).slice(0, 20).toUpperCase().match(/.{4}/g).join("-"); }
function garantirCodigo(s) { if (!s.cod) { s.cod = codigoDe(s); s.codTardio = true; s.codEm = new Date().toISOString(); salvar(); } return s.cod; }
function normCodigo(t) {
  let x = String(t || "").toUpperCase().replace(/[^0-9A-Z]/g, "");
  if (x.length === 23 && x.startsWith("SAB")) x = x.slice(3);
  return /^[0-9A-F]{20}$/.test(x) ? "SAB-" + x.match(/.{4}/g).join("-") : "";
}
const integra = s => codigoDe(s) === garantirCodigo(s);

/* ---------- arquivos ---------- */
function baixarBlob(nome, blob) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
const nomeArq = (pre, s, ext) => `${pre}-${slug(s.titulo)}-${(s.fim || "").slice(0, 10)}.${ext}`;
const celCsv = v => { let t = String(v ?? ""); if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; return /[";\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
function csvSessao(s) {
  const e = estat(s);
  const cab = ["Nome", "Setor", "Acertos", "Perguntas", "Percentual", "Pontos", "Situação", "Assinou", ...e.perg.map(q => "P" + q.n)];
  const linhas = e.pessoas.map(p => { const rs = s.resp[p.id] || {}; return [p.nome, p.setor || "", p.ac, e.c.nq, p.pct, p.pts, p.sit, p.ass ? "Sim" : "Não", ...e.perg.map(q => rs[q.i] ? (rs[q.i].ok ? "Certo" : "Errado") : "-")]; });
  const topo = [["Treinamento", s.titulo], ["Versão", verTxt(s)], ["Data", dtc(s.fim)], ["Instrutor", s.instrutor || ""], ["Local", s.local || ""], ["Carga horária", horasTxt(s.horas)], ["Meta", s.meta + "%"], ["Tipo", TIPO_TXT[tipoSessao(s)]], ["Código de conferência", garantirCodigo(s)], []];
  return "﻿" + topo.concat([cab], linhas).map(l => l.map(celCsv).join(";")).join("\r\n") + "\r\n";
}
function abrirPdf(bytes) { const u = URL.createObjectURL(new Blob([bytes], {type: "application/pdf"})); const w = window.open(u, "_blank"); if (!w) aviso("O navegador bloqueou a janela. Use o botão de baixar."); setTimeout(() => URL.revokeObjectURL(u), 60000); }

/* ---------- PDFs ---------- */
function pdfBase(s, nomeDoc) {
  const cod = garantirCodigo(s), d = novoPdf(nomeDoc + " · " + s.titulo), {W, H, M} = d;
  d.rodape = (d, n, N) => {
    d.linha(M, H - 42, W - M, H - 42, {cor: "#c4cfce"});
    d.texto(M, H - 30, d.corta("Sabiá " + VERSAO + " · " + s.titulo, 135, 8), {tam: 8, cor: "#5a6b6a"});
    d.texto(W / 2 + 30, H - 30, "Código de conferência " + cod, {tam: 8, neg: true, cor: "#0E4A48", al: "cen"});
    d.texto(W - M, H - 30, `Página ${n} de ${N}`, {tam: 8, cor: "#5a6b6a", al: "dir"});
  };
  d.cab = d => { d.texto(M, d.y + 8, d.corta(nomeDoc + " · " + s.titulo + " (continuação)", W - 2 * M, 9), {tam: 9, cor: "#5a6b6a"}); d.y += 22; };
  return d;
}
function pdfTopo(d, s, titulo) {
  const {W, M} = d, y = M; let hl = 0;
  if (S.cfg.logo) { const r = d.imgCabe(S.cfg.logo, M, y, 130, 46); hl = r ? 46 : 0; }
  d.texto(W - M, y + 14, titulo, {tam: 16, neg: true, cor: "#0E4A48", al: "dir"});
  if (S.cfg.empresa) d.texto(W - M, y + 30, d.corta(S.cfg.empresa, 330, 10), {tam: 10, cor: "#4a5c5b", al: "dir"});
  d.y = y + Math.max(hl, 38) + 8; d.linha(M, d.y, W - M, d.y, {cor: "#0E4A48", esp: 1.2}); d.y += 12;
  const tp = tipoSessao(s);
  if (tp !== "real") {
    d.ret(M, d.y, W - 2 * M, 24, {fundo: "#F7EACD", borda: "#9A6200"});
    d.texto(M + 8, d.y + 15.5, tp === "teste" ? "SESSÃO DE TESTE: não vale como registro oficial." : "ENSAIO com participantes simulados: não vale como registro oficial.", {tam: 9.5, neg: true, cor: "#6b4400"});
    d.y += 34;
  }
}
function pdfSecao(d, t, mais) { d.garante(48 + (mais || 0)); d.texto(d.M, d.y + 10, t, {tam: 11, neg: true, cor: "#0E4A48"}); d.y += 16; d.linha(d.M, d.y, d.W - d.M, d.y, {cor: "#c4cfce"}); d.y += 6; }
function pdfCampos(d, pares) {
  const {W, M} = d, lg = (W - 2 * M) / 2 - 8;
  for (let i = 0; i < pares.length; i += 2) {
    const linha = pares.slice(i, i + 2).map(([r, v]) => ({r, ls: d.quebra(v || "–", lg, 10, false).slice(0, 3)}));
    const alt = 12 + Math.max(...linha.map(c => c.ls.length)) * 13 + 4;
    d.garante(alt);
    linha.forEach((c, k) => { const x = M + k * (lg + 16); d.texto(x, d.y + 8, c.r.toUpperCase(), {tam: 7.5, neg: true, cor: "#6b7c7b"}); c.ls.forEach((t, j) => d.texto(x, d.y + 20 + j * 13, t, {tam: 10})); });
    d.y += alt;
  }
  d.y += 2;
}
function pdfIndicadores(d, itens) {
  const {W, M} = d, g = 8, w = (W - 2 * M - g * (itens.length - 1)) / itens.length; d.garante(54);
  itens.forEach(([v, r], k) => { const x = M + k * (w + g); d.ret(x, d.y, w, 44, {fundo: "#F2F6F6", borda: "#d5dedd"}); d.texto(x + 8, d.y + 22, v, {tam: 16, neg: true, cor: "#0E4A48"}); d.texto(x + 8, d.y + 36, r, {tam: 8, cor: "#4a5c5b"}); });
  d.y += 54;
}
const corSit = t => t === "Atingiu a meta" ? "#1B7A4B" : t === "Abaixo da meta" ? "#9A6200" : "#6b7c7b";

function pdfRegistro(s) {
  const e = estat(s), d = pdfBase(s, "Registro de treinamento"), {W, M} = d;
  pdfTopo(d, s, "Registro de treinamento");
  pdfCampos(d, [["Treinamento", `${s.titulo} (${verTxt(s)})`], ["Data e hora do encerramento", dtc(s.fim)], ["Instrutor", s.instrutor], ["Local", s.local], ["Carga horária", horasTxt(s.horas)], ["Meta de acerto", s.meta + "%"], ["Setores", (s.setores || []).length ? s.setores.join(", ") : "Todos"], ["Perguntas que valem nota", String(e.c.nq)]]);
  pdfIndicadores(d, [[e.nota + "%", "Nota média"], [`${e.c.efic} de ${e.c.pessoas.length}`, "Atingiram a meta"], [e.c.pct + "%", "Acerto geral"], [tempoTxt(e.tempo), "Tempo médio por resposta"]]);
  pdfSecao(d, "Presença e resultado");
  const ord = e.pessoas.slice().sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
  d.tabela([{t: "#", w: 22}, {t: "Nome", w: 150}, {t: "Setor", w: 80}, {t: "Acertos", w: 46, al: "cen"}, {t: "%", w: 34, al: "dir"}, {t: "Pontos", w: 46, al: "dir"}, {t: "Situação", w: 82}, {t: "Assinatura", w: 96, al: "cen"}],
    ord.map((p, i) => [String(i + 1), p.nome, p.setor || "–", `${p.ac}/${e.c.nq}`, p.pct + "%", String(p.pts), {txt: p.sit, neg: true, cor: corSit(p.sit)}, {img: p.ass, h: 22, vazio: "sem assinatura"}]));
  if (e.perg.length) {
    pdfSecao(d, "Assertividade por pergunta");
    d.tabela([{t: "#", w: 22}, {t: "Pergunta", w: 230}, {t: "Respostas", w: 50, al: "cen"}, {t: "Acertos", w: 46, al: "cen"}, {t: "%", w: 36, al: "dir"}, {t: "Errada mais escolhida", w: 150}],
      e.perg.map(q => [String(q.n), q.it.enunciado, String(q.resp), String(q.ac), {txt: q.pct + "%", neg: true, cor: q.resp && q.pct < 60 ? "#B3302A" : "#1B7A4B"}, q.errada ? `${(q.it.alternativas || [])[q.errada.alt] ?? "alternativa " + (q.errada.alt + 1)} (${q.errada.n})` : "–"]));
  }
  if (e.setores.length > 1) {
    pdfSecao(d, "Resultado por setor", 20 + e.setores.length * 18);
    d.tabela([{t: "Setor", w: 200}, {t: "Pessoas", w: 60, al: "cen"}, {t: "Acerto médio", w: 80, al: "dir"}, {t: "Atingiram a meta", w: 110, al: "cen"}], e.setores.map(x => [x.nome, String(x.n), x.pct + "%", `${x.efic} de ${x.n}`]));
  }
  if (s.foto) {
    d.garante(220); pdfSecao(d, "Evidência: foto da turma");
    const r = d.imgCabe(s.foto, M, d.y, 300, 200); if (r) { d.y += 206; d.texto(M, d.y + 6, "Foto registrada em " + dtc(s.fotoEm || s.fim), {tam: 8, cor: "#5a6b6a"}); d.y += 16; }
  }
  d.garante(60); d.y += 6;
  d.par(M, d.y, "Para conferir este registro, digite o código do rodapé em Conferir, no menu do Sabiá. O código muda se qualquer nome, resultado, pergunta, data, instrutor ou assinatura for alterado. A foto da turma não entra no cálculo.", W - 2 * M, {tam: 8, cor: "#5a6b6a"});
  return d.saida();
}

function pdfPresenca(s) {
  const e = estat(s), d = pdfBase(s, "Lista de presença"), {W, M} = d;
  pdfTopo(d, s, "Lista de presença");
  pdfCampos(d, [["Treinamento", `${s.titulo} (${verTxt(s)})`], ["Data", dtd(s.fim)], ["Instrutor", s.instrutor], ["Local", s.local], ["Carga horária", horasTxt(s.horas)], ["Setores", (s.setores || []).length ? s.setores.join(", ") : "Todos"]]);
  pdfSecao(d, `Participantes (${e.pessoas.length})`);
  const ord = e.pessoas.slice().sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
  d.tabela([{t: "#", w: 24}, {t: "Nome", w: 190}, {t: "Setor", w: 100}, {t: "Carga horária", w: 62, al: "cen"}, {t: "Assinatura", w: 160, al: "cen"}],
    ord.map((p, i) => [String(i + 1), p.nome, p.setor || "–", horasTxt(s.horas), {img: p.ass, h: 30, vazio: "sem assinatura"}]));

  d.linha(M, d.y + 28, M + 230, d.y + 28, {cor: "#334", esp: .7});
  d.texto(M, d.y + 40, "Assinatura do instrutor" + (s.instrutor ? ": " + s.instrutor : ""), {tam: 9, cor: "#334"});
  d.texto(W - M, d.y + 40, "Data: " + dtd(s.fim), {tam: 9, cor: "#334", al: "dir"});
  return d.saida();
}

/* ---------- ações ---------- */
function reaplicar(s) {
  const t = treino(s.treinoId); if (!t) { aviso("O treinamento desta sessão foi removido"); return; }

  UI.apl = {id: t.id, preset: "aovivo", setores: (s.setores || []).slice(), instrutor: s.instrutor || S.cfg.instrutor, local: s.local || S.cfg.local, horas: s.horas || "1", aj: Object.assign({}, AJ_PADRAO, PRESETS.aovivo.aj), roster: e.abaixo.map(p => p.nome), reaplicaDe: s.id};

      <div class="cf-ou sm mut">ou confira um arquivo de sessão exportado: <label class="b sm" for="cf-arq">${ic("upload", 'style="width:16px;height:16px"')}Escolher .json</label><input type="file" id="cf-arq" accept=".json,application/json" class="sr"></div></section>

    <section class="k"><h3 class="rh">Como funciona</h3><ul class="chg sm" style="margin:0">
      <li>O código sai de um cálculo (SHA-256) sobre o título, a versão e as perguntas, a data, o instrutor, o local, a carga horária, a meta e, para cada pessoa, nome, setor, acertos, pontos e assinatura. Mudou qualquer um, o código muda.</li>

function conferirCodigo(txt) {
  CF.cod = txt;
  const c = normCodigo(txt);
  if (!c) { CF.res = {t: "no", titulo: "Código inválido", texto: "O código tem o formato SAB-XXXX-XXXX-XXXX-XXXX-XXXX, com letras de A a F e números."}; return; }
  const s = encerradas().find(x => garantirCodigo(x) === c);
  if (!s) { CF.res = {t: "no", titulo: "Nenhuma sessão deste aparelho tem esse código", texto: "Pode ser de outro aparelho (importe os dados em Ajustes) ou o PDF foi alterado. Se foi aplicada em outro aparelho, confira também pelo arquivo de sessão (.json)."}; return; }
  const e = estat(s);
  if (!integra(s)) { CF.res = {t: "no", titulo: "Atenção: a sessão foi alterada depois de encerrada", texto: `O código ${esc(c)} é de “${esc(s.titulo)}” (${dtc(s.fim)}), mas os dados guardados hoje geram outro código. Não use este registro sem explicar a diferença.`}; return; }
  CF.res = {t: "ok", titulo: "Registro confere", texto: `${esc(s.titulo)} (${verTxt(s)}), ${dtc(s.fim)}, instrutor ${esc(s.instrutor || "não informado")}. ${e.c.pessoas.length} pessoa${e.c.pessoas.length === 1 ? "" : "s"}, acerto geral de ${e.c.pct}%. Os dados guardados batem com o código do PDF. <a href="#/relatorios/${s.id}">Abrir o relatório</a>.${tipoSessao(s) !== "real" ? " <b>Esta sessão é " + (tipoSessao(s) === "teste" ? "de teste" : "um ensaio com simulados") + ", não é registro oficial.</b>" : ""}${s.codTardio ? " O código foi gerado depois do encerramento (sessão anterior à v0.5.0)." : ""}`};
}
function conferirArquivo(arq) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const o = JSON.parse(fr.result), s = o && o.sessao;
      if (!o || o.sabia !== "sessao" || !s || !Array.isArray(s.itens) || !Array.isArray(s.part) || !s.resp || typeof s.resp !== "object") throw new Error("formato");
      const dado = normCodigo(o.codigo), novo = codigoDe(s), local = encerradas().find(x => x.cod === novo);
      if (!dado) CF.res = {t: "no", titulo: "O arquivo não traz um código válido", texto: "Exporte a sessão de novo pelo relatório."};
      else if (dado !== novo) CF.res = {t: "no", titulo: "O arquivo foi alterado", texto: `O arquivo diz que o código é ${esc(dado)}, mas os dados dentro dele geram ${esc(novo)}.`};
      else CF.res = {t: "ok", titulo: "O arquivo confere", texto: `“${esc(s.titulo)}”, ${dtc(s.fim)}: os dados do arquivo geram o código ${esc(novo)}, igual ao registrado nele. ${local ? "Há uma sessão com o mesmo código neste aparelho." : "Esta sessão não está neste aparelho."}`};
      CF.cod = dado || "";
    } catch (err) { CF.res = {t: "no", titulo: "Não consegui ler esse arquivo", texto: "Escolha um arquivo de sessão (.json) exportado pelo relatório do Sabiá."}; }
    render();
  };
  fr.readAsText(arq);
}

/* ---------- eventos ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  const s = ["relpdf", "relpres", "relcsv", "reljson", "relabrir", "reaplicar", "rmfoto", "verass", "copiacod"].includes(a) ? sessaoRel(REL.sid) : null;
  if (a === "relaba") { REL.aba = v; render(); }
  else if (a === "relas") { REL.asOrd = v; render(); }
  else if (a === "relord") { REL.ord = REL.ord.c === v ? {c: v, d: -REL.ord.d} : {c: v, d: v === "nome" || v === "setor" || v === "sit" ? 1 : -1}; render(); }
  else if (!s && a !== "rmlogo" && a !== "rmroster") return;
  else if (a === "relpdf") baixarBlob(nomeArq("registro", s, "pdf"), new Blob([pdfRegistro(s)], {type: "application/pdf"}));
  else if (a === "relpres") baixarBlob(nomeArq("presenca", s, "pdf"), new Blob([pdfPresenca(s)], {type: "application/pdf"}));
  else if (a === "relcsv") baixarBlob(nomeArq("resultado", s, "csv"), new Blob([csvSessao(s)], {type: "text/csv;charset=utf-8"}));
  else if (a === "reljson") baixarBlob(nomeArq("sessao", s, "json"), new Blob([JSON.stringify({sabia: "sessao", versao: VERSAO, codigo: garantirCodigo(s), sessao: s}, null, 2)], {type: "application/json"}));
  else if (a === "relabrir") abrirPdf(pdfRegistro(s));
  else if (a === "reaplicar") reaplicar(s);
  else if (a === "rmfoto") { delete s.foto; delete s.fotoEm; salvar(); render(); aviso("Foto removida"); }
  else if (a === "verass") {
    const p = s.part.find(x => x.id === el.dataset.id); if (!p || !p.ass) return;
    const d = $("#dlg"); d.innerHTML = `<div class="dl"><header><h2>Assinatura de ${esc(p.nome)}</h2><button class="b ic g" data-act="fechar" aria-label="Fechar">${ic("x")}</button></header><div class="assg"><img src="${p.ass}" alt="Assinatura de ${esc(p.nome)}"></div><p class="sm mut" style="margin:0">${esc(s.titulo)}, ${dtc(s.fim)}</p></div>`; d.showModal();
  }
  else if (a === "copiacod") { try { navigator.clipboard.writeText(s.cod).then(() => aviso("Código copiado"), () => aviso("Não consegui copiar")); } catch (err) { aviso("Não consegui copiar"); } }
  else if (a === "rmlogo") { delete S.cfg.logo; salvar(); render(); aviso("Logotipo removido"); }
  else if (a === "rmroster") { if (UI.apl) { delete UI.apl.roster; delete UI.apl.reaplicaDe; render(); } }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "rl-s") { REL.sid = t.value; ir("#/relatorios/" + t.value); }
  else if (t.id === "rl-foto" && t.files[0]) { const s = sessaoRel(REL.sid); if (s) salvarFoto(s, t.files[0]); t.value = ""; }
  else if (t.id === "c-logo" && t.files[0]) { salvarLogo(t.files[0]); t.value = ""; }
  else if (t.id === "cf-arq" && t.files[0]) { conferirArquivo(t.files[0]); t.value = ""; }
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form='conferir']"); if (!f) return; e.preventDefault();
  conferirCodigo($("#cf-c").value); render();
});

function render() {
  if (!S) return;
  const r = rota(); menu(r.v);
  document.body.classList.toggle("modo-telao", r.v === "telao");
  document.body.classList.toggle("modo-cel", r.v === "entrar");
  if (r.v !== "entrar" && CE.chave) pararCel();
  if (r.v === "inicio") vInicio();
  else if (r.v === "treinos") vTreinos();
  else if (r.v === "aplicar") vAplicar(r.id);
  else if (r.v === "editar") vEditar(r.id);
  else if (r.v === "entrar") vCelular(r.id, r.x);
  else if (r.v === "sala") vSala(r.id);
  else if (r.v === "telao") vTelao(r.id);
  else if (r.v === "ajustes") vAjustes();
  else if (r.v === "relatorios") vRelatorios(r.id);
  else if (r.v === "conferir") vConferir();
  else if (FUTURO[r.v]) vFuturo(r.v);
  else { location.replace("#/inicio"); return; }
  document.title = "Sabiá" + (r.v === "inicio" ? "" : " · " + (($("#tb h1") || {}).textContent || ""));
}
let ultimaRota = "";
window.addEventListener("hashchange", () => { const r = rota(); if (r.v !== ultimaRota) { ultimaRota = r.v; const m = $("#app"); render(); m && m.scrollTo && m.scrollTo(0, 0); } else render(); });
(async function init() {
  await carregar(); aplicarTema();
  if (new URLSearchParams(location.search).get("demo") === "1" && !S.treinamentos.length) { MODELOS.forEach(m => criarDeModelo(m)); }
  ultimaRota = rota().v; render();
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
