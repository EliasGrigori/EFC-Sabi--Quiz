/* ---------- desafio entre setores (placar do mês, sem nomes) ---------- */
const MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
const MIN_SETOR = 3;
function mesDs() { if (!PES.ds) { const d = new Date(); PES.ds = {a: d.getFullYear(), m: d.getMonth(), ano: false}; } return PES.ds; }
const perDs = M => M.ano ? "ano de " + M.a : MESES[M.m] + " de " + M.a;
function dadosSetores(M) {
  const ini = new Date(M.a, M.ano ? 0 : M.m, 1).getTime(), fim = M.ano ? new Date(M.a + 1, 0, 1).getTime() : new Date(M.a, M.m + 1, 1).getTime(), g = new Map();
  (S.sessoes || []).filter(x => x.estado === "encerrada" && tipoSessao(x) === "real" && x.mom !== "pre" && x.resultado && Array.isArray(x.resultado.tabela) && Date.parse(x.fim) >= ini && Date.parse(x.fim) < fim).forEach(s => {
    s.resultado.tabela.forEach(r => {
      const pe = pessoaPorNome(r.nome), st = r.setor || (pe && pe.setor) || "Sem setor", o = g.get(st) || {setor: st, pess: new Set(), n: 0, ac: 0, sess: new Set()};
      o.pess.add(chaveNome(r.nome)); o.sess.add(s.id); o.n += s.resultado.nq || 0; o.ac += r.ac || 0; g.set(st, o);
    });
  });
  const todos = [...g.values()].map(o => ({...o, pct: o.n ? Math.round(100 * o.ac / o.n) : 0}));
  return {placar: todos.filter(o => o.pess.size >= MIN_SETOR && o.n).sort((a, b) => b.pct - a.pct || b.n - a.n || a.setor.localeCompare(b.setor, "pt-BR")), poucos: todos.filter(o => o.pess.size < MIN_SETOR)};
}
function placarHtml(D, grande) {

  return `<ol class="ds-l${grande ? " g" : ""}">${D.placar.map((g, i) => `<li><span class="ds-p num">${i + 1}º</span><b class="ds-s">${esc(g.setor)}</b><span class="ds-b" role="img" aria-label="${g.pct}% de acerto"><i style="width:${g.pct}%"></i></span><b class="num ds-c">${g.pct}%</b><span class="sm mut ds-n">${plural(g.pess.size, "pessoa", "pessoas")} · ${plural(g.n, "resposta", "respostas")}</span></li>`).join("")}</ol>`;
}

   A configuração do Firebase do EFClaudian NUNCA fica no código nem nas pastas do projeto: a pessoa cola uma vez neste aparelho
   e ela é guardada só no localStorage dele (chave sabia-efc-cfg), fora dos dados exportáveis. */
const PERFIS = {primario: "Primário", estrela: "Líder estrela", colaborador: "Colaborador"};

/* ---------- nuvem do EFClaudian (SDK carregado só quando há configuração) ---------- */
function intScript(src) { return new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = src; sc.onload = ok; sc.onerror = () => no(new Error("sem internet")); document.head.appendChild(sc); }); }
async function intSdk() {
  if (window.firebase && firebase.auth && firebase.firestore) return;
  for (const f of ["firebase-app-compat.js", "firebase-auth-compat.js", "firebase-firestore-compat.js", "firebase-app-check-compat.js"]) await intScript(FB_SDK + f);
}
function intIniciar() {
  if (INT.p) return INT.p;

  if (navigator.onLine === false && !(window.firebase && firebase.__falso)) { INT.estado = "offline"; return Promise.reject(new Error("sem internet")); }
  INT.estado = "carregando";
  INT.p = (async () => {
    await intSdk();
    const fbc = {apiKey: cfg.apiKey, authDomain: cfg.authDomain, projectId: cfg.projectId, appId: cfg.appId};
    if (!firebase.apps.length) firebase.initializeApp(fbc);

    await new Promise(ok => { const u = INT.auth.onAuthStateChanged(() => { u(); ok(); }); });
    INT.estado = "pronto";
    INT.auth.onAuthStateChanged(u => intAuthMudou(u));
    await intAuthMudou(INT.auth.currentUser);
  })().catch(e => { INT.estado = navigator.onLine === false ? "offline" : "erro"; INT.erro = e && (e.code || e.message) || "erro"; INT.p = null; throw e; });
  return INT.p;
}
async function intAuthMudou(u) {
  INT.user = u || null;
  if (!u || u.isAnonymous || intSaiu()) { if (INT.conta && (!u || u.isAnonymous)) { INT.conta = null; lsS(LS_ICONTA, null); } intRender(); return; }
  try {
    const d = await INT.db.collection("sv2_users").doc(u.uid).get(), x = d.exists ? d.data() : null;
    if (x && x.bloqueado !== true) {
      const raw = String(x.perfil || "");
      INT.conta = {uid: u.uid, nome: x.nome || x.login || "Responsável", perfil: /^principal/.test(raw) ? "primario" : x.estrela === true ? "estrela" : "colaborador"};

async function intEntrar(login, senha) {
  await intIniciar();

    try { const d = await INT.db.collection("sv2_login").doc(intSlug(ent)).get(); if (d.exists) { const x = d.data(); [x.email, x.emailNovo, x.interno].forEach(e => { if (e && !cands.includes(e)) cands.push(e); }); } } catch (e) {}
    if (!cands.length) cands = [intSlug(ent) + "@efclaudian.app"];
  }

  for (const e of cands) { try { await INT.auth.signInWithEmailAndPassword(e, senha); ult = null; break; } catch (er) { ult = er; } }
  if (ult) throw ult;

function intErroTexto(e) {
  const c = e && (e.code || e.message) || "";
  if (/invalid-credential|wrong-password|user-not-found|invalid-login|invalid-email/.test(c)) return "Login ou senha não conferem.";
  if (/sem-perfil/.test(c)) return "Esta conta não tem cadastro ativo no EFClaudian.";
  if (/network|sem internet|unavailable/.test(c)) return "Sem internet. Tente de novo quando a conexão voltar.";
  if (/too-many/.test(c)) return "Muitas tentativas. Espere alguns minutos.";
  if (/permission/.test(c)) return "A nuvem recusou o acesso. Confira as regras do Firebase do EFClaudian.";
  if (/sem configura/.test(c)) return "Cole antes a configuração do Firebase do EFClaudian.";

function ajEspia() {

const dhms = ms => { try { return new Date(ms).toLocaleString("pt-BR", {day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit"}); } catch (e) { return ""; } };

const MSG_REGRAS = "O Firebase não aceitou o carimbo. Publique as regras novas (Ajustes > Celulares na sala > Copiar as regras) e tente de novo.";

async function lerSelo(cod) {
  const v = await Rede.req(Rede.url(), "GET", "/selos/" + cod);

}
async function carimbar(s) {
  if (!Rede.ok()) return {ok: false, msg: "Configure o Firebase em Ajustes para carimbar o horário."};
  const cod = garantirCodigo(s);
  if (!integra(s)) return {ok: false, msg: "Este registro não confere mais com o código. Não é seguro carimbar."};
  const a = Date.now(); let jaTinha = false;
  try { await Rede.req(Rede.url(), "PUT", "/selos/" + cod, {t: {".sv": "timestamp"}}); }
  catch (e) {
    if (e.status === 401 || e.status === 403) jaTinha = true;   // regra: só grava uma vez (ou as regras novas ainda não foram publicadas)
    else return {ok: false, msg: "Sem conexão com o Firebase. Confira a internet e tente de novo."};
  }
  const b = Date.now(); let t = null;
  try { t = await lerSelo(cod); } catch (e) { return {ok: false, msg: e.status === 401 || e.status === 403 ? MSG_REGRAS : "Sem conexão com o Firebase. Confira a internet e tente de novo."}; }

  s.selo = {t, dif: jaTinha ? null : t - Math.round((a + b) / 2), em: new Date().toISOString(), antigo: jaTinha};

function lerRespostaIA(txt) {

O QUE FAZER
1. Leia todo o conteúdo e separe os assuntos principais.
2. Para cada assunto, escreva 1 explicação curta (os pontos principais, um por linha) e, logo depois dela, as perguntas desse assunto.
3. Crie de 8 a 12 perguntas que valem nota (10, se o conteúdo der). Misture os 3 formatos, mais ou menos nesta proporção: 4 de múltipla escolha, 3 de verdadeiro ou falso e 3 de sequência (colocar os passos na ordem certa). Evite dois formatos iguais seguidos.
4. Use SOMENTE o conteúdo enviado. Não invente regra, número, prazo, produto ou nome que não esteja nele. Se o conteúdo não der para um formato, use outro.

COMO ESCREVER
- Frases curtas e palavras simples, para quem lê pouco. Enunciado com até 400 letras e alternativa com até 200. Sem emojis.
- Múltipla escolha: 4 alternativas (ou 3), só uma certa. As erradas têm que parecer possíveis. Varie a posição da certa.
- Verdadeiro ou falso: uma afirmação clara, sem pegadinha. Equilibre verdadeiras e falsas.
- Sequência: de 3 a 5 passos, já na ordem certa (o app embaralha para a turma).
- Em todas as perguntas, "porque": 1 ou 2 frases explicando a resposta certa.
- Tempo: 20 segundos na múltipla escolha, 15 no verdadeiro ou falso e 45 na sequência.

COMO ENTREGAR
Entregue um arquivo chamado treinamento-sabia.json para eu baixar. Se você não puder criar arquivo, responda SOMENTE com o JSON, sem nenhum texto antes ou depois e sem marcas de código.

{"origem":"sabia-ia","titulo":"...","meta":80,"descricao":"uma frase sobre o treinamento","itens":[

 {"tipo":"ordenar","enunciado":"Coloque na ordem: ...","alternativas":["passo 1","passo 2","passo 3"],"tempo":45,"uso":"avaliacao","porque":"..."}
]}
"correta" é o número da alternativa certa, começando em 0 (0 é a primeira). No verdadeiro ou falso, 0 = Verdadeiro e 1 = Falso. A sequência não tem "correta".

CONTEÚDO DO TREINAMENTO
(cole aqui o texto, ou anexe o arquivo PPTX, PDF ou Word)

/* durações lidas uma vez dos tokens (ler a cada troca obrigaria o navegador a recalcular o estilo antes da hora) */
let DUR = null;
const dur = k => (DUR || (DUR = {fast: Mov.ms("--duration-fast", 250), quick: Mov.ms("--duration-quick", 150), medium: Mov.ms("--duration-medium", 350)}))[k];

function menu(v) {
  const at = DONO[v] || v;
  const atm = ["mais", "pessoas", "relatorios", "conferir", "ajustes"].includes(v) ? "mais" : at;   /* no celular, essas telas ficam sob "Mais" */

  const grupos = NAVG.map(([g, its]) => { const ok = its.filter(x => navOk(x[0])); return ok.length ? `${g ? `<div class="gh">${g}</div>` : ""}${ok.map(item).join("")}` : ""; }).join("");
  $("#rail").innerHTML = `<div class="rl-topo"><a class="rl-marca" href="#/inicio" aria-label="Sabiá, ir para o Início"><span class="lg" aria-hidden="true"><svg viewBox="0 0 48 48"><use href="#logo"/></svg></span><span class="rl-nm"><b>Sabiá</b><span>treinamentos</span></span></a>
    <button class="b ic g rl-alt" type="button" data-act="menurecolhe" aria-label="${document.documentElement.classList.contains("m-ic") ? "Abrir o menu" : "Recolher o menu"}" title="${document.documentElement.classList.contains("m-ic") ? "Abrir o menu" : "Recolher o menu"}">${ic("chevl")}</button>

    <div class="rl-pe">${NAVPE.filter(x => navOk(x[0])).map(item).join("")}<div class="rl-v">Sabiá v${VERSAO}</div></div>`;
  const bi = ([id, nome, i]) => `<a href="#/${id}" ${atm === id ? 'aria-current="page"' : ""} ${id === "mais" ? 'data-act="menuabre" aria-haspopup="true" aria-expanded="false" aria-controls="rail"' : ""}><span class="pill">${ic(i)}${nb(id)}</span>${nome}</a>`;

/* caminho no topo: Grupo / Tela / item aberto. Cada degrau que é tela abre ao tocar. */
function caminho(v, titulo) {
  if (v === "inicio") return [["Início"]];
  if (v === "mais") return [["Menu"]];
  const dono = DONO[v] || v, it = ITEM(dono), g = GRUPO(dono), nome = it ? it[1] : titulo;
  const passos = []; if (g) passos.push([g]);
  const fundo = DONO[v] || rota().id || (titulo && titulo !== nome && v !== "ajustes");
  passos.push(fundo ? [nome, "#/" + dono] : [nome]);
  if (fundo) passos.push([v === "editar" ? "Editor" : v === "aplicar" ? "Aplicar" : v === "sala" ? "Sala ao vivo" : v === "relatorios" && titulo === nome ? (rota().id === "desafio" ? "Desafio entre setores" : "Sessão") : titulo]);
  return passos;
}
function topo(titulo, sub, extra = "", voltar = "", pilulas = null) {
  const r = rota(), passos = caminho(r.v, titulo);
  const fa = document.activeElement, foco = fa && $("#topo").contains(fa) ? (fa.id ? "#" + fa.id : fa.dataset.act ? `[data-act="${fa.dataset.act}"]` : fa.getAttribute("href") ? `a[href="${fa.getAttribute("href")}"]` : "") : "";
  $("#topo").innerHTML = `<button class="b ic g tp-menu" type="button" data-act="menuabre" aria-label="Abrir o menu" aria-haspopup="true" aria-expanded="false" aria-controls="rail">${ic("menu")}</button>
    <nav class="tp-cam" aria-label="Você está em"><ol>${passos.map(([n, h], i) => `<li>${h ? `<a href="${h}">${esc(n)}</a>` : `<span ${i === passos.length - 1 ? 'aria-current="page"' : ""}>${esc(n)}</span>`}</li>`).join("")}</ol></nav>
    <span class="tp-sp"></span>
    <button class="b ic g t-icon-swap tp-tema" type="button" id="btTema" data-act="temaalterna" data-state="${temaEfetivo() === "escuro" ? "b" : "a"}"><span class="t-icon" data-icon="a">${ic("lua")}</span><span class="t-icon" data-icon="b">${ic("sol")}</span></button>`;
  pintaTema();
  if (foco) { const el = $("#topo").querySelector(foco); if (el) el.focus({preventScroll: true}); }
  const pls = pilulas ? `<div class="pls">${pilulas.map(([v, l]) => `<span class="tb-pl"><b class="num">${esc(String(v))}</b> ${esc(l)}</span>`).join("")}</div>` : "";
  $("#tb").innerHTML = `${voltar ? `<a class="b ic g tb-volta" href="${voltar}" aria-label="Voltar">${ic("back")}</a>` : ""}<div class="tb-t"><h1><span class="tb-h1">${esc(titulo)}</span></h1>${sub ? `<div class="sub">${esc(sub)}</div>` : ""}${pls}</div><div class="grow"></div>${extra ? `<div class="tb-acts">${extra}</div>` : ""}`;
}

/* ---------- menu: recolher (PC) e abrir como gaveta (celular) ---------- */
const celular = () => matchMedia("(max-width:760px)").matches;
function menuRecolhe() {
  const html = document.documentElement, mn = $("#mn"), x0 = mn.getBoundingClientRect().left;
  const filhos = [...mn.children];
  html.classList.toggle("m-ic");
  try { localStorage.setItem("sabia-menu", html.classList.contains("m-ic") ? "ic" : ""); } catch(e) {}
  menu(rota().v);
  const dx = x0 - mn.getBoundingClientRect().left;   /* o conteúdo desliza até o lugar novo (só transform) */
  if (dx && !Mov.reduzido()) filhos.forEach(f => f.animate([{transform: `translateX(${dx}px)`}, {transform: "none"}], {duration: dur("medium"), easing: "cubic-bezier(.22,1,.36,1)"}));
  $("#rail").querySelectorAll(".ri-nm,.rl-nm,.gh,.rl-v").forEach(e => !Mov.reduzido() && e.animate([{opacity: 0}, {opacity: 1}], {duration: dur("quick"), easing: "ease-out"}));
}
let menuHist = false, menuVolta = null;
const menuAberto = () => document.documentElement.classList.contains("menu-aberto");
function menuMarca(aberto) {
  document.documentElement.classList.toggle("menu-aberto", aberto); $("#ladoFundo").setAttribute("aria-hidden", aberto ? "false" : "true");
  ["#mn", "#bnav"].forEach(q => { const el = $(q); if (el) el.inert = aberto; });   /* o que está atrás não recebe toque nem Tab */
  const rl = $("#rail"); if (aberto) { rl.setAttribute("role", "dialog"); rl.setAttribute("aria-modal", "true"); } else { rl.removeAttribute("role"); rl.removeAttribute("aria-modal"); }
  document.querySelectorAll('[data-act="menuabre"]').forEach(b => b.setAttribute("aria-expanded", String(aberto)));
}
function menuAbre() {
  if (!celular() || menuAberto()) return;
  menuVolta = document.activeElement;
  menuMarca(true);
  try { history.pushState({sabiaMenu: 1}, "", location.href); menuHist = true; } catch(e) {}   /* o voltar do celular fecha o menu primeiro */
  setTimeout(() => { const a = $("#rail .ri[aria-current]") || $("#rail .ri"); a && a.focus({preventScroll: true}); }, 30);
}
function menuFecha(doVoltar) {
  if (!menuAberto()) return false;
  menuMarca(false);
  if (menuHist && !doVoltar) { menuHist = false; history.back(); } else menuHist = false;
  const v = menuVolta; menuVolta = null; if (v && v.isConnected) v.focus({preventScroll: true});   /* o foco volta para quem abriu */
  return true;
}
window.addEventListener("popstate", () => { if (menuAberto()) menuFecha(true); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !document.querySelector("dialog[open]") && menuFecha()) e.stopPropagation(); }, true);
/* com o menu aberto no celular, o Tab gira só dentro dele */
document.addEventListener("keydown", e => {
  if (e.key !== "Tab" || !menuAberto()) return;
  const fs = [...$("#rail").querySelectorAll("a[href],button:not([disabled])")].filter(x => x.offsetParent); if (!fs.length) return;
  const i = fs.indexOf(document.activeElement);
  if (e.shiftKey && i <= 0) { e.preventDefault(); fs[fs.length - 1].focus(); } else if (!e.shiftKey && (i === -1 || i === fs.length - 1)) { e.preventDefault(); fs[0].focus(); }
});

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return; const a = el.dataset.act;
  if (a === "menurecolhe") { e.preventDefault(); menuRecolhe(); }
  else if (a === "menuabre") { if (celular()) { e.preventDefault(); menuAbre(); } }
  else if (a === "menufecha") { e.preventDefault(); menuFecha(); }
  else if (a === "temaalterna") { S.cfg.tema = temaEfetivo() === "escuro" ? "claro" : "escuro"; salvar(); aplicarTema(); const sel = $("#app [data-act='tema'][data-v='" + S.cfg.tema + "']"); if (sel) render(); }
});
/* tocar num item do menu aberto no celular: a tela nova toma o lugar do registro do menu no histórico
   (assim o voltar do aparelho volta para a tela de antes, sem passo morto e sem depender da ordem de eventos do navegador) */
document.addEventListener("click", e => {
  const a = e.target.closest("#rail a[href]"); if (!a || !menuAberto()) return;
  const h = a.getAttribute("href"), tinha = menuHist && history.state && history.state.sabiaMenu;
  menuHist = false; menuVolta = null; menuMarca(false);
  if (tinha) { e.preventDefault(); history.replaceState(null, "", h); window.dispatchEvent(new HashChangeEvent("hashchange")); }
}, true);

/* ---------- abas: o traço desliza da aba anterior até a nova ---------- */
function abasTraco() {
  document.querySelectorAll(".seg.abas").forEach(g => {
    const on = g.querySelector('button[aria-pressed="true"]'); let ln = g.querySelector(".abas-linha");
    if (!ln) { ln = document.createElement("i"); ln.className = "abas-linha"; ln.setAttribute("aria-hidden", "true"); g.appendChild(ln); }
    if (!on) { ln.style.opacity = "0"; return; }
    const gr = g.getBoundingClientRect(), r = on.getBoundingClientRect(), x = r.left - gr.left + g.scrollLeft, w = r.width;
    const k = g.getAttribute("aria-label") || "", ant = casca.abas[k];
    casca.abas[k] = {x, w};
    const pos = (p) => `translateX(${p.x}px) scaleX(${p.w / 100})`;
    ln.style.opacity = "1";
    if (ant && (ant.x !== x || ant.w !== w) && !Mov.reduzido()) {
      ln.style.transition = "none"; ln.style.transform = pos(ant); ln.getBoundingClientRect();
      ln.style.transition = ""; ln.style.transform = pos({x, w});
    } else { ln.style.transition = "none"; ln.style.transform = pos({x, w}); ln.getBoundingClientRect(); ln.style.transition = ""; }
  });
}

/* ---------- troca de tela e de aba sem corte seco ----------
   Só anima quando muda a tela ou a aba de dentro; redesenhar porque um dado mudou não anima. */
const ORDEM = ["inicio", "treinos", "editar", "aplicar", "sala", "pendencias", "pessoas", "mensagens", "relatorios", "conferir", "ajustes", "mais"];
function chaveTela() { const r = rota(); return [r.v, r.id || "", ...[...document.querySelectorAll(".seg.abas")].map(g => (g.querySelector('button[aria-pressed="true"]') || {}).dataset?.v || "")].join("|"); }
function cascaDepois() {
  requestAnimationFrame(abasTraco);   /* mede no próximo quadro: o render não força o navegador a montar a tela duas vezes */
  const k = chaveTela(), ant = casca.chave; casca.chave = k;
  if (!casca.pronta || !ant || ant === k || Mov.reduzido()) return;
  const [v0] = ant.split("|"), [v1] = k.split("|");
  let dir = 0;
  if (v0 !== v1) dir = ORDEM.indexOf(v1) >= ORDEM.indexOf(v0) ? 1 : -1;
  else { const a0 = ant.split("|").slice(2), a1 = k.split("|").slice(2); const g = [...document.querySelectorAll(".seg.abas")]; for (let i = 0; i < a1.length; i++) if (a0[i] !== a1[i]) { const bs = [...(g[i] || document).querySelectorAll("button")].map(b => b.dataset.v); dir = bs.indexOf(a1[i]) >= bs.indexOf(a0[i]) ? 1 : -1; break; } }
  const alvo = $("#app"); if (!alvo) return;
  alvo.animate([{opacity: 0, transform: `translateX(${12 * dir}px)`}, {opacity: 1, transform: "none"}], {duration: dur("fast"), easing: "cubic-bezier(.22,1,.36,1)"});
  /* o título entra letra por letra (fluidez.js, fzTitulo) */
}
let rzW = innerWidth, rzF = 0;
window.addEventListener("resize", () => { if (innerWidth === rzW || rzF) return; rzF = requestAnimationFrame(() => { rzF = 0; rzW = innerWidth; casca.abas = {}; abasTraco(); if (!celular()) menuFecha(); }); });

/* ===== v1.6.0 parte 2 · Fatia C: peças no padrão da família EFC =====
   Lista retrátil (escolha), aviso que entra e sai, Início "o que pede atenção". Janelas e gaveta são só CSS (pecas.css). */

/* ---------- lista retrátil: troca as fileiras de botões de escolha (Ajustes: tema, telão, som; Aplicar: formato) ----------
   As opções levam o mesmo data-act e data-v de antes: quem tratava o clique continua tratando. */
function escolha(o) {
  const at = o.ops.find(x => x.v === o.valor) || o.ops[0];
  const tx = (x, grande) => `${x.icone ? `<span class="esc-ic">${ic(x.icone)}</span>` : ""}<span class="esc-tx"><b>${esc(x.nome)}</b>${grande && x.desc ? `<small>${esc(x.desc)}</small>` : ""}</span>`;
  return `<div class="esc${o.grande ? " esc-g" : ""}">
    <button type="button" class="b esc-bt" id="${o.id}" data-act="escabre" aria-haspopup="listbox" aria-expanded="false" aria-controls="${o.id}-l" aria-label="${esc(o.rotulo)}: ${esc(at.nome)}">${tx(at, o.grande)}<svg class="i esc-sv" aria-hidden="true"><use href="#i-chevd"/></svg></button>
    <div class="esc-l t-dropdown" id="${o.id}-l" role="listbox" aria-label="${esc(o.rotulo)}">${o.ops.map(x => `<button type="button" role="option" class="esc-op" data-act="${o.act}" data-v="${x.v}" ${o.attrs || ""} aria-selected="${x.v === o.valor}"${x.dis ? " disabled aria-disabled=\"true\"" : ""}>${tx(x, true)}<svg class="i esc-ok" aria-hidden="true"><use href="#i-check"/></svg></button>`).join("")}</div></div>`;
}
let escAberta = null;
function escFecha(imediato, voltaFoco) {
  const l = escAberta; if (!l) return false; escAberta = null;
  const bt = document.querySelector(`[aria-controls="${l.id}"]`); if (bt) bt.setAttribute("aria-expanded", "false");
  l.classList.remove("is-open");
  if (!imediato && !Mov.reduzido()) { l.classList.add("is-closing"); setTimeout(() => l.classList.remove("is-closing"), 150); }
  if (voltaFoco && bt) bt.focus({preventScroll: true});
  return true;
}
function escAbre(bt) {
  const l = document.getElementById(bt.getAttribute("aria-controls")); if (!l) return;
  if (escAberta === l) { escFecha(false, true); return; }
  escFecha(true);
  /* abre para cima quando não cabe embaixo */
  const r = bt.getBoundingClientRect(), alto = Math.min(l.scrollHeight || 240, 360), raiz = bt.closest(".body") || document.documentElement;
  const fundo = raiz.getBoundingClientRect().bottom;
  l.dataset.origin = r.bottom + alto + 8 > fundo && r.top - alto - 8 > raiz.getBoundingClientRect().top ? "bottom-left" : "top-left";
  l.classList.remove("is-closing"); l.classList.add("is-open"); bt.setAttribute("aria-expanded", "true"); escAberta = l;
  const sel = l.querySelector('[aria-selected="true"]') || l.querySelector(".esc-op"); sel && sel.focus({preventScroll: true});
}
document.addEventListener("click", e => {
  const ab = e.target.closest('[data-act="escabre"]');
  if (ab) { e.preventDefault(); escAbre(ab); return; }
  if (escAberta && !e.target.closest(".esc-l")) escFecha();
  else if (escAberta && e.target.closest(".esc-op")) {
    const id = escAberta.id.replace(/-l$/, "");
    setTimeout(() => { escFecha(); const b = document.getElementById(id); if (b && (document.activeElement === document.body || !document.activeElement)) b.focus({preventScroll: true}); }, 0);   /* depois de quem trata a escolha; a tela pode ter sido refeita */
  }
});
document.addEventListener("keydown", e => {
  if (escAberta && !escAberta.isConnected) escAberta = null;   /* a tela foi refeita sem clique (voltar, atalho) */
  if (!escAberta) return;
  if (e.key === "Escape") { e.stopPropagation(); e.preventDefault(); escFecha(false, true); return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp" || e.key === "Home" || e.key === "End") {
    const ops = [...escAberta.querySelectorAll(".esc-op")], i = ops.indexOf(document.activeElement);
    const n = e.key === "Home" ? 0 : e.key === "End" ? ops.length - 1 : e.key === "ArrowDown" ? Math.min(ops.length - 1, i + 1) : Math.max(0, i - 1);
    e.preventDefault(); ops[n] && ops[n].focus();
  } else if (e.key === "Tab") escFecha(true);
}, true);

/* ---------- aviso (a faixa de baixo): entra subindo e saindo do desfoque, sai do mesmo jeito (substitui o aviso() antigo) ---------- */
/* v1.6.0 parte 3: quem chama diz o tipo ("ok" = deu certo, "erro" = deu errado, nada = só informa); nada é adivinhado pelas palavras.
   O papel para o leitor de tela muda antes do texto entrar, para ele anunciar do jeito certo. */
const AV_ICO = {
  ok: '<span class="av-vs t-success-check" data-state="out" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>',
  erro: '<span class="av-er" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.6v.1"/></svg></span>'
};
function aviso(msg, acao, fn, tipo) {
  const el = $("#toast"); clearTimeout(tToast); clearTimeout(el._sai);
  tipo = tipo === "ok" || tipo === "erro" ? tipo : "";
  el.setAttribute("role", tipo === "erro" ? "alert" : "status"); el.setAttribute("aria-live", tipo === "erro" ? "assertive" : "polite");
  el.dataset.tipo = tipo;
  el.innerHTML = `${AV_ICO[tipo] || ""}<span>${esc(msg)}</span>${acao ? `<button type="button" id="tAcao">${esc(acao)}</button>` : ""}`;
  const novo = el.hidden; el.hidden = false; el.classList.add("t-toast");
  if (novo) { el.classList.remove("is-open"); el.getBoundingClientRect(); }
  el.classList.add("is-open");
  const some = () => { el.classList.remove("is-open"); el._sai = setTimeout(() => { el.hidden = true; }, Mov.reduzido() ? 0 : 250); };
  if (acao) $("#tAcao").onclick = () => { clearTimeout(tToast); some(); fn && fn(); };
  tToast = setTimeout(some, acao ? 3000 : 3500);
  if (typeof avisoMov === "function") avisoMov(el, tipo, novo);
}

/* ---------- Início: o que pede atenção e as últimas sessões (no lugar da lista repetida de Treinos) ---------- */
function inicioAtencao() {
  const vePend = navOk("pendencias"), P0 = vePend ? (pendencias() || {}) : {}, P = {ref: P0.ref || [], reav: P0.reav || [], val: P0.val || []}, mg = navOk("mensagens") ? novasMsgs() : 0;   /* tela sem permissão some (Colaborador) */
  const linhas = [];
  /* salas abertas ficam em "Sessões em aberto", logo ao lado: aqui não repetem */
  if (P.ref.length) linhas.push(`<button class="at-l" data-act="pndir" data-v="ref"><span class="dot cr" aria-hidden="true"></span><span class="at-t"><b>${plural(P.ref.length, "pessoa precisa", "pessoas precisam")} de reforço</b><span>Ficaram abaixo da meta</span></span><svg class="i at-sv" aria-hidden="true"><use href="#i-chevr"/></svg></button>`);
  if (P.reav.length) linhas.push(`<button class="at-l" data-act="pndir" data-v="reav"><span class="dot wa" aria-hidden="true"></span><span class="at-t"><b>${plural(P.reav.length, "reavaliação", "reavaliações")} para fazer</b><span>Medir de novo depois de 30, 60 ou 90 dias</span></span><svg class="i at-sv" aria-hidden="true"><use href="#i-chevr"/></svg></button>`);
  if (P.val.length) linhas.push(`<button class="at-l" data-act="pndir" data-v="val"><span class="dot wa" aria-hidden="true"></span><span class="at-t"><b>${plural(P.val.length, "treinamento vencendo", "treinamentos vencendo")}</b><span>Validade perto do fim ou vencida</span></span><svg class="i at-sv" aria-hidden="true"><use href="#i-chevr"/></svg></button>`);
  if (mg) linhas.push(`<a class="at-l" href="#/mensagens"><span class="dot ok" aria-hidden="true"></span><span class="at-t"><b>${plural(mg, "mensagem nova", "mensagens novas")} da turma</b><span>Elogios, sugestões, reclamações e perguntas</span></span><svg class="i at-sv" aria-hidden="true"><use href="#i-chevr"/></svg></a>`);
  const enc = S.sessoes.filter(x => x.estado === "encerrada" && x.resultado && tipoSessao(x) === "real").slice().sort((a, b) => String(b.fim).localeCompare(String(a.fim))).slice(0, 3);
  const data = f => { try { return new Date(f).toLocaleDateString("pt-BR", {day: "2-digit", month: "2-digit"}); } catch(e) { return ""; } };
  const ult = enc.map(x => { const ok = x.resultado.pct >= x.meta, pre = x.mom === "pre"; return `<a class="at-l" href="#/relatorios/${x.id}"><span class="at-t"><b>${esc(x.titulo)}</b><span>${data(x.fim)} · ${plural(x.resultado.tabela ? x.resultado.tabela.length : 0, "pessoa", "pessoas")}</span></span><span class="sit ${pre ? "" : ok ? "ok" : "cr"}">${pre ? "pré-teste · " : ""}${x.resultado.pct}%${ok || pre ? "" : " · abaixo da meta"}</span></a>`; }).join("");
  return `<section class="k mini at" aria-labelledby="h-at"><div class="kh"><h3 id="h-at">Pede atenção</h3>${linhas.length ? `<span class="chip">${linhas.length}</span>` : ""}</div>
      ${linhas.length ? `<div class="at-ls">${linhas.join("")}</div>` : `<p class="at-vz"><span class="dot ok" aria-hidden="true"></span>Tudo em dia. Nenhuma pendência nem mensagem nova.</p>`}</section>
    <section class="k mini at" aria-labelledby="h-ult"><div class="kh"><h3 id="h-ult">Últimas sessões</h3><a class="b sm g at-mais" href="#/relatorios">Ver todas</a></div>
      ${enc.length ? `<div class="at-ls">${ult}</div>` : `<p class="at-vz">Nenhuma sessão encerrada ainda. Os resultados aparecem aqui e em Relatórios.</p>`}</section>`;
}

/* 13 · a janela (#dlg) leva o nome do seu título para o leitor de tela */
new MutationObserver(() => { const d = $("#dlg"), h = d && d.querySelector("h2"); if (!d) return; if (h) { if (!h.id) h.id = "dlg-tt"; d.setAttribute("aria-labelledby", h.id); } else d.removeAttribute("aria-labelledby"); }).observe(document.getElementById("dlg"), {childList: true});

/* ===== v1.6.0 parte 3 · Fatia D: fluidez completa (adaptada do fluidez.js do EFCwork v0.6.14/15) =====
   Título que entra letra por letra, lista que se rearruma (FLIP), aviso com o visto e a tremida no erro,
   faíscas no botão dourado quando deu certo, itens do Painel em sequência, desfoque no fim do que rola.
   Tudo para com "movimento reduzido". Durações só da escala (efc-movimento.css). */
const FZ = {tit: null, chave: "", foto: null, bt: null, tr: 0};
const fzMov = () => !Mov.reduzido();
/* as durações são lidas uma vez só: ler o estilo da página no meio do desenho obriga o navegador a recalcular tudo (custava 4 ms por troca de tela) */
const FZ_MS = {}; const fzMs = (n, d) => FZ_MS[n] != null ? FZ_MS[n] : (FZ_MS[n] = Mov.ms(n, d));

/* ---------- título: entra letra por letra, saindo do desfoque, só quando a tela muda ----------
   Revisor (16/11): redesenho por mudança de dado não anima; o leitor de tela ouve o título inteiro (aria-label),
   não as letras soltas; a partir da 25ª letra todas entram juntas com a última, então nada aparece seco no fim;
   no escuro cada letra leva o seu pedaço do degradê, então o fim não troca de cor. */
const FZ_MAX = 24;
function fzTitulo(trocouTela) {
  const s = $("#tb .tb-h1"); if (!s) { FZ.tit = null; return; }
  const t = s.textContent, ant = FZ.tit; FZ.tit = t;
  if (ant == null || ant === t || !trocouTela || !casca.pronta || !fzMov() || s.children.length) return;
  const h = s.closest("h1"), passo = fzMs("--duration-stagger", 40);
  h.classList.add("fz-tt"); h.setAttribute("aria-label", t);
  s.innerHTML = `<span class="fz-ls" aria-hidden="true">${[...t].map((c, i) => c === " " ? " " : `<span class="fz-l" style="--i:${Math.min(i, FZ_MAX)}">${esc(c)}</span>`).join("")}</span>`;
  /* o pedaço do degradê de cada letra só importa no escuro; as medidas são lidas todas antes de escrever (uma conta de layout só) */
  if (document.documentElement.getAttribute("data-tema") === "escuro") {
    const ls = [...s.querySelectorAll(".fz-l")], w = h.clientWidth, xs = ls.map(l => l.offsetLeft);
    h.style.setProperty("--fz-w", w + "px"); ls.forEach((l, i) => l.style.setProperty("--fz-x", xs[i] + "px"));
  }
  const fim = Math.min(t.length - 1, FZ_MAX) * passo + fzMs("--duration-very-slow", 500) + 80;
  setTimeout(() => { if (s.isConnected && s.textContent === t) { s.textContent = t; h.classList.remove("fz-tt"); h.removeAttribute("aria-label"); h.style.removeProperty("--fz-w"); } }, fim);
}

/* ---------- lista que muda com a busca, o filtro, a ordem ou a vista: as linhas deslizam até o lugar novo (nas duas direções);
   as que saem da lista somem suavemente no lugar onde estavam ---------- */
function fzAntes() {
  const k = rota().v + "|" + (rota().id || ""), app = $("#app");
  FZ.foto = null;
  if (!app || k !== FZ.chave || !fzMov()) return;
  const els = app.querySelectorAll("[data-fz]"); if (!els.length || els.length > 150) return;
  const m = {};
  els.forEach(e => { const r = e.getBoundingClientRect(); m[e.dataset.fz] = {x: r.left, y: r.top, w: r.width, h: r.height, el: e}; });
  FZ.foto = m;
}
function fzDepois() {
  const k = rota().v + "|" + (rota().id || ""), mesma = k === FZ.chave; FZ.chave = k;
  fzTitulo(!mesma);
  const foto = FZ.foto; FZ.foto = null;
  if (!mesma || !foto) return;
  const app = $("#app"), d = fzMs("--duration-fast", 250), ease = "cubic-bezier(.22,1,.36,1)", vivos = new Set();
  app.querySelectorAll("[data-fz]").forEach(e => {
    const f = foto[e.dataset.fz], r = e.getBoundingClientRect(); vivos.add(e.dataset.fz);
    if (!f) e.animate([{opacity: 0, transform: "scale(.98)"}, {opacity: 1, transform: "none"}], {duration: d, easing: ease});
    else if (Math.abs(f.x - r.left) > 1 || Math.abs(f.y - r.top) > 1) e.animate([{transform: `translate(${f.x - r.left}px,${f.y - r.top}px)`}, {transform: "none"}], {duration: d, easing: ease});
  });
  const cont = app.querySelector(".tbl") || app; let n = 0;
  for (const id in foto) {
    if (vivos.has(id) || ++n > 30) continue;
    const f = foto[id], g = f.el, c = cont.getBoundingClientRect();
    if (getComputedStyle(cont).position === "static") cont.style.position = "relative";
    g.setAttribute("aria-hidden", "true"); g.inert = true;
    Object.assign(g.style, {position: "absolute", margin: "0", pointerEvents: "none", zIndex: "1", left: (f.x - c.left - cont.clientLeft) + "px", top: (f.y - c.top - cont.clientTop) + "px", width: f.w + "px", height: f.h + "px"});
    cont.appendChild(g);
    g.animate([{opacity: 1, transform: "none"}, {opacity: 0, transform: "scale(.98)"}], {duration: fzMs("--duration-quick", 150), easing: ease, fill: "forwards"}).onfinish = () => g.remove();
  }
}

/* ---------- aviso: o visto que se desenha quando deu certo; a tremida curta quando é erro, depois que ele terminou de subir ---------- */
function avisoMov(el, tipo, novo) {
  clearTimeout(FZ.tr); el.classList.remove("fz-treme");
  if (tipo === "ok") {
    const v = el.querySelector(".av-vs");
    if (!fzMov()) { if (v) v.setAttribute("data-state", "in"); }
    else setTimeout(() => { if (v && v.isConnected) Mov.visto(v); }, 90);
    fzFaisca();
  } else if (tipo === "erro" && fzMov()) {
    FZ.tr = setTimeout(() => { void el.offsetWidth; el.classList.add("fz-treme"); FZ.tr = setTimeout(() => el.classList.remove("fz-treme"), fzMs("--duration-quick", 150) + 30); }, novo ? fzMs("--duration-medium", 350) : 0);
  }
}
/* faíscas: só no botão dourado (ação principal), e só quando o aviso diz que deu certo */
document.addEventListener("pointerdown", e => { const b = e.target.closest && e.target.closest(".b.p"); if (b) FZ.bt = {x: e.clientX, y: e.clientY, t: Date.now()}; }, true);
function fzFaisca() {
  const p = FZ.bt; FZ.bt = null; if (!p || Date.now() - p.t > 2500 || !fzMov()) return;
  const s = document.createElement("span"); s.className = "fz-spk"; s.setAttribute("aria-hidden", "true"); s.style.left = p.x + "px"; s.style.top = p.y + "px";
  for (let i = 0; i < 8; i++) { const r = document.createElement("i"); r.style.setProperty("--r", (i * 45) + "deg"); s.appendChild(r); }
  document.body.appendChild(s); setTimeout(() => s.remove(), fzMs("--duration-very-slow", 500) + 40);
}

/* ---------- Painel: os itens entram em sequência (40 ms entre um e outro, até o 6º) e o fim desfoca quando tem mais ---------- */
function fzSequencia(raiz) {
  if (!raiz || !fzMov()) return;
  raiz.querySelectorAll(".pn-f > *, .pn-l > li, .pn-vr, .pn-cm").forEach((x, i) => { if (i < 12) { x.style.setProperty("--i", Math.min(i, 5)); x.classList.remove("fz-li"); void x.offsetWidth; x.classList.add("fz-li"); } });
}
function fzFimLista(c) { if (c) c.classList.toggle("fz-mais", c.scrollHeight - c.scrollTop - c.clientHeight > 6); }

/* ---------- janela: conteúdo novo começa do zero (a Versões não herda o deslize da gaveta que estava saindo) ---------- */
const fzShowModal = HTMLDialogElement.prototype.showModal;
HTMLDialogElement.prototype.showModal = function () { if (this.id === "dlg" && !this.open) this.getAnimations().forEach(a => a.cancel()); return fzShowModal.call(this); };
new MutationObserver(() => {

/* ===== v1.6.0 parte 4 · Fatia E: movimento do telão e do celular do participante =====
   O telão e o celular são redesenhados a cada novidade (alguém entra, alguém responde, uma resposta atrasada chega).
   A entrada só acontece quando a etapa muda. Se a tela for redesenhada no meio da entrada, as animações recomeçam do ponto
   em que estavam (atraso negativo, FZ_OFF), então nada pula nem apaga de novo. Sem animação, tudo aparece no estado final. */
const TEL = {chave: null, ant0: null, t0: 0};
const CELM = {tela: null, t0: 0};
const FZ_JANELA = 2400;   /* depois disso, a entrada já terminou: redesenho não refaz nada */
let FZ_OFF = 0;
const fzEase = "cubic-bezier(.22,1,.36,1)";
const fzA = (el, kf, o) => el && el.animate ? el.animate(kf, Object.assign({easing: fzEase, fill: "backwards"}, o, {delay: (o.delay || 0) - FZ_OFF})) : null;
function fzEntra(els, o = {}) {
  const d = o.d || fzMs("--duration-medium", 350), passo = o.passo == null ? fzMs("--duration-stagger", 40) : o.passo, max = o.max == null ? 6 : o.max, y = o.y == null ? 14 : o.y, base = o.atraso || 0;
  [...els].filter(Boolean).forEach((e, i) => fzA(e, [{opacity: 0, transform: `translateY(${y}px)${o.esc ? " scale(" + o.esc + ")" : ""}`}, {opacity: 1, transform: "none"}], {duration: d, delay: base + Math.min(i, max) * passo}));
}
/* três pontos que acendem uma vez, um depois do outro (Conferindo, Conectando); acesos é o estado normal */
function fzPontos(raiz) { raiz.querySelectorAll(".cf-pt i").forEach((i, n) => fzA(i, [{opacity: .25}, {opacity: 1}], {duration: fzMs("--duration-fast", 250), delay: n * fzMs("--duration-medium", 350)})); }
function telChave(sn) { if (!sn) return "nada"; const f = sn.fase || {}; return [sn.id, f.etapa, f.idx, f.conf ? "c" : (f.etapa === "resultado" ? "r" : "")].join("|"); }
function telAntes(w) { return {nomes: new Set([...w.querySelectorAll(".cw")].map(e => e.dataset.n || e.textContent))}; }
function telMov(w, sn, antes) {
  const k = telChave(sn), agora = performance.now(), novo = k !== TEL.chave;
  if (novo) { TEL.ant0 = TEL.chave; TEL.chave = k; TEL.t0 = agora; }
  const t = w.querySelector(".tel"); if (!t || !fzMov()) return;
  const desde = agora - TEL.t0;
  if (!novo) {   /* mesma etapa: quem acabou de entrar na sala aparece suave */
    if (antes) w.querySelectorAll(".cw").forEach(e => { if (!antes.nomes.has(e.dataset.n || e.textContent)) fzA(e, [{opacity: 0, transform: "scale(.9)"}, {opacity: 1, transform: "none"}], {duration: fzMs("--duration-fast", 250)}); });
    if (desde > FZ_JANELA) return;
  }
  FZ_OFF = novo ? 0 : desde;
  try { telEntrada(t, sn, TEL.ant0, antes && !novo ? antes.nomes : null); } finally { FZ_OFF = 0; }
}
function telEntrada(t, sn, ant, jaTinha) {
  const f = sn && sn.fase || {}, et = f.etapa, pa = (ant || "").split("|"), mesmoItem = !!sn && pa[0] === sn.id && +pa[2] === f.idx && ["pergunta", "resultado"].includes(pa[1]) && ["pergunta", "resultado"].includes(et);
  if (!mesmoItem) fzEntra(t.querySelectorAll(".tt > b, .tt > span:not(.pillk), .tt .tprog"), {d: fzMs("--duration-quick", 150), y: 0, passo: 0});
  if (!sn) { fzEntra(t.querySelectorAll(".vaz > div")); return; }
  if (et === "espera") fzEntra([t.querySelector(".join"), t.querySelector(".rh"), ...[...t.querySelectorAll(".cw")].filter(e => !jaTinha || jaTinha.has(e.dataset.n || e.textContent)), ...t.querySelectorAll(".facts > div")], {max: 12});
  else if (et === "explicacao") fzEntra(t.querySelectorAll(".expl > *"));
  else if (et === "pergunta" || et === "resultado") {
    if (!mesmoItem) {
      fzEntra([t.querySelector(".tq")]);
      fzEntra(t.querySelectorAll(".tile, .ordl > div"), {d: fzMs("--duration-fast", 250), y: 0, esc: .96, atraso: 80});
      fzEntra(t.querySelectorAll(".answ > *"), {d: fzMs("--duration-fast", 250), y: 0, passo: 0, atraso: 150});
    }
    if (f.conf) fzPontos(t);
    else if (et === "resultado") {   /* revelar: véu nas erradas, contorno na certa; a letra das erradas some e volta já na cor nova (não troca seca) */
      const d = fzMs("--duration-medium", 350);
      t.querySelectorAll(".tile.off").forEach(e => { try { e.animate([{opacity: 0}, {opacity: .72}], {duration: d, easing: fzEase, pseudoElement: "::before", fill: "backwards", delay: -FZ_OFF}); } catch (x) {} fzEntra(e.children, {d: fzMs("--duration-fast", 250), y: 0, passo: 0, atraso: 100}); });
      t.querySelectorAll(".tile.cor").forEach(e => { try { e.animate([{opacity: 0, transform: "scale(1.04)"}, {opacity: 1, transform: "none"}], {duration: d, easing: fzEase, pseudoElement: "::after", fill: "backwards", delay: -FZ_OFF}); } catch (x) {} });
      fzEntra(t.querySelectorAll(".tile.cor .pc, .ordl > div"), {d: fzMs("--duration-fast", 250), y: 0, esc: .96});
      fzEntra(t.querySelectorAll(".answ > *"), {d: fzMs("--duration-fast", 250), y: 6, passo: 0});
    }
  } else if (et === "podio") {
    fzEntra(t.querySelectorAll(".podl > div:first-child, .podr"));
    t.querySelectorAll(".pq .bar i").forEach((b, i) => fzA(b, [{transform: "scaleY(0)"}, {transform: "none"}], {duration: fzMs("--duration-very-slow", 500), delay: 150 + Math.min(i, 10) * fzMs("--duration-stagger", 40)}));
    fzEntra(t.querySelectorAll(".pq b, .pq > div > span:last-child"), {d: fzMs("--duration-fast", 250), y: 0, passo: 0, atraso: 400});
    /* blocos do pódio sobem: 3º, 2º e por último o 1º */
    const ord = {p3: 300, p2: 450, p1: 600};
    t.querySelectorAll(".stage .pl").forEach(pl => {
      const pos = pl.classList.contains("p1") ? "p1" : pl === pl.parentElement.firstElementChild ? "p2" : "p3", at = ord[pos];
      fzA(pl.querySelector(".blk"), [{transform: "scaleY(0)"}, {transform: "none"}], {duration: fzMs("--duration-very-slow", 500), delay: at});
      fzA(pl.querySelector(".avb, .av"), [{opacity: 0, transform: "translateY(20px)"}, {opacity: 1, transform: "none"}], {duration: fzMs("--duration-medium", 350), delay: at + 300});
    });
    fzFesta(t, t.querySelector(".stage .p1 .blk") || t.querySelector(".podl h2"), 1000);
  }
}
/* festa do pódio: os papéis coloridos saem uma vez de cima do 1º lugar e somem (500 ms cada), nada que cai sem parar.
   O bloco ainda está achatado quando a festa é marcada: o topo é calculado pela base e pela altura de verdade dele. */
function fzFesta(t, alvo, atraso) {
  const c = t.querySelector(".conf"); if (!c || !alvo) return;
  const rt = t.getBoundingClientRect(), k = rt.width / 1280 || 1, ra = alvo.getBoundingClientRect();
  const x0 = (ra.left + ra.width / 2 - rt.left) / k, y0 = (ra.bottom - rt.top) / k - alvo.offsetHeight;
  [...c.children].forEach((p, n) => {
    const ang = (-90 + ((n * 47) % 140) - 70) * Math.PI / 180, dist = 120 + (n * 53) % 150, dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist + 40, rot = ((n * 97) % 360) - 180;
    p.style.left = x0 + "px"; p.style.top = y0 + "px";
    fzA(p, [{opacity: 1, transform: "translate(-50%,0) rotate(0deg)"}, {opacity: 0, transform: `translate(calc(-50% + ${dx}px),${dy}px) rotate(${rot}deg)`}], {duration: fzMs("--duration-very-slow", 500), delay: atraso + (n % 6) * fzMs("--duration-stagger", 40), easing: "cubic-bezier(.16,1,.3,1)", fill: "both"});
  });
}
/* celular do participante: a tela nova entra; as alternativas em sequência; o visto e o cartão do resultado aparecem.
   Redesenho na mesma tela (alguém entrou, chegou a contagem) continua de onde estava. */
function celMov(antes, tela) {
  const agora = performance.now();
  if (tela !== CELM.tela) { CELM.tela = tela; CELM.t0 = agora; }
  if (!fzMov()) return;
  const desde = antes === tela ? agora - CELM.t0 : 0;
  if (antes === tela && desde > FZ_JANELA) return;
  const cb = $("#app .cb"); if (!cb) return;
  FZ_OFF = desde;
  try {
    fzEntra(cb.children, {d: fzMs("--duration-fast", 250), y: 10});
    fzEntra(cb.querySelectorAll(".ct2, .ot"), {d: fzMs("--duration-fast", 250), y: 0, esc: .97, atraso: 80});
    cb.querySelectorAll(".ok-i").forEach(e => fzA(e, [{opacity: 0, transform: "scale(.8)"}, {opacity: 1, transform: "none"}], {duration: fzMs("--duration-fast", 250), delay: 80}));
    fzPontos(cb);
  } finally { FZ_OFF = 0; }
}

function render() {
  fzAntes();
  if (!S) return;
  const r = rota(); if (intAntesRender(r.v)) return; menu(r.v);
  document.body.classList.toggle("modo-telao", r.v === "telao");
  document.body.classList.toggle("modo-cel", r.v === "entrar");
  if (r.v !== "entrar" && CE.chave) pararCel();
  if (r.v === "inicio") vInicio();
  else if (r.v === "treinos") vTreinos();
  else if (r.v === "aplicar") vAplicar(r.id);
  else if (r.v === "editar") vEditar(r.id);
  else if (r.v === "entrar") vCelular(r.id, r.x);
  else if (r.v === "sala") vSala(r.id);
  else if (r.v === "telao") vTelao(r.id);
  else if (r.v === "apresentar") vApresentar(r.id);
  else if (r.v === "ajustes") vAjustes();
  else if (r.v === "relatorios") vRelatorios(r.id);
  else if (r.v === "conferir") vConferir();
  else if (r.v === "pendencias") vPendencias();
  else if (r.v === "pessoas") vPessoas(r.id);
  else if (r.v === "mensagens") vMensagens();
  else if (r.v === "mais") vMais();
  else { location.replace("#/inicio"); return; }
  document.title = "Sabiá" + (r.v === "inicio" ? "" : " · " + (($("#tb h1") || {}).textContent || ""));
  intPosRender(); cascaDepois(); fzDepois();
}
let ultimaRota = "";
window.addEventListener("hashchange", () => { const r = rota(); if (r.v !== ultimaRota) { ultimaRota = r.v; const m = $("#app"); render(); m && m.scrollTo && m.scrollTo(0, 0); } else render(); });
(async function init() {
  await carregar(); aplicarTema();
  if (new URLSearchParams(location.search).get("demo") === "1" && !S.treinamentos.length) { MODELOS.forEach(m => criarDeModelo(m)); }
  ultimaRota = rota().v; render(); casca.pronta = true; dur("fast"); intArrancar();
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
