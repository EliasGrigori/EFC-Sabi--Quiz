<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E4A48">
<title>Sabiá</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<script>try{var t=localStorage.getItem("sabia-tema");if(t==="claro"||t==="escuro")document.documentElement.setAttribute("data-theme",t==="escuro"?"dark":"light")}catch(e){}</script>
<style>
/* Sabiá v0.1.0 · sistema visual: petróleo + laranja sabiá · Bricolage Grotesque + Atkinson Hyperlegible */
:root{
  --bg:#EDF1F1;--surface:#FFFFFF;--surface2:#F5F8F8;--sunk:#E2E9E8;--ink:#122120;--ink2:#4A5C5B;--ink3:#6B7F7D;--line:#D5DEDD;
  --brand:#0E4A48;--brand-hi:#18645F;--on-brand:#E4F2F0;--on-brand-2:#9BC3BF;--brand-ink:#0F5A56;
  --sabia:#D45D17;--sabia-hi:#B84D10;--sabia-soft:#FBE6D8;--on-sabia:#FFFFFF;
  --ok:#1B7A4B;--ok-soft:#DCF0E4;--warn:#9A6200;--warn-soft:#F7EACD;--bad:#B3302A;--bad-soft:#F6DCD9;
  --e1:0 1px 2px rgb(18 33 32/.06),0 2px 8px rgb(18 33 32/.06);
  --e2:0 2px 4px rgb(18 33 32/.06),0 10px 28px rgb(18 33 32/.10);
  --e3:0 4px 10px rgb(18 33 32/.08),0 22px 56px rgb(18 33 32/.18);
  --f-disp:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:16px;--rs:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1514;--surface:#14201F;--surface2:#192826;--sunk:#0A1110;--ink:#E5EEED;--ink2:#A6B8B6;--ink3:#8CA19E;--line:#253634;
  --brand:#0A2F2E;--brand-hi:#15514D;--on-brand:#DDEDEB;--on-brand-2:#86AEA9;--brand-ink:#5CC2B9;
  --sabia:#EE7631;--sabia-hi:#FF8A47;--sabia-soft:#3A2416;--on-sabia:#1A0C04;
  --ok:#4FC587;--ok-soft:#14301F;--warn:#E3A83A;--warn-soft:#33270F;--bad:#F0716A;--bad-soft:#3A1715;
  --e1:0 1px 2px rgb(0 0 0/.3),0 2px 8px rgb(0 0 0/.25);--e2:0 2px 4px rgb(0 0 0/.3),0 10px 28px rgb(0 0 0/.35);--e3:0 4px 10px rgb(0 0 0/.35),0 22px 56px rgb(0 0 0/.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1514;--surface:#14201F;--surface2:#192826;--sunk:#0A1110;--ink:#E5EEED;--ink2:#A6B8B6;--ink3:#8CA19E;--line:#253634;
  --brand:#0A2F2E;--brand-hi:#15514D;--on-brand:#DDEDEB;--on-brand-2:#86AEA9;--brand-ink:#5CC2B9;
  --sabia:#EE7631;--sabia-hi:#FF8A47;--sabia-soft:#3A2416;--on-sabia:#1A0C04;
  --ok:#4FC587;--ok-soft:#14301F;--warn:#E3A83A;--warn-soft:#33270F;--bad:#F0716A;--bad-soft:#3A1715;
  --e1:0 1px 2px rgb(0 0 0/.3),0 2px 8px rgb(0 0 0/.25);--e2:0 2px 4px rgb(0 0 0/.3),0 10px 28px rgb(0 0 0/.35);--e3:0 4px 10px rgb(0 0 0/.35),0 22px 56px rgb(0 0 0/.5);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-disp);margin:0;letter-spacing:-.01em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mut{color:var(--ink2)}
.sm{font-size:13px}
:focus-visible{outline:2px solid var(--sabia);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* casca */
.app{display:grid;grid-template-columns:84px minmax(0,1fr);height:100dvh}
.rail{background:var(--brand);color:var(--on-brand);display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;padding-left:max(8px,env(safe-area-inset-left))}
.rail .lg{width:64px;height:64px;display:grid;place-items:center;margin-bottom:8px}
.rail .lg{overflow:hidden}.rail .lg svg{width:100%;height:100%;display:block}
.ri{width:68px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 6px;border:0;background:none;color:var(--on-brand-2);font-size:12px;font-weight:500;cursor:pointer;text-decoration:none;position:relative;border-radius:12px}
.ri .pill{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .15s}
.ri:hover .pill{background:rgb(255 255 255/.08)}
.ri[aria-current="page"]{color:#fff}
.ri[aria-current="page"] .pill{background:var(--sabia);color:var(--on-sabia)}
.ri .n{position:absolute;top:2px;right:8px;min-width:18px;height:18px;border-radius:9px;background:var(--sabia);color:var(--on-sabia);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.rail .sp{flex:1}
.mn{display:flex;flex-direction:column;min-width:0;min-height:0}
.tb{display:flex;align-items:center;gap:12px;padding:14px 24px 10px;padding-right:max(24px,env(safe-area-inset-right));flex-wrap:wrap}
.tb h1{font-size:24px;font-weight:800;line-height:1.1}
.tb .sub{color:var(--ink2);font-size:14px}
.tb .grow{flex:1}
.body{flex:1;overflow:auto;padding:4px 24px 24px;padding-right:max(24px,env(safe-area-inset-right));display:grid;gap:14px;align-content:start}
.bnav{display:none}

/* botões e campos */
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;color:var(--ink);box-shadow:var(--e1);white-space:nowrap}
.b:hover{border-color:var(--ink3)}
.b.p{background:var(--sabia);border-color:var(--sabia);color:var(--on-sabia)}
.b.p:hover{background:var(--sabia-hi)}
.b.s{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.b.g{box-shadow:none;background:transparent}
.b.ic{width:44px;padding:0;flex:none}
.b.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.b[disabled]{opacity:.5;cursor:not-allowed}
.b.bad{color:var(--bad)}
.fd{display:grid;gap:4px;min-width:0}
.fd label,.lbl{font-size:12px;font-weight:700;color:var(--ink2)}
.in{min-height:44px;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.k{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--e1);padding:14px 16px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--sunk);color:var(--ink2)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.br{background:var(--sabia-soft);color:var(--sabia-hi)}

/* início */
.home{grid-template-columns:repeat(12,minmax(0,1fr));align-items:start}
.coach{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--brand);color:var(--on-brand);border-color:transparent}
.coach .ms{width:76px;height:76px;display:grid;place-items:center}
.coach .ms{overflow:hidden}.coach .ms svg{width:100%;height:100%;display:block}
.coach .eb{font-size:12px;font-weight:700;color:var(--on-brand-2);text-transform:uppercase;letter-spacing:.06em}
.coach h2{font-size:20px;color:#fff;margin:2px 0}
.coach p{margin:0;color:var(--on-brand-2);font-size:14px}
.coach .acts{display:flex;gap:8px;flex-wrap:wrap}
.coach .b.g{color:var(--on-brand);border-color:var(--on-brand-2)}
.kpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:0}
.kp{padding:12px 16px;border-right:1px solid var(--line)}
.kp:last-child{border:0}
.kp .v{font-family:var(--f-disp);font-weight:800;font-size:28px;line-height:1.1}
.kp .l{font-size:13px;color:var(--ink2)}
.mini{grid-column:span 6}
.mini .kh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.mini h3{font-size:16px}
.rows{display:grid}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row>div{flex:1;min-width:0}
.row b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl{grid-column:1/-1;padding:0;overflow:hidden}

/* lista de treinamentos */
.tbar{display:flex;gap:10px;align-items:center;padding:12px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px}
.seg button{border:0;background:none;min-height:38px;padding:0 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink2);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--e1)}
.seg i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--ink3)}
.srch{position:relative;flex:1;min-width:180px}
.srch svg{position:absolute;left:12px;top:12px;color:var(--ink3);width:20px;height:20px}
.srch .in{padding-left:40px}
.fpan{display:flex;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--line)}
.tr{display:grid;grid-template-columns:minmax(0,2.4fr) 64px 92px 150px 276px;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.tr.h{border-top:0;font-size:12px;font-weight:700;color:var(--ink2);padding-block:8px;background:var(--surface2)}
.tr .t b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .t span{font-size:13px;color:var(--ink2)}
.tr .acts{display:flex;gap:6px;justify-content:flex-end}
.meta-bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:4px}
.meta-bar i{display:block;height:100%;background:var(--brand-ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:14px 16px}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;background:var(--surface)}
.card b{font-family:var(--f-disp);font-size:17px}
.vazio{padding:28px 16px;text-align:center;color:var(--ink2);display:grid;gap:10px;justify-items:center}

/* aplicar */
.apl{grid-template-columns:minmax(0,1fr) 340px;align-items:start}
.apl .lc{display:grid;gap:12px}
.sec h3{font-size:16px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.st{width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:13px;font-weight:700;font-family:var(--f-mono)}
.pres{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pr{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);text-align:left;cursor:pointer;display:grid;gap:4px;align-content:start}
.pr[aria-pressed="true"]{border-color:var(--sabia);background:var(--sabia-soft)}
.pr .pic{width:40px;height:40px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;color:var(--brand-ink);margin-bottom:2px}
.pr[aria-pressed="true"] .pic{background:var(--sabia);color:var(--on-sabia)}
.pr b{font-family:var(--f-disp);font-size:16px}
.pr span{font-size:13px;color:var(--ink2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.sc{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.sc[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
details.adv{padding:0}
details.adv summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;min-height:56px}
details.adv summary::-webkit-details-marker{display:none}
details.adv .chev{margin-left:auto;transition:transform .15s;display:grid;place-items:center;width:24px;height:24px}
details.adv .chev svg{width:20px;height:20px}
details.adv[open] .chev{transform:rotate(180deg)}
.advg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 20px;padding:4px 16px 16px;border-top:1px solid var(--line);padding-top:14px}
.opt{display:flex;gap:10px;align-items:flex-start;min-height:44px}
.opt input{width:22px;height:22px;margin-top:2px;accent-color:var(--sabia);flex:none}
.opt small{display:block;color:var(--ink2);font-size:12px;line-height:1.3}
.sum{position:sticky;top:4px;display:grid;gap:10px}
.sum .hd b{font-family:var(--f-disp);font-size:18px;display:block}
.tl{display:grid;gap:0}
.tli{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line);font-size:14px}
.tli:first-child{border-top:0}
.tli .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--f-mono)}
.nd.e{background:var(--sabia-soft);color:var(--sabia-hi);border-color:transparent}

/* ajustes e páginas simples */
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.page{max-width:980px}
.road{display:grid;gap:6px}
.road li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.road ul{list-style:none;margin:0;padding:0}
.road li:first-child{border-top:0}

/* diálogo e aviso */
dialog{border:0;border-radius:20px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--e3);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgb(8 20 19/.55)}
.dl{display:grid;gap:12px;padding:18px}
.dl header{display:flex;align-items:center;gap:10px}
.dl header h2{font-size:20px;flex:1}
.opcao{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;min-height:56px;cursor:pointer}
.opcao:hover{border-color:var(--sabia)}
.opcao .pic{width:40px;height:40px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;color:var(--brand-ink);flex:none}
.opcao b{display:block}
.opcao span.d{font-size:13px;color:var(--ink2)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;box-shadow:var(--e3);max-width:calc(100vw - 24px)}
#toast button{border:0;background:none;color:var(--sabia);font-weight:700;cursor:pointer;min-height:36px;padding:0 8px}
:root[data-theme="dark"] #toast button,:root:not([data-theme="light"]) #toast button{color:var(--sabia)}

@media (max-width:1100px){.apl{grid-template-columns:1fr}.sum{position:static}.mini{grid-column:1/-1}.kpis{grid-template-columns:repeat(2,1fr)}.kp:nth-child(2){border-right:0}.kp:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .rail{display:none}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--brand);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--on-brand-2);font-size:11px;font-weight:500;text-decoration:none;min-height:48px;justify-content:center;position:relative}
  .bnav a[aria-current="page"]{color:#fff}
  .bnav a[aria-current="page"] .pill{background:var(--sabia);color:var(--on-sabia)}
  .bnav .pill{width:48px;height:28px;border-radius:14px;display:grid;place-items:center}
  .tb{padding:12px 16px 8px}.tb h1{font-size:21px}
  .body{padding:4px 16px 16px}
  .coach{grid-template-columns:1fr}.coach .ms{display:none}.coach h2{font-size:18px}
  .tb{flex-wrap:nowrap}.tb .lbl-m{display:none}.tb .b.p{width:44px;padding:0}
  .pres,.fields,.cols,.advg{grid-template-columns:1fr}
  .pr{grid-template-columns:44px 1fr;column-gap:12px;align-items:center;padding:10px 12px}.pr .pic{grid-row:span 2;margin:0}.pr span:not(.pic){grid-column:2}
  .tr{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}
  .tr.h{display:none}.tr .hide-m{display:none}
  .tbar .srch{flex-basis:100%;order:3}
  #toast{bottom:calc(76px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

/* ---------- dados: IndexedDB com reserva em localStorage ---------- */
const DB = {
  db: null,
  abrir() { return new Promise(ok => { try { const r = indexedDB.open("sabia", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => { DB.db = r.result; ok(true); }; r.onerror = () => ok(false); r.onblocked = () => ok(false); } catch(e) { ok(false); } }); },
  ler(k) { return new Promise(ok => { if (!DB.db) return ok(null); try { const q = DB.db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => ok(q.result ?? null); q.onerror = () => ok(null); } catch(e) { ok(null); } }); },
  gravar(k, v) { return new Promise(ok => { if (!DB.db) return ok(false); try { const t = DB.db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => ok(true); t.onerror = () => ok(false); } catch(e) { ok(false); } }); }
};

let tSalvar = 0;
async function gravarAgora() {
  tSalvar = 0;
  const txt = JSON.stringify(S);
  const ok = await DB.gravar("estado", txt);
  if (!ok) { try { localStorage.setItem("sabia-estado", txt); } catch(e) { aviso("Sem espaço para guardar. Exporte seus dados em Ajustes."); } }

/* grava no máximo a cada 120 ms, sempre o estado mais recente (sem adiar para sempre) */
function salvar() { if (!tSalvar) tSalvar = setTimeout(gravarAgora, 120); }
/* ao fechar ou recarregar com gravação pendente, guarda de forma síncrona e o próximo carregamento aproveita */
window.addEventListener("pagehide", () => { if (tSalvar && S) { try { localStorage.setItem("sabia-estado", JSON.stringify(S)); } catch(e) {} } });
async function carregar() {
  let txt = null;
  if (await DB.abrir()) txt = await DB.ler("estado");
  try { const ls = localStorage.getItem("sabia-estado"); if (ls) txt = ls; } catch(e) {}
  S = novoEstado();
  if (txt) { try { const o = JSON.parse(txt); if (o && o.v === 1) S = Object.assign(S, o, {cfg: Object.assign(S.cfg, o.cfg || {})}); } catch(e) {} }
}

function aplicarTema() {

}

}
function importarArquivo(f) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = jsonSolto(String(r.result));   // aceita o arquivo da IA mesmo com texto em volta (v1.5.0)
      if (o && o.sabia === "tudo" && o.dados) {
        const d = o.dados; if (d.v !== 1) throw new Error("versão");
        S = Object.assign(novoEstado(), d, {cfg: Object.assign(novoEstado().cfg, d.cfg || {})}); salvar(); aplicarTema(); render(); aviso("Todos os dados foram importados"); return;
      }
      const lista = Array.isArray(o) ? o : (o && Array.isArray(o.treinamentos) ? o.treinamentos : [o]);
      const novos = lista.map(x => x && x.origem === "sabia-ia" ? iaDeObjeto(x) : validaTreino(x)).filter(Boolean);
      if (!novos.length) throw new Error("vazio");
      S.treinamentos.unshift(...novos); salvar(); render(); aviso(novos.length === 1 ? "Treinamento importado" : novos.length + " treinamentos importados");
    } catch(e) { aviso("Esse arquivo não parece um treinamento do Sabiá ou do EFCquiz"); }
  };
  r.readAsText(f);
}

function filtrar(aba) {
  let l = S.treinamentos.slice();
  const q = UI.q.trim().toLowerCase();
  if (q) l = l.filter(t => t.titulo.toLowerCase().includes(q));
  if (UI.ord === "nome") l.sort((a, b) => a.titulo.localeCompare(b.titulo, "pt-BR"));
  else if (UI.ord === "perguntas") l.sort((a, b) => b.itens.filter(isQ).length - a.itens.filter(isQ).length);
  else if (UI.ord === "meta") l.sort((a, b) => metaEq(b) - metaEq(a));

}

function roteiro(t) {
  const passos = []; let n = 0, seg = 0;
  t.itens.forEach(i => {
    if (i.tipo === "explicacao") { passos.push({n: "E", txt: i.enunciado, s: 120, e: true}); seg += 120; }
    else if (i.uso === "ensaio") { passos.push({n: "T", txt: i.enunciado + " (teste, não vale nota)", s: i.tempo || 20}); seg += i.tempo || 20; }
    else { n++; passos.push({n: String(n), txt: i.enunciado, s: i.tempo || 20}); seg += (i.tempo || 20) + 8; }
  });
  return {passos, min: Math.max(1, Math.round(seg / 60))};
}

function preparar() {

/* ---------- eventos ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  if (a === "novo") dlgNovo("menu");
  else if (a === "dlg") dlgNovo(v);
  else if (a === "fechar") $("#dlg").close();
  else if (a === "usarmodelo") { const m = MODELOS.find(x => x.id === id); if (m) { const t = criarDeModelo(m); $("#dlg").open && $("#dlg").close(); render(); aviso(`"${t.titulo}" criado`); } }
  else if (a === "aba") { UI.aba = v; render(); }
  else if (a === "vista") { UI.vista = v; render(); }
  else if (a === "filtro") { UI.filtro = !UI.filtro; render(); }
  else if (a === "excluir") excluir(id);
  else if (a === "duplicar") duplicar(id);
  else if (a === "exportar") { const t = treino(id); if (t) baixar(slug(t.titulo) + ".json", {sabia: "treinamento", versao: VERSAO, titulo: t.titulo, meta: t.meta, ...(metaPts(t) ? {metaTipo: "pts"} : {}), descricao: t.descricao, reav: t.reav || [], per: t.per || 0, ...(t.material ? {material: {nome: t.material.nome, tipo: t.material.tipo, bytes: t.material.bytes, caps: t.material.caps}} : {}), itens: t.itens}); }
  else if (a === "preset") { const p = PRESETS[v]; UI.apl.preset = v; Object.assign(UI.apl.aj, AJ_PADRAO, p.aj); render(); }
  else if (a === "setor") { const l = UI.apl.setores, i = l.indexOf(v); if (i < 0) l.push(v); else l.splice(i, 1); render(); }
  else if (a === "preparar") preparar();
  else if (a === "tema") { S.cfg.tema = v; aplicarTema(); salvar(); render(); }
  else if (a === "rmsetor") { S.cfg.setores = S.cfg.setores.filter(s => s !== v); salvar(); render(); }
  else if (a === "impor") { $("#arq").value = ""; $("#arq").click(); }
  else if (a === "exptudo") baixar("sabia-dados-" + new Date().toISOString().slice(0, 10) + ".json", {sabia: "tudo", versao: VERSAO, dados: S});
  else if (a === "apagartudo") {
    const d = $("#dlg"); d.innerHTML = `<div class="dl"><header><h2>Apagar tudo?</h2><button class="b ic g" data-act="fechar" aria-label="Fechar">${ic("x")}</button></header><p style="margin:0">Treinamentos, sessões e ajustes deste aparelho serão apagados. Exporte antes se quiser guardar uma cópia.</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="b" data-act="fechar">Cancelar</button><button class="b p" data-act="apagarok">Apagar tudo</button></div></div>`; d.showModal();
  }
  else if (a === "apagarok") { S = novoEstado(); salvar(); aplicarTema(); $("#dlg").close(); ir("#/inicio"); aviso("Dados apagados"); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "busca") { UI.q = t.value; const p = t.selectionStart; render(); const b = $("#busca"); if (b) { b.focus(); b.setSelectionRange(p, p); } }
  else if (t.dataset.f && UI.apl) UI.apl[t.dataset.f] = t.value;
  else if (t.dataset.c) { S.cfg[t.dataset.c] = t.value; salvar(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "ord") { UI.ord = t.value; render(); }
  else if (t.dataset.f && UI.apl) UI.apl[t.dataset.f] = t.value;
  else if (t.dataset.aj && UI.apl) {
    const k = t.dataset.aj;
    if (k === "tempo_fecha") UI.apl.aj.tempo = t.checked ? "fecha" : "livre"; else UI.apl.aj[k] = t.checked;
    const txt = $("#ajTxt"), tr = treino(UI.apl.id);
    if (txt && tr) txt.textContent = ajResumo(UI.apl, tr);
  }
  else if (t.dataset.ajSel && UI.apl) UI.apl.aj[t.dataset.ajSel] = t.value;
  else if (t.id === "arq" && t.files[0]) { importarArquivo(t.files[0]); const d = $("#dlg"); if (d.open) d.close(); }
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if (!f) return; e.preventDefault();
  if (f.dataset.form === "zero") { const t = criarDoZero($("#z-t").value, Math.min(100, Math.max(1, Math.round(Number($("#z-m").value) || 80)))); $("#dlg").close(); ir("#/editar/" + t.id); aviso(`"${t.titulo}" criado. Escreva a primeira pergunta.`); }
  else if (f.dataset.form === "setor") { const i = $("#c-set"), n = i.value.trim(); if (n && !S.cfg.setores.includes(n)) { S.cfg.setores.push(n); salvar(); render(); } }
});

function render() {
  if (!S) return;
  const r = rota(); if (intAntesRender(r.v)) return; menu(r.v);
  document.body.classList.toggle("modo-telao", r.v === "telao");
  document.body.classList.toggle("modo-cel", r.v === "entrar");
  if (r.v !== "entrar" && CE.chave) pararCel();
  if (r.v === "inicio") vInicio();
  else if (r.v === "treinos") vTreinos();
  else if (r.v === "aplicar") vAplicar(r.id);
  else if (r.v === "editar") vEditar(r.id);
  else if (r.v === "entrar") vCelular(r.id, r.x);
  else if (r.v === "sala") vSala(r.id);
  else if (r.v === "telao") vTelao(r.id);
  else if (r.v === "apresentar") vApresentar(r.id);
  else if (r.v === "ajustes") vAjustes();
  else if (r.v === "relatorios") vRelatorios(r.id);
  else if (r.v === "conferir") vConferir();
  else if (r.v === "pendencias") vPendencias();
  else if (r.v === "pessoas") vPessoas(r.id);
  else if (r.v === "mensagens") vMensagens();
  else if (r.v === "mais") vMais();
  else { location.replace("#/inicio"); return; }
  document.title = "Sabiá" + (r.v === "inicio" ? "" : " · " + (($("#tb h1") || {}).textContent || ""));
  intPosRender();
}
let ultimaRota = "";
window.addEventListener("hashchange", () => { const r = rota(); if (r.v !== ultimaRota) { ultimaRota = r.v; const m = $("#app"); render(); m && m.scrollTo && m.scrollTo(0, 0); } else render(); });
(async function init() {
  await carregar(); aplicarTema();
  if (new URLSearchParams(location.search).get("demo") === "1" && !S.treinamentos.length) { MODELOS.forEach(m => criarDeModelo(m)); }
  ultimaRota = rota().v; render(); intArrancar();
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
